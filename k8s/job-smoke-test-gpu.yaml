apiVersion: batch/v1
kind: Job
metadata:
  name: smoke-test-gpu
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      initContainers:
      - name: clone-repo
        image: alpine/git
        args:
        - clone
        - --single-branch
        - --depth=1
        - https://github.com/tgmorton/multi-model-foundry-subject-rearing.git
        - /opt/repo
        resources:
          requests:
            memory: 1Gi
            cpu: "200m"
          limits:
            memory: 1Gi
            cpu: "200m"
        volumeMounts:
        - name: repo
          mountPath: /opt/repo
      containers:
      - name: gpu-smoke-tests
        image: python:3.10-slim
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -e

          pip install --no-cache-dir \
            torch --index-url https://download.pytorch.org/whl/cu121

          cd /opt/repo
          pip install --no-cache-dir \
            -r requirements.txt \
            pytest pytest-timeout

          echo "=== Running GPU smoke tests ==="
          python -m pytest model_foundry/tests/smoke/test_gpu.py \
            -v --tb=short --timeout=120 -m gpu

          echo "=== GPU smoke tests passed ==="
        env:
        - name: PYTHONPATH
          value: "/opt/repo"
        - name: PYTORCH_CUDA_ALLOC_CONF
          value: "expandable_segments:True"
        resources:
          requests:
            memory: 16Gi
            cpu: "4"
            nvidia.com/gpu: 1
          limits:
            memory: 16Gi
            cpu: "4"
            nvidia.com/gpu: 1
        volumeMounts:
        - name: repo
          mountPath: /opt/repo
      volumes:
      - name: repo
        emptyDir: {}
      restartPolicy: Never
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
