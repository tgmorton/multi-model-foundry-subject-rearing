---
# Pre-populate tokenized+chunked caches for the two rater fold corpora
# (shared_unigram tokenizer). Must complete before job-rater-train — the
# training pods only READ caches (sweep-1 race lesson,
# memory/feedback_prerun_caches.md). idx 0 = fold a, idx 1 = fold b;
# distinct corpus paths -> distinct cache keys, so the two pods never race.
apiVersion: batch/v1
kind: Job
metadata:
  name: thomas-rater-precache-en-v1
  labels:
    owner: thomas
    study: subject-drop
    stage: rater-precache
    lang: en
spec:
  backoffLimit: 6
  completionMode: Indexed
  completions: 2
  parallelism: 2
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        owner: thomas
        study: subject-drop
        stage: rater-precache
        lang: en
    spec:
      priorityClassName: armada-default
      imagePullSecrets:
      - name: gitlab-registry-cred-thomas
      initContainers:
      - name: clone-repo
        image: alpine/git
        args:
        - clone
        - --single-branch
        - --depth=1
        - --branch=main
        - https://github.com/tgmorton/multi-model-foundry-subject-rearing.git
        - /opt/repo
        resources:
          requests: {memory: 1Gi, cpu: "200m"}
          limits:   {memory: 1Gi, cpu: "200m"}
        volumeMounts:
        - {name: repo, mountPath: /opt/repo}
      containers:
      - name: precache
        image: gitlab-registry.nrp-nautilus.io/thmorton/multi-model-foundry-subject-rearing:latest
        imagePullPolicy: Always
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -euo pipefail
          FOLD=$([ "$JOB_COMPLETION_INDEX" -eq 0 ] && echo a || echo b)
          echo "=== RATER PRECACHE — fold $FOLD ==="

          cd /opt/repo
          rm -rf /opt/repo/data/raw /opt/repo/data/tokenized /opt/repo/data/chunked /opt/repo/tokenizers
          mkdir -p /mnt/data/tokenized /mnt/data/chunked
          ln -sfn /mnt/data/raw       /opt/repo/data/raw
          ln -sfn /mnt/data/tokenized /opt/repo/data/tokenized
          ln -sfn /mnt/data/chunked   /opt/repo/data/chunked
          ln -sfn /mnt/data/tokenizers /opt/repo/tokenizers
          for d in /opt/repo/data/raw /opt/repo/data/tokenized /opt/repo/data/chunked /opt/repo/tokenizers; do
            [ -L "$d" ] || { echo "FAIL $d is not a symlink"; exit 1; }
          done

          export FOLD MODE=precache
          python3 scripts/rater_agent.py
        env:
        - {name: PYTHONPATH, value: "/opt/repo"}
        resources:
          # Half-corpus (45M words) SP-unigram tokenize+chunk; the full-90M
          # cells ran in 16Gi, so 12Gi is comfortable for a fold.
          requests: {memory: 12Gi, cpu: "4"}
          limits:   {memory: 12Gi, cpu: "4"}
        volumeMounts:
        - {name: repo, mountPath: /opt/repo}
        - {name: data, mountPath: /mnt/data}
      volumes:
      - {name: repo, emptyDir: {}}
      - name: data
        persistentVolumeClaim:
          claimName: subject-drop-archive
      restartPolicy: Never
