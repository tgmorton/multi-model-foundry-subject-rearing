apiVersion: batch/v1
kind: Job
metadata:
  name: corpus-annotate-test-10m
spec:
  backoffLimit: 3
  template:
    spec:
      nodeSelector:
        nvidia.com/gpu.product: NVIDIA-GeForce-RTX-3090
      initContainers:
      - name: clone-repo
        image: alpine/git
        args:
        - clone
        - --single-branch
        - --depth=1
        - https://github.com/tgmorton/multi-model-foundry-subject-rearing.git
        - /opt/repo
        resources:
          requests:
            memory: 1Gi
            cpu: "200m"
          limits:
            memory: 1Gi
            cpu: "200m"
        volumeMounts:
        - name: repo
          mountPath: /opt/repo
      containers:
      - name: annotator
        image: nvidia/cuda:11.8.0-runtime-ubuntu22.04
        command: ["/bin/bash", "-c"]
        args:
        - |
          apt-get update && apt-get install -y python3 python3-pip &&
          pip install --no-cache-dir spacy spacy-transformers pydantic tqdm pyyaml pyarrow polars &&
          python3 -m spacy download en_core_web_trf &&
          cd /opt/repo &&
          python3 scripts/generate_childes_metadata.py \
            /mnt/data/raw/test_10M/childes.test \
            -o /mnt/data/raw/test_10M/childes_metadata.json &&
          python3 -m analysis.corpus_descriptives.run \
            --config configs/corpus_analysis_test10m.yaml \
            --annotate
        resources:
          requests:
            memory: 8Gi
            cpu: "7"
            nvidia.com/gpu: 1
          limits:
            memory: 8Gi
            cpu: "7"
            nvidia.com/gpu: 1
        volumeMounts:
        - name: repo
          mountPath: /opt/repo
        - name: data
          mountPath: /mnt/data
      volumes:
      - name: repo
        emptyDir: {}
      - name: data
        persistentVolumeClaim:
          claimName: corpus-analysis-data
      restartPolicy: Never
