apiVersion: batch/v1
kind: Job
metadata:
  name: europarl-data-gen
  namespace: lemn-lab
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 1
  template:
    spec:
      initContainers:
      - name: clone-repo
        image: alpine/git
        args:
        - clone
        - --single-branch
        - --depth=1
        - https://github.com/tgmorton/multi-model-foundry-subject-rearing.git
        - /opt/repo
        resources:
          requests:
            memory: 1Gi
            cpu: "200m"
          limits:
            memory: 1Gi
            cpu: "200m"
        volumeMounts:
        - name: repo
          mountPath: /opt/repo
      containers:
      - name: data-gen
        image: python:3.10-slim
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -e

          # Install PyTorch with CUDA 12.1
          pip install --no-cache-dir \
            torch --index-url https://download.pytorch.org/whl/cu121

          # Install project deps + spaCy models
          cd /opt/repo
          pip install --no-cache-dir \
            -r requirements.txt \
            accelerate>=0.26.0 \
            sentencepiece

          # Pin spaCy model versions explicitly (spacy download CLI
          # generates malformed URLs on some builds)
          pip install --no-cache-dir \
            https://github.com/explosion/spacy-models/releases/download/en_core_web_trf-3.7.3/en_core_web_trf-3.7.3-py3-none-any.whl \
            https://github.com/explosion/spacy-models/releases/download/it_core_news_lg-3.7.0/it_core_news_lg-3.7.0-py3-none-any.whl

          # Stage Europarl source data: try source PVC first, else download
          mkdir -p data/italian/europarl.en
          if [ -f /mnt/source/italian/europarl.en/europarl-v7.it-en.en.train ]; then
            echo "=== Europarl data found on source PVC ==="
            ln -sf /mnt/source/italian/europarl.en/europarl-v7.it-en.en.train data/italian/europarl.en/
            ln -sf /mnt/source/italian/europarl.en/europarl-v7.it-en.it.train data/italian/europarl.en/
          elif [ -f /mnt/data/italian/europarl.en/europarl-v7.it-en.en.train ]; then
            echo "=== Europarl data found on output PVC ==="
            ln -sf /mnt/data/italian/europarl.en/europarl-v7.it-en.en.train data/italian/europarl.en/
            ln -sf /mnt/data/italian/europarl.en/europarl-v7.it-en.it.train data/italian/europarl.en/
          else
            echo "=== Downloading Europarl v7 IT-EN ==="
            apt-get update && apt-get install -y wget
            wget -q https://www.statmt.org/europarl/v7/it-en.tgz -O /tmp/it-en.tgz
            tar xzf /tmp/it-en.tgz -C /tmp/
            mv /tmp/europarl-v7.it-en.en data/italian/europarl.en/europarl-v7.it-en.en.train
            mv /tmp/europarl-v7.it-en.it data/italian/europarl.en/europarl-v7.it-en.it.train
            # Persist to output PVC for future use
            mkdir -p /mnt/data/italian/europarl.en
            cp data/italian/europarl.en/europarl-v7.it-en.*.train /mnt/data/italian/europarl.en/
            rm /tmp/it-en.tgz
          fi

          echo "EN lines: $(wc -l < data/italian/europarl.en/europarl-v7.it-en.en.train)"
          echo "IT lines: $(wc -l < data/italian/europarl.en/europarl-v7.it-en.it.train)"

          # ── Step 1: Generate 500K aligned training data ──
          echo "=== Generating 500K training pairs ==="
          python -c "
          from analysis.pronoun_recovery.config import EuroparlAlignmentConfig, load_config
          from analysis.pronoun_recovery.parallel_data.generator import EuroparlAlignmentGenerator
          cfg = load_config('configs/pronoun_recovery_it_europarl_train_k8s.yaml', EuroparlAlignmentConfig)
          EuroparlAlignmentGenerator(cfg).run()
          "

          # ── Step 2: Generate held-out test set (10K pairs) ──
          echo "=== Generating test set ==="
          python -c "
          from analysis.pronoun_recovery.config import EuroparlAlignmentConfig, load_config
          from analysis.pronoun_recovery.parallel_data.generator import EuroparlAlignmentGenerator
          cfg = load_config('configs/pronoun_recovery_it_europarl_test_k8s.yaml', EuroparlAlignmentConfig)
          EuroparlAlignmentGenerator(cfg).run()
          "

          # ── Step 3: Create 100K and 300K subsets ──
          echo "=== Creating data scale subsets ==="
          python -c "
          from analysis.pronoun_recovery.parallel_data.passage_packer import (
              pack_checkpoint_file,
          )
          from pathlib import Path

          for scale, end_line in [(100000, 100000), (300000, 300000)]:
              print(f'Packing {scale} subset...')
              pack_checkpoint_file(
                  checkpoint_path=Path('data/pronoun_recovery/europarl_aligned/it_train/aligned_checkpoint.jsonl'),
                  it_file_path=Path('data/italian/europarl.en/europarl-v7.it-en.it.train'),
                  output_path=Path(f'data/pronoun_recovery/europarl_aligned/it_train/packed_{scale}.jsonl'),
                  start_line=0,
                  end_line=end_line,
                  max_words=180,
              )
          import shutil
          shutil.copy(
              'data/pronoun_recovery/europarl_aligned/it_train/packed_checkpoint.jsonl',
              'data/pronoun_recovery/europarl_aligned/it_train/packed_500000.jsonl',
          )
          print('Done creating subsets.')
          "

          # ── Step 4: Copy outputs to PVC ──
          echo "=== Copying outputs to PVC ==="
          mkdir -p /mnt/data/pronoun_recovery/europarl_aligned
          cp -r data/pronoun_recovery/europarl_aligned/it_train /mnt/data/pronoun_recovery/europarl_aligned/
          cp -r data/pronoun_recovery/europarl_aligned/it_test /mnt/data/pronoun_recovery/europarl_aligned/

          # Print summary
          echo "=== Data generation complete ==="
          for f in /mnt/data/pronoun_recovery/europarl_aligned/it_train/packed_*.jsonl; do
            echo "$(wc -l < $f) passages in $(basename $f)"
          done
          echo "$(wc -l < /mnt/data/pronoun_recovery/europarl_aligned/it_test/packed_checkpoint.jsonl) test passages"
        env:
        - name: PYTHONPATH
          value: "/opt/repo"
        - name: PYTORCH_CUDA_ALLOC_CONF
          value: "expandable_segments:True"
        resources:
          requests:
            memory: 24Gi
            cpu: "8"
            nvidia.com/gpu: 1
          limits:
            memory: 24Gi
            cpu: "8"
            nvidia.com/gpu: 1
        volumeMounts:
        - name: repo
          mountPath: /opt/repo
        - name: data
          mountPath: /mnt/data
        - name: source-data
          mountPath: /mnt/source
          readOnly: true
      volumes:
      - name: repo
        emptyDir: {}
      - name: data
        persistentVolumeClaim:
          claimName: europarl-sweep-data
      - name: source-data
        persistentVolumeClaim:
          claimName: pronoun-sweep-data
      restartPolicy: Never
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
