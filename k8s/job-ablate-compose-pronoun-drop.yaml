---
# Graded pronoun-drop corpora (recoverability study): 19 conditions.
#   idx 0-9  -> pronoun_drop_info_{10..100}   (external-surprisal ranked)
#   idx 10-18 -> pronoun_drop_rand_{10..90}   (seeded random, matched rates)
# (rand_100 == info_100 by construction: both remove the full population.)
#
# Per pod: pull frozen selection v2 from S3 -> ablate train + pool
# (skip_backfill, graded module keyed on DocBin line/token addresses) ->
# compose with STRICT word-matching (no --allow-short: measured pool
# margins are 1.30-4.89x at K=100, so a shortfall means a bug).
# Selection: s3://thomas-subject-drop-artifacts/recoverability/analysis/selection/
apiVersion: batch/v1
kind: Job
metadata:
  name: thomas-ablate-compose-pronoun-drop-v1
  labels:
    owner: thomas
    study: subject-drop
    lang: en
    stage: ablate-compose
spec:
  completionMode: Indexed
  completions: 19
  parallelism: 8
  backoffLimit: 8
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        owner: thomas
        study: subject-drop
        lang: en
        stage: ablate-compose
    spec:
      priorityClassName: armada-default
      imagePullSecrets:
      - name: gitlab-registry-cred-thomas
      restartPolicy: Never
      initContainers:
      - name: clone-repo
        image: alpine/git
        args:
        - clone
        - --single-branch
        - --depth=1
        - --branch=main
        - https://github.com/tgmorton/multi-model-foundry-subject-rearing.git
        - /opt/repo
        resources:
          requests: {memory: 1Gi, cpu: "200m"}
          limits:   {memory: 1Gi, cpu: "200m"}
        volumeMounts:
        - {name: repo, mountPath: /opt/repo}
      containers:
      - name: ablator
        image: gitlab-registry.nrp-nautilus.io/thmorton/multi-model-foundry-subject-rearing:latest
        imagePullPolicy: Always
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -euo pipefail
          IDX=${JOB_COMPLETION_INDEX}
          if [ "$IDX" -lt 10 ]; then ARM=info; K=$(( (IDX + 1) * 10 ));
          else ARM=rand; K=$(( (IDX - 9) * 10 )); fi
          SLUG=pronoun_drop_${ARM}_${K}
          echo "============================================================"
          echo "  Pod $IDX: arm=$ARM k=$K slug=$SLUG"
          echo "============================================================"

          export PYTHONPATH="/opt/repo:${PYTHONPATH:-}"
          cd /opt/repo

          # --- Pull frozen selection v2 (small parquets) from S3 ----------
          python -c "
          import boto3, pathlib
          s3 = boto3.client('s3')
          bucket = 'thomas-subject-drop-artifacts'
          pre = 'recoverability/analysis/selection/'
          for page in s3.get_paginator('list_objects_v2').paginate(Bucket=bucket, Prefix=pre):
              for o in page.get('Contents', []):
                  dest = pathlib.Path('/tmp/selection') / o['Key'][len(pre):]
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  s3.download_file(bucket, o['Key'], str(dest))
          import json
          man = json.load(open('/tmp/selection/SELECTION_MANIFEST.json'))
          assert man['selection_version'] == 2, man['selection_version']
          print('selection v2 pulled:', man['population_n'], 'instances')
          "

          ANNOT_TRAIN=$(python -c "
          from pathlib import Path
          from preprocessing.annotate import default_annotation_output_dir
          print(default_annotation_output_dir(Path('/mnt/data/raw/en/train_90M'), 'en_core_web_trf'))
          ")
          ANNOT_POOL=$(python -c "
          from pathlib import Path
          from preprocessing.annotate import default_annotation_output_dir
          print(default_annotation_output_dir(Path('/mnt/data/raw/en/pull_10M'), 'en_core_web_trf'))
          ")
          [ -d "$ANNOT_TRAIN" ] && [ -d "$ANNOT_POOL" ] || { echo "annotation caches missing"; exit 1; }

          TRAIN_OUT=/mnt/data/manipulations/en/${SLUG}/_train
          POOL_OUT=/mnt/data/manipulations/en/${SLUG}/_pool
          FINAL_OUT=/mnt/data/manipulations/en/${SLUG}
          mkdir -p "$TRAIN_OUT" "$POOL_OUT" "$FINAL_OUT"

          run_ablate () {
            local INPUT=$1 OUT=$2 ANNOT=$3 SELSUB=$4
            python -c "
          from pathlib import Path
          import preprocessing.ablations
          from preprocessing.base import AblationPipeline
          from preprocessing.config import AblationConfig
          cfg = AblationConfig(
              type='remove_subject_pronouns_graded',
              input_path=Path('$INPUT'),
              output_path=Path('$OUT'),
              annotated_input_path=Path('$ANNOT'),
              skip_backfill=True,
              spacy_model='en_core_web_trf',
              skip_validation=True,
              chunk_size=500,
              verbose=False,
              parameters={'selection_dir': '/tmp/selection/$SELSUB',
                          'arm': '$ARM', 'k': $K},
          )
          AblationPipeline(cfg).process_corpus()
          "
          }

          echo "--- ablate train ---"
          run_ablate /mnt/data/raw/en/train_90M/ "$TRAIN_OUT" "$ANNOT_TRAIN" train_90M
          echo "--- ablate pool ---"
          run_ablate /mnt/data/raw/en/pull_10M/ "$POOL_OUT" "$ANNOT_POOL" pull_10M

          echo "--- compose (strict word-matching) ---"
          python scripts/compose_corpus.py \
            --ablated-train "$TRAIN_OUT" \
            --ablated-pool  "$POOL_OUT" \
            --target-corpus /mnt/data/raw/en/train_90M/ \
            --output        "$FINAL_OUT" \
            --seed 42

          python scripts/ablation_report.py \
            --manifest "$TRAIN_OUT/ABLATION_MANIFEST.json" \
            --output "$FINAL_OUT/ablation_report.md" || true
          echo "CONDITION $SLUG OK"
        env:
        - {name: PYTHONPATH, value: "/opt/repo"}
        - name: AWS_ACCESS_KEY_ID
          valueFrom: {secretKeyRef: {name: s3-secret-thomas, key: AWS_ACCESS_KEY_ID}}
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom: {secretKeyRef: {name: s3-secret-thomas, key: AWS_SECRET_ACCESS_KEY}}
        - {name: AWS_ENDPOINT_URL,   value: "http://rook-ceph-rgw-nautiluss3.rook"}
        - {name: AWS_DEFAULT_REGION, value: "us-west-1"}
        resources:
          # DocBin streaming + selection dicts; childes dominates.
          requests: {memory: 20Gi, cpu: "4"}
          limits:   {memory: 20Gi, cpu: "4"}
        volumeMounts:
        - {name: repo, mountPath: /opt/repo}
        - {name: data, mountPath: /mnt/data}
      volumes:
      - {name: repo, emptyDir: {}}
      - name: data
        persistentVolumeClaim:
          claimName: subject-drop-archive
