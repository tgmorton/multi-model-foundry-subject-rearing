apiVersion: batch/v1
kind: Job
metadata:
  name: pronoun-sweep-weight-alpha
  namespace: lemn-lab
spec:
  completions: 15
  parallelism: 15
  completionMode: Indexed
  backoffLimit: 1
  template:
    spec:
      initContainers:
      - name: clone-repo
        image: alpine/git
        args:
        - clone
        - --single-branch
        - --depth=1
        - https://github.com/tgmorton/multi-model-foundry-subject-rearing.git
        - /opt/repo
        resources:
          requests:
            memory: 1Gi
            cpu: "200m"
          limits:
            memory: 1Gi
            cpu: "200m"
        volumeMounts:
        - name: repo
          mountPath: /opt/repo
      containers:
      - name: sweep
        image: python:3.10-slim
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -e

          # 5 alphas x 3 LRs = 15 indexed pods
          ALPHAS=(0.0 0.0 0.0 0.25 0.25 0.25 0.5 0.5 0.5 0.75 0.75 0.75 1.0 1.0 1.0)
          LRS=(5e-6 1e-5 2e-5 5e-6 1e-5 2e-5 5e-6 1e-5 2e-5 5e-6 1e-5 2e-5 5e-6 1e-5 2e-5)

          ALPHA=${ALPHAS[$JOB_COMPLETION_INDEX]}
          LR=${LRS[$JOB_COMPLETION_INDEX]}
          echo "Pod index=$JOB_COMPLETION_INDEX -> alpha=$ALPHA lr=$LR"

          # Install PyTorch with CUDA 12.1 (3090-compatible)
          pip install --no-cache-dir \
            torch --index-url https://download.pytorch.org/whl/cu121

          # Install project deps
          cd /opt/repo
          pip install --no-cache-dir \
            -r requirements.txt \
            accelerate>=0.26.0 \
            python-dotenv \
            scikit-learn>=1.3.0 \
            seqeval>=1.2.2 \
            sentencepiece

          # Run single (alpha, lr) combination
          python scripts/sweep_weight_alpha.py \
            --config configs/pronoun_recovery_it_train.yaml \
            --data-path /mnt/data/pronoun_recovery/annotations/it/checkpoint.jsonl \
            --output-dir /mnt/data/pronoun_recovery/models/it_sweep \
            --alphas $ALPHA \
            --learning-rate $LR \
            --thresholds 0.0 0.5 0.7 0.8 0.85 0.9 0.95 \
            --wandb-project pronoun-recovery \
            --wandb-entity thmorton-uc-san-diego

          echo "Alpha=$ALPHA LR=$LR complete."
        env:
        - name: WANDB_API_KEY
          valueFrom:
            secretKeyRef:
              name: wandb-secret-thomas
              key: WANDB_API_KEY
        - name: WANDB_ENTITY
          value: "thmorton-uc-san-diego"
        - name: PYTORCH_CUDA_ALLOC_CONF
          value: "expandable_segments:True"
        resources:
          requests:
            memory: 16Gi
            cpu: "4"
            nvidia.com/gpu: 1
          limits:
            memory: 16Gi
            cpu: "4"
            nvidia.com/gpu: 1
        volumeMounts:
        - name: repo
          mountPath: /opt/repo
        - name: data
          mountPath: /mnt/data
      volumes:
      - name: repo
        emptyDir: {}
      - name: data
        persistentVolumeClaim:
          claimName: pronoun-sweep-data
      restartPolicy: Never
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
