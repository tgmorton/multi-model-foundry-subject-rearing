---
# ============================================================================
# Ablate + compose Spanish corpora (three-step workflow, steps 2 + 3)
# ============================================================================
#
# For each of the 3 Spanish ablations that operate on text corpora:
#   remove_expletive_sentences_es, impoverish_case_es, lemmatize_verbs
# (insert_pronouns_es is emitted by the pronoun-recovery pipeline, not here)
#
# One indexed pod per ablation. Each pod:
#   1. Finds the DocBin caches for train_90M + pull_10M under
#      /mnt/data/annotated/<hash>/ (hash deterministic from input_dir +
#      spacy_model, so no need to pass it explicitly).
#   2. Runs AblationPipeline twice with skip_backfill=True:
#         - train → /mnt/data/manipulations/es/<slug>/_train/
#         - pool  → /mnt/data/manipulations/es/<slug>/_pool/
#   3. Runs scripts/compose_corpus.py to merge → /mnt/data/manipulations/es/<slug>/
#
# CPU-only — ablations are rule-based Python on cached docs; no spaCy parsing
# in the hot path. Compose is pure file I/O.
#
# Prereq: annotate-es-v1 must have completed successfully.
# Expected wall-clock: 5-15 min per ablation on CPU.
# ============================================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: ablate-compose-es-v1
  labels:
    study: subject-drop
    lang: es
    stage: ablate-compose
spec:
  completionMode: Indexed
  completions: 3
  parallelism: 3
  backoffLimit: 2
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        study: subject-drop
        lang: es
        stage: ablate-compose
    spec:
      imagePullSecrets:
      - name: gitlab-registry-cred-thomas
      restartPolicy: Never
      initContainers:
      - name: clone-repo
        image: alpine/git
        args:
        - clone
        - --single-branch
        - --depth=1
        - --branch=main
        - https://github.com/tgmorton/multi-model-foundry-subject-rearing.git
        - /opt/repo
        resources:
          requests: {memory: 1Gi, cpu: "200m"}
          limits:   {memory: 1Gi, cpu: "200m"}
        volumeMounts:
        - {name: repo, mountPath: /opt/repo}
      containers:
      - name: ablator
        image: gitlab-registry.nrp-nautilus.io/thmorton/multi-model-foundry-subject-rearing:latest
        imagePullPolicy: Always
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -euo pipefail

          ABLATIONS=(remove_expletive_sentences_es impoverish_case_es lemmatize_verbs)
          SLUGS=(remove_expletive_sentences       impoverish_case        lemmatize_verbs)
          IDX=${JOB_COMPLETION_INDEX}
          ABLATION=${ABLATIONS[$IDX]}
          SLUG=${SLUGS[$IDX]}

          echo "============================================================"
          echo "  Pod $IDX: ablation=$ABLATION slug=$SLUG"
          echo "============================================================"

          # Same Spanish model we annotated with, loaded from the PVC cache
          # (precache-spacy-es job). Spanish has no _trf variant.
          # Include cloned repo (preprocessing.*, scripts.*) and PVC spaCy cache.
          export PYTHONPATH="/opt/repo:/mnt/data/_spacy-site:${PYTHONPATH:-}"
          python -c "import es_core_news_lg; print('es_core_news_lg ready')"

          cd /opt/repo

          # Derive the DocBin cache paths. compute_annotation_cache_key
          # lives in preprocessing.annotate; same computation as the annotate
          # job so the hashes match up.
          ANNOT_TRAIN=$(python -c "
          from pathlib import Path
          from preprocessing.annotate import default_annotation_output_dir
          print(default_annotation_output_dir(Path('/mnt/data/raw/es/train_90M'), 'es_core_news_lg'))
          ")
          ANNOT_POOL=$(python -c "
          from pathlib import Path
          from preprocessing.annotate import default_annotation_output_dir
          print(default_annotation_output_dir(Path('/mnt/data/raw/es/pull_10M'), 'es_core_news_lg'))
          ")
          echo "train cache: $ANNOT_TRAIN"
          echo "pool cache:  $ANNOT_POOL"

          if [ ! -d "$ANNOT_TRAIN" ] || [ ! -d "$ANNOT_POOL" ]; then
            echo "ERROR: annotation caches missing. Run annotate-es-v1 first."
            exit 1
          fi

          TRAIN_OUT=/mnt/data/manipulations/es/${SLUG}/_train
          POOL_OUT=/mnt/data/manipulations/es/${SLUG}/_pool
          FINAL_OUT=/mnt/data/manipulations/es/${SLUG}

          mkdir -p "$TRAIN_OUT" "$POOL_OUT" "$FINAL_OUT"

          # --- Step 2a: ablate train (skip_backfill=True) -------------------
          python -c "
          from pathlib import Path
          import preprocessing.ablations  # register
          from preprocessing.base import AblationPipeline
          from preprocessing.config import AblationConfig

          cfg = AblationConfig(
              type='$ABLATION',
              input_path=Path('/mnt/data/raw/es/train_90M/'),
              output_path=Path('$TRAIN_OUT'),
              annotated_input_path=Path('$ANNOT_TRAIN'),
              skip_backfill=True,
              spacy_model='es_core_news_lg',
              skip_validation=True,
              chunk_size=500,
              verbose=False,
          )
          AblationPipeline(cfg).process_corpus()
          "

          # --- Step 2b: ablate pool (skip_backfill=True) --------------------
          python -c "
          from pathlib import Path
          import preprocessing.ablations
          from preprocessing.base import AblationPipeline
          from preprocessing.config import AblationConfig

          cfg = AblationConfig(
              type='$ABLATION',
              input_path=Path('/mnt/data/raw/es/pull_10M/'),
              output_path=Path('$POOL_OUT'),
              annotated_input_path=Path('$ANNOT_POOL'),
              skip_backfill=True,
              spacy_model='es_core_news_lg',
              skip_validation=True,
              chunk_size=500,
              verbose=False,
          )
          AblationPipeline(cfg).process_corpus()
          "

          # --- Step 3: compose → final corpus ------------------------------
          # --allow-short: line-removal ablations (remove_expletive_sentences_es)
          # can empty small-genre pools (CORLEC spoken ≈ 1.1M words — after
          # removing ~35% of it, the pool can't backfill train size). The
          # resulting deficit is recorded in COMPOSE_MANIFEST.json
          # (pool_exhausted + shortfall_after_pool) for audit.
          python scripts/compose_corpus.py \
            --ablated-train "$TRAIN_OUT" \
            --ablated-pool  "$POOL_OUT" \
            --target-corpus /mnt/data/raw/es/train_90M/ \
            --output        "$FINAL_OUT" \
            --seed 42 \
            --allow-short

          # Markdown summary of the run (for quick eyeball of tier counts)
          python scripts/ablation_report.py \
            --manifest "$TRAIN_OUT/ABLATION_MANIFEST.json" \
            --output   "$FINAL_OUT/REPORT.md" || true

          echo "Pod $IDX done — final corpus at $FINAL_OUT"
        env:
        - {name: PYTHONUNBUFFERED, value: "1"}
        - {name: TOKENIZERS_PARALLELISM, value: "false"}
        - name: AWS_ACCESS_KEY_ID
          valueFrom: {secretKeyRef: {name: s3-secret-thomas, key: AWS_ACCESS_KEY_ID}}
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom: {secretKeyRef: {name: s3-secret-thomas, key: AWS_SECRET_ACCESS_KEY}}
        - {name: AWS_ENDPOINT_URL,   value: "http://rook-ceph-rgw-nautiluss3.rook"}
        - {name: AWS_DEFAULT_REGION, value: "us-west-1"}
        resources:
          # requests == limits to satisfy NRP admission webhook.
          # Sizing note (2026-04-24): first pass at 24Gi/6CPU ran at ~10-20%
          # utilization across all pods and tripped NRP's "utilization too
          # low" admission block. Streaming DocBin reader (iter_annotated_file)
          # holds memory at ~4-5 GiB even for ES europarl (1.24M docs); CPU
          # usage peaks around 2 active cores. 10Gi / 4 CPU gives ~40-50%
          # utilization (cluster-friendly) plus 2x memory headroom for OOM
          # safety (user preference: over-request > under-request).
          requests: {memory: 10Gi, cpu: "4"}
          limits:   {memory: 10Gi, cpu: "4"}
        volumeMounts:
        - {name: repo, mountPath: /opt/repo}
        - {name: data, mountPath: /mnt/data}
      volumes:
      - name: repo
        emptyDir: {}
      - name: data
        persistentVolumeClaim:
          claimName: subject-drop-archive
