apiVersion: batch/v1
kind: Job
metadata:
  name: tree-detect-it-train-90m
spec:
  completionMode: Indexed
  completions: 8
  parallelism: 8
  backoffLimit: 3
  template:
    spec:
      initContainers:
      - name: clone-repo
        image: alpine/git
        args:
        - clone
        - --single-branch
        - --depth=1
        - https://github.com/tgmorton/multi-model-foundry-subject-rearing.git
        - /opt/repo
        resources:
          requests:
            memory: 1Gi
            cpu: "200m"
          limits:
            memory: 1Gi
            cpu: "200m"
        volumeMounts:
        - name: repo
          mountPath: /opt/repo
      containers:
      - name: tree-detector
        image: python:3.10-slim
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -e
          FILES=(childes clta corpus_isacco europarl leipzig_web paccss qcri spgc)
          FILE_STEM="${FILES[$JOB_COMPLETION_INDEX]}"
          echo "Pod index=$JOB_COMPLETION_INDEX → file=$FILE_STEM"

          pip install --no-cache-dir spacy pydantic tqdm pyyaml pyarrow polars joblib scikit-learn pandas numpy &&
          python -m spacy download it_core_news_lg

          cd /opt/repo

          python -m analysis.scripts.reporting.apply_tree_detector_it \
            --annotated-dir /mnt/data/output/it_train_90M/annotated_corpus/ \
            --model-dir /mnt/data/pronoun_recovery/tree_detector/it/ \
            --classifier-type gradient_boosted \
            --batch-size 256 \
            --file "$FILE_STEM"
        resources:
          requests:
            memory: 16Gi
            cpu: "7"
          limits:
            memory: 16Gi
            cpu: "7"
        volumeMounts:
        - name: repo
          mountPath: /opt/repo
        - name: data
          mountPath: /mnt/data
      volumes:
      - name: repo
        emptyDir: {}
      - name: data
        persistentVolumeClaim:
          claimName: corpus-analysis-data
      restartPolicy: Never
