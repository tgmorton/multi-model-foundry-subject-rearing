apiVersion: batch/v1
kind: Job
metadata:
  name: thomas-preempt-smoke-v1
  labels:
    owner: thomas
    study: subject-drop
    stage: preempt-smoke
    lang: en
spec:
  backoffLimit: 10
  completionMode: Indexed
  completions: 1
  parallelism: 1
  ttlSecondsAfterFinished: 604800
  podFailurePolicy:
    rules:
    - action: Ignore
      onExitCodes:
        containerName: trainer
        operator: In
        values:
        - 2
        - 128
  template:
    metadata:
      labels:
        owner: thomas
        study: subject-drop
        stage: preempt-smoke
        lang: en
    spec:
      priorityClassName: armada-default
      imagePullSecrets:
      - name: gitlab-registry-cred-thomas
      initContainers:
      - name: clone-repo
        image: alpine/git
        args:
        - clone
        - --single-branch
        - --depth=1
        - --branch=main
        - https://github.com/tgmorton/multi-model-foundry-subject-rearing.git
        - /opt/repo
        resources:
          requests:
            memory: 1Gi
            cpu: 200m
          limits:
            memory: 1Gi
            cpu: 200m
        volumeMounts:
        - name: repo
          mountPath: /opt/repo
      containers:
      - name: trainer
        image: gitlab-registry.nrp-nautilus.io/thmorton/multi-model-foundry-subject-rearing:latest
        imagePullPolicy: Always
        command:
        - /bin/bash
        - -c
        args:
        - "set -euo pipefail\necho '=== PREEMPTION SMOKE ==='\npython3 -c \"\nimport\
          \ sys, torch\ntry:\n    if not torch.cuda.is_available():\n        print('FATAL:\
          \ no CUDA', file=sys.stderr); sys.exit(2)\n    torch.cuda.synchronize()\n\
          \    x = torch.zeros(1024, device='cuda'); x.sum().item()\n    print(f'\
          \  GPU healthy: {torch.cuda.get_device_name(0)}')\nexcept Exception as e:\n\
          \    print(f'FATAL: GPU unhealthy: {e}', file=sys.stderr); sys.exit(2)\n\
          \"\ncd /opt/repo\nrm -rf /opt/repo/data/raw /opt/repo/data/tokenized /opt/repo/data/chunked\
          \ /opt/repo/tokenizers /opt/repo/models\nmkdir -p /mnt/data/models/detsmoke\n\
          ln -sfn /mnt/data/raw       /opt/repo/data/raw\nln -sfn /mnt/data/tokenized\
          \ /opt/repo/data/tokenized\nln -sfn /mnt/data/chunked   /opt/repo/data/chunked\n\
          ln -sfn /mnt/data/tokenizers /opt/repo/tokenizers\nln -sfn /mnt/data/models\
          \    /opt/repo/models\npython3 scripts/preemption_smoke_agent.py\n"
        env:
        - name: PYTHONPATH
          value: /opt/repo
        - name: PYTHONHASHSEED
          value: '0'
        - name: PYTORCH_CUDA_ALLOC_CONF
          value: expandable_segments:True
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: WANDB_API_KEY
          valueFrom:
            secretKeyRef:
              name: wandb-secret-thomas
              key: WANDB_API_KEY
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: s3-secret-thomas
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: s3-secret-thomas
              key: AWS_SECRET_ACCESS_KEY
        - name: AWS_ENDPOINT_URL
          value: http://rook-ceph-rgw-nautiluss3.rook
        - name: AWS_DEFAULT_REGION
          value: us-west-1
        - name: REGISTRY_BUCKET
          value: thomas-subject-drop-artifacts
        resources:
          requests:
            memory: 4Gi
            cpu: '2'
            nvidia.com/gpu: 1
          limits:
            memory: 4Gi
            cpu: '2'
            nvidia.com/gpu: 1
        volumeMounts:
        - name: repo
          mountPath: /opt/repo
        - name: data
          mountPath: /mnt/data
      volumes:
      - name: repo
        emptyDir: {}
      - name: data
        persistentVolumeClaim:
          claimName: subject-drop-archive
      restartPolicy: Never
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: PreferNoSchedule
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values:
                - NVIDIA-GeForce-RTX-3090
              - key: kubernetes.io/hostname
                operator: NotIn
                values:
                - uicnrp-fiona2.evl.uic.edu
