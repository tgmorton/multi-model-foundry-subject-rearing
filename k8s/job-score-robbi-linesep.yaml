# Robbi line-separator artifact test (2026-10-22). See docs/DECILE_CONTEXT_SURVEY.md.
apiVersion: batch/v1
kind: Job
metadata:
  name: thomas-score-robbi-linesep-v1
  labels: &id001
    owner: thomas
    study: subject-drop
    lang: en
    stage: score-linesep
spec:
  completionMode: Indexed
  completions: 12
  parallelism: 4
  backoffLimit: 60
  ttlSecondsAfterFinished: 604800
  podFailurePolicy:
    rules:
    - action: Ignore
      onExitCodes:
        containerName: scorer
        operator: In
        values:
        - 2
        - 128
  template:
    metadata:
      labels: *id001
    spec:
      priorityClassName: armada-default
      imagePullSecrets:
      - name: gitlab-registry-cred-thomas
      restartPolicy: Never
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: PreferNoSchedule
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values:
                - NVIDIA-GeForce-RTX-3090
                - NVIDIA-A10
                - NVIDIA-L4
                - NVIDIA-GeForce-RTX-4090
                - NVIDIA-L40
                - NVIDIA-L40S
                - Tesla-V100-SXM2-32GB
                - Tesla-V100-SXM2-16GB
                - Tesla-V100-PCIE-16GB
                - Tesla-T4
                - NVIDIA-TITAN-RTX
              - key: kubernetes.io/hostname
                operator: NotIn
                values:
                - uicnrp-fiona2.evl.uic.edu
                - gpu-14.nrp.mghpcc.org
                - gpu-17.nrp.mghpcc.org
                - gpu-18.nrp.mghpcc.org
                - hcc-chase-shor-c4715.unl.edu
                - hcc-nrp-shor-c6017.unl.edu
                - nautilus-ext-gpu01.fullerton.edu
                - nautilus-it-gpu01.fullerton.edu
                - nautilus-it-gpu03.fullerton.edu
                - rci-tide-gpu-03.sdsu.edu
                - ry-gpu-10.sdsc.optiputer.net
                - fiona-1.famu.edu
                - suncave-3
                - ry-gpu-04.sdsc.optiputer.net
                - ren-gp-argo-01.madren.org
                - hcc-chase-shor-c4705.unl.edu
      initContainers:
      - name: clone-repo
        image: alpine/git
        args:
        - clone
        - --single-branch
        - --depth=1
        - --branch=main
        - https://github.com/tgmorton/multi-model-foundry-subject-rearing.git
        - /opt/repo
        resources:
          requests:
            memory: 1Gi
            cpu: 200m
          limits:
            memory: 1Gi
            cpu: 200m
        volumeMounts:
        - name: repo
          mountPath: /opt/repo
      containers:
      - name: scorer
        image: gitlab-registry.nrp-nautilus.io/thmorton/multi-model-foundry-subject-rearing:latest
        imagePullPolicy: Always
        command:
        - /bin/bash
        - -c
        args:
        - "set -euo pipefail\n# Line-separator artifact test (2026-10-22 decile survey): the robbi scorer\n# glued separately-encoded lines with no separator, so roberta saw a\n# line-initial pronoun as\
          \ a no-space piece fused to the previous line\n# (\"...inI'm\"). Re-score the frozen 100K locality sample with and without a\n# newline piece between lines; same code, same instances.\nGENRES=(bnc_spoken\
          \ childes gutenberg open_subtitles simple_wiki switchboard)\nCFGS=(none newline)\nGENRE=${GENRES[$((JOB_COMPLETION_INDEX % 6))]}\nCFG=${CFGS[$((JOB_COMPLETION_INDEX / 6))]}\nNAME=roberta_bi_sep${CFG}\n\
          echo \"=== robbi line-sep test: $CFG / $GENRE on $NODE_NAME ===\"\nexport PYTHONPATH=\"/opt/repo:${PYTHONPATH:-}\"\ncd /opt/repo\npython scripts/score_pronoun_recoverability.py \\\n  --corpus\
          \ train_90M --file \"$GENRE\" \\\n  --hf-mlm $NAME=roberta-large \\\n  --mlm-ctx 250 --mlm-batch 24 \\\n  --line-sep $CFG \\\n  --sample-file /opt/repo/data/recoverability/locality_sample/${GENRE}.parquet\
          \ \\\n  --out-dir /mnt/data/recoverability_linesep \\\n  --amp\npython - <<PYUP\nimport boto3, pathlib, sys, pyarrow.parquet as pq\nd = pathlib.Path(\"/mnt/data/recoverability_linesep/train_90M/external_$NAME\"\
          )\nt = pq.read_table(d / \"instances\" / \"$GENRE.parquet\").to_pandas()\ncol = [c for c in t.columns if c.endswith(\"logprob_first\")][0]\nnan = t[col].isna().mean()\nprint(f\"NaN frac {nan:.4f}\
          \ over {len(t)} rows ({col}) on $NODE_NAME\")\nif nan > 0.001:\n    sys.exit(\"FAIL: NaN scores; not uploading, index will retry\")\ns3 = boto3.client(\"s3\")\nfor sub in (\"instances\", \"lines\"\
          , \"manifest\"):\n    for p in (d / sub).glob(\"$GENRE.*\"):\n        s3.upload_file(str(p), \"thomas-subject-drop-artifacts\",\n                       f\"recoverability/analysis/linesep_test/$CFG/{sub}/{p.name}\"\
          )\n        print(\"uploaded\", sub, p.name)\nPYUP\necho \"SHARD $CFG/$GENRE OK\"\n"
        env:
        - name: PYTHONPATH
          value: /opt/repo
        - name: PYTORCH_CUDA_ALLOC_CONF
          value: expandable_segments:True
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: s3-secret-thomas
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: s3-secret-thomas
              key: AWS_SECRET_ACCESS_KEY
        - name: AWS_ENDPOINT_URL
          value: http://rook-ceph-rgw-nautiluss3.rook
        - name: AWS_DEFAULT_REGION
          value: us-west-1
        resources:
          requests:
            memory: 24Gi
            cpu: '4'
            nvidia.com/gpu: 1
          limits:
            memory: 24Gi
            cpu: '4'
            nvidia.com/gpu: 1
        volumeMounts:
        - name: repo
          mountPath: /opt/repo
        - name: data
          mountPath: /mnt/data
        - name: shm
          mountPath: /dev/shm
      volumes:
      - name: repo
        emptyDir: {}
      - name: data
        persistentVolumeClaim:
          claimName: subject-drop-archive
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 2Gi
