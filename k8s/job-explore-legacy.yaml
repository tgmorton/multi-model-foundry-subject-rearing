---
apiVersion: batch/v1
kind: Job
metadata:
  name: explore-legacy
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 600
  template:
    spec:
      containers:
      - name: explore
        image: alpine:3.19
        command: ["/bin/sh", "-c"]
        args:
        - |
          set -eu
          echo "=== /legacy top ==="
          ls -la /legacy | head -30
          echo ""
          echo "=== find raw/ tokenizers/ (depth 3) ==="
          find /legacy -maxdepth 3 -type d -name 'raw' -o -name 'tokenizers' -o -name 'train_90M' -o -name 'test_10M' 2>&1 | head -30
          echo ""
          echo "=== du -sh top-level (1-level) ==="
          du -sh /legacy/* 2>/dev/null | head -30
        resources:
          requests: {memory: 256Mi, cpu: "100m"}
          limits:   {memory: 256Mi, cpu: "100m"}
        volumeMounts:
        - {name: legacy, mountPath: /legacy, readOnly: true}
      volumes:
      - name: legacy
        persistentVolumeClaim:
          claimName: corpus-analysis-data
      restartPolicy: Never
