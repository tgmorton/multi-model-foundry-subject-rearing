---
# One-shot: migrate the English training/test corpora + the baseline
# tokenizer from the legacy `corpus-analysis-data` PVC to the new
# primary `subject-drop-archive` PVC at the new canonical layout.
#
# The other agent is populating Spanish on subject-drop-archive
# (raw/es/{train_90M,pull_10M}/) — this job only touches raw/en/** and
# tokenizers/en_gpt2_medium/ to avoid stepping on their work.
#
# Source paths on legacy PVC:
#   corpus-analysis-data:/legacy/data/raw/train_90M/
#   corpus-analysis-data:/legacy/data/raw/test_10M/
#   corpus-analysis-data:/legacy/tokenizers/exp0_baseline_90M_smoke/
#
# Destination paths on archive PVC (new canonical layout):
#   subject-drop-archive:/data/raw/en/train_90M/
#   subject-drop-archive:/data/raw/en/test_10M/
#   subject-drop-archive:/data/tokenizers/en_gpt2_medium/
#
# Idempotent — if a destination already has its sentinel file, the
# block is skipped. Safe to re-apply.
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate-en-to-archive
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      containers:
      - name: copy
        image: alpine:3.19
        command: ["/bin/sh", "-c"]
        args:
        - |
          set -euo pipefail
          LSRC=/legacy
          DST=/data

          # Tar-stream transfer: streams the source tree through
          # stdout → tar-extract on the destination. One atomic pass
          # per dir, preserves perms/times/symlinks, avoids the
          # cp -a per-file overhead on CephFS, and fails loud if
          # either side breaks.
          stream_dir_if_missing() {
            local src_parent="$1"  # e.g. /legacy/raw
            local src_name="$2"    # e.g. train_90M
            local dst_dir="$3"     # e.g. /data/raw/en/train_90M
            local sentinel="$4"    # a file inside dst_dir that proves it's done

            if [ -f "$dst_dir/$sentinel" ]; then
              echo "SKIP: $dst_dir/$sentinel already exists"
              return 0
            fi
            if [ ! -d "$src_parent/$src_name" ]; then
              echo "FAIL: source $src_parent/$src_name missing"
              return 1
            fi

            local dst_parent
            dst_parent="$(dirname "$dst_dir")"
            local dst_tail
            dst_tail="$(basename "$dst_dir")"
            mkdir -p "$dst_parent"
            # Extract into a temp name first, then rename — so the
            # sentinel only appears at its final path once the whole
            # dir landed (makes the idempotency check race-safe on
            # retries).
            local staging="$dst_parent/.$dst_tail.staging.$$"
            mkdir -p "$staging"
            echo "STREAM: $src_parent/$src_name -> $dst_dir"
            tar -C "$src_parent" -cf - "$src_name" \
              | tar -C "$staging" -xf -
            # staging/<src_name>/ now holds the files; move to final name
            rm -rf "$dst_dir"
            mv "$staging/$src_name" "$dst_dir"
            rmdir "$staging" || true
            echo "    done: $(ls "$dst_dir" | wc -l) entries"
          }

          # Legacy PVC layout: raw at /legacy/raw/, NOT /legacy/data/raw/.
          # 1. English training corpus
          stream_dir_if_missing "$LSRC/raw" "train_90M" \
                                "$DST/raw/en/train_90M" \
                                "childes.train"

          # 2. English held-out (test) corpus
          stream_dir_if_missing "$LSRC/raw" "test_10M" \
                                "$DST/raw/en/test_10M" \
                                "childes.test"

          # 3. Baseline tokenizer → new canonical (lang, arch) path.
          # Streamed then renamed to the canonical (lang, arch) name.
          stream_dir_if_missing "$LSRC/tokenizers" "exp0_baseline_90M_smoke" \
                                "$DST/tokenizers/en_gpt2_medium" \
                                "tokenizer.model"

          echo ""
          echo "=========================================="
          echo "  FINAL STATE"
          echo "=========================================="
          du -sh "$DST/raw/en"/* 2>&1 | head
          du -sh "$DST/tokenizers"/* 2>&1 | head
        resources:
          requests: {memory: 512Mi, cpu: "500m"}
          limits:   {memory: 512Mi, cpu: "500m"}
        volumeMounts:
        - {name: legacy, mountPath: /legacy, readOnly: true}
        - {name: data,   mountPath: /data}
      volumes:
      - name: legacy
        persistentVolumeClaim:
          claimName: corpus-analysis-data
      - name: data
        persistentVolumeClaim:
          claimName: subject-drop-archive
      restartPolicy: Never
