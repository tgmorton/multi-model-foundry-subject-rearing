# fp16 conversion science check (2026-09-28). Two CPU evals of the SAME 4
# checkpoints of June run gpt2_large-en-baseline-h0-s137:
#   idx 0 -> copy left fp32  (run_id ...-s9990001)
#   idx 1 -> copy converted  (run_id ...-s9990002)
# Comparing 0 vs 1 isolates the fp16-weight effect from CPU-vs-GPU numerics.
# Isolated: distinct benchmark prefix + --no-registry; originals only READ.
apiVersion: batch/v1
kind: Job
metadata:
  name: thomas-fp16-verify
  labels: {owner: thomas, study: subject-drop, stage: eval-cell}
spec:
  completionMode: Indexed
  completions: 2
  parallelism: 2
  backoffLimit: 8
  ttlSecondsAfterFinished: 172800
  template:
    metadata:
      labels: {owner: thomas, study: subject-drop, stage: eval-cell}
    spec:
      priorityClassName: armada-default
      imagePullSecrets: [{name: gitlab-registry-cred-thomas}]
      restartPolicy: Never
      initContainers:
      - name: clone-repo
        image: alpine/git
        args: [clone, --single-branch, --depth=1, --branch=main,
               "https://github.com/tgmorton/multi-model-foundry-subject-rearing.git", /opt/repo]
        resources:
          requests: {memory: 1Gi, cpu: 200m}
          limits: {memory: 1Gi, cpu: 200m}
        volumeMounts: [{name: repo, mountPath: /opt/repo}]
      containers:
      - name: evaluator
        image: gitlab-registry.nrp-nautilus.io/thmorton/multi-model-foundry-subject-rearing:latest
        imagePullPolicy: IfNotPresent
        command: ["bash","-lc"]
        args:
        - |
          set -euo pipefail
          cd /opt/repo
          SRC=/mnt/data/models/production/gpt2_large-en-baseline-h0-s137
          SEED=$([ "$JOB_COMPLETION_INDEX" = "0" ] && echo 9990001 || echo 9990002)
          RID=gpt2_large-en-baseline-h0-s${SEED}
          DST=/mnt/data/models/wave2/$RID
          rm -rf "$DST"; mkdir -p "$DST"
          # 4 non-anchor checkpoints spanning the trajectory
          PICK=$(for d in $(ls -d $SRC/checkpoint-* | sort -V); do [ -e "$d/training_state.pt" ] || echo "$d"; done | awk 'NR==10||NR==35||NR==60||NR==85')
          for d in $PICK; do cp -r "$d" "$DST/"; echo "copied $(basename $d)"; done
          if [ "$JOB_COMPLETION_INDEX" = "1" ]; then
            python scripts/fp16_convert.py --run-dir "$DST" --apply --verify
          fi
          export OMP_NUM_THREADS=12 MKL_NUM_THREADS=12
          python scripts/eval_v2_cell.py --run_id "$RID" --device cpu --no-registry \
            --matched_stimuli_root /opt/repo/evaluation/stimuli/null-subj-v2-matched-v1 \
            --benchmark fp16_verify_v1 --scoring_version null-subj-v2-condition-matched-v1 \
            --output_root /mnt/data/eval_v2/fp16_verify --scratch_dir /tmp/eval_scratch
          rm -rf "$DST"   # scratch copy; originals never written
          echo "VERIFY EVAL OK idx=$JOB_COMPLETION_INDEX"
        env:
        - {name: PYTHONPATH, value: /opt/repo}
        - name: AWS_ACCESS_KEY_ID
          valueFrom: {secretKeyRef: {name: s3-secret-thomas, key: AWS_ACCESS_KEY_ID}}
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom: {secretKeyRef: {name: s3-secret-thomas, key: AWS_SECRET_ACCESS_KEY}}
        - {name: AWS_ENDPOINT_URL, value: "http://rook-ceph-rgw-nautiluss3.rook"}
        - {name: AWS_DEFAULT_REGION, value: "us-west-1"}
        resources:
          requests: {memory: 24Gi, cpu: '12'}
          limits: {memory: 24Gi, cpu: '12'}
        volumeMounts:
        - {name: repo, mountPath: /opt/repo}
        - {name: data, mountPath: /mnt/data}
      volumes:
      - {name: repo, emptyDir: {}}
      - name: data
        persistentVolumeClaim: {claimName: subject-drop-archive}
