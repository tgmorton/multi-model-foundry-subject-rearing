apiVersion: batch/v1
kind: Job
metadata:
  name: corpus-analysis-pull-10m
spec:
  backoffLimit: 3
  template:
    spec:
      initContainers:
      - name: clone-repo
        image: alpine/git
        args:
        - clone
        - --single-branch
        - --depth=1
        - https://github.com/tgmorton/multi-model-foundry-subject-rearing.git
        - /opt/repo
        resources:
          requests:
            memory: 1Gi
            cpu: "200m"
          limits:
            memory: 1Gi
            cpu: "200m"
        volumeMounts:
        - name: repo
          mountPath: /opt/repo
      containers:
      - name: analyzer
        image: python:3.10-slim
        command: ["/bin/bash", "-c"]
        args:
        - |
          pip install --no-cache-dir spacy pydantic tqdm pyyaml &&
          python -m spacy download en_core_web_lg &&
          cd /opt/repo &&
          python -m analysis.corpus_descriptives.run \
            --config configs/corpus_analysis_pull10m.yaml
        resources:
          requests:
            memory: 4Gi
            cpu: "4"
          limits:
            memory: 4Gi
            cpu: "4"
        volumeMounts:
        - name: repo
          mountPath: /opt/repo
        - name: data
          mountPath: /mnt/data
      volumes:
      - name: repo
        emptyDir: {}
      - name: data
        persistentVolumeClaim:
          claimName: corpus-analysis-data
      restartPolicy: Never
