apiVersion: batch/v1
kind: Job
metadata:
  name: thomas-precache-wave-lstm-robbi
  namespace: null-subjects
  labels: {owner: thomas, study: subject-drop, stage: precache, arch: lstm, lang: en}
spec:
  completionMode: Indexed
  completions: 90
  parallelism: 20
  backoffLimit: 30
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels: {owner: thomas, study: subject-drop, stage: precache, arch: lstm, lang: en}
    spec:
      priorityClassName: armada-default
      restartPolicy: Never
      imagePullSecrets:
      - name: gitlab-registry-cred-thomas
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - {key: feature.node.kubernetes.io/pci-10de.present, operator: NotIn, values: ["true"]}
      initContainers:
      - name: clone-repo
        image: alpine/git
        args: [clone, --single-branch, --depth=1, --branch=eval/bert-v2,
               "https://github.com/tgmorton/multi-model-foundry-subject-rearing.git", /opt/repo]
        resources:
          requests: {memory: 1Gi, cpu: 200m}
          limits: {memory: 1Gi, cpu: 200m}
        volumeMounts: [{name: repo, mountPath: /opt/repo}]
      containers:
      - name: prepare
        image: gitlab-registry.nrp-nautilus.io/thmorton/multi-model-foundry-subject-rearing:latest
        imagePullPolicy: Always
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -euo pipefail
          echo "=== LSTM WAVE PRECACHE idx=$JOB_COMPLETION_INDEX ==="
          cd /opt/repo
          rm -rf data/raw data/manipulations data/tokenized data/chunked tokenizers
          mkdir -p /mnt/data/tokenized /mnt/data/chunked
          ln -sfn /mnt/data/raw           data/raw
          ln -sfn /mnt/data/manipulations data/manipulations
          ln -sfn /mnt/data/tokenized     data/tokenized
          ln -sfn /mnt/data/chunked       data/chunked
          ln -sfn /mnt/data/tokenizers    tokenizers
          export BASE_CONFIG=lstm_en.yaml TOKENIZER_DIR=tokenizers/en_shared_unigram/
          export CELLS_FILE=/opt/repo/k8s/wave2/cells_w3_lstm_robbi.txt
          python3 scripts/prepare_cache_v5.py
        env:
        - {name: PYTHONPATH, value: /opt/repo}
        resources:
          requests: {cpu: "1", memory: 1900Mi}
          limits: {cpu: "1", memory: 1900Mi}
        volumeMounts:
        - {name: repo, mountPath: /opt/repo}
        - {name: data, mountPath: /mnt/data}
      volumes:
      - {name: repo, emptyDir: {}}
      - name: data
        persistentVolumeClaim: {claimName: thomas-rater-corpus}
