apiVersion: batch/v1
kind: Job
metadata:
  name: europarl-sweep
  namespace: lemn-lab
spec:
  completionMode: Indexed
  completions: 27
  parallelism: 27
  backoffLimit: 2
  template:
    spec:
      initContainers:
      - name: copy-repo
        image: alpine
        command: ["sh", "-c", "cp -a /mnt/data/repo/. /opt/repo/"]
        resources:
          requests:
            memory: 512Mi
            cpu: "200m"
          limits:
            memory: 512Mi
            cpu: "200m"
        volumeMounts:
        - name: repo
          mountPath: /opt/repo
        - name: data
          mountPath: /mnt/data
          readOnly: true
      containers:
      - name: sweep-runner
        image: python:3.10-slim
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -e

          # Install PyTorch with CUDA 12.1 (3090-compatible)
          pip install --no-cache-dir \
            torch --index-url https://download.pytorch.org/whl/cu121

          # Install project deps
          cd /opt/repo
          pip install --no-cache-dir \
            -r requirements.txt \
            accelerate>=0.26.0 \
            python-dotenv \
            scikit-learn>=1.3.0 \
            seqeval>=1.2.2 \
            sentencepiece

          # Run the sweep for this index
          python scripts/run_europarl_sweep.py
        env:
        - name: WANDB_API_KEY
          valueFrom:
            secretKeyRef:
              name: wandb-secret-thomas
              key: WANDB_API_KEY
        - name: WANDB_ENTITY
          value: "thmorton-uc-san-diego"
        - name: WANDB_PROJECT
          value: "pronoun-recovery"
        - name: PYTHONPATH
          value: "/opt/repo"
        - name: SWEEP_DATA_DIR
          value: "/mnt/data/pronoun_recovery/europarl_aligned"
        - name: SWEEP_OUTPUT_DIR
          value: "/mnt/data/pronoun_recovery/models/europarl_sweep"
        - name: PYTORCH_CUDA_ALLOC_CONF
          value: "expandable_segments:True"
        resources:
          requests:
            memory: 16Gi
            cpu: "4"
            nvidia.com/gpu: 1
          limits:
            memory: 16Gi
            cpu: "4"
            nvidia.com/gpu: 1
        volumeMounts:
        - name: repo
          mountPath: /opt/repo
        - name: data
          mountPath: /mnt/data
      volumes:
      - name: repo
        emptyDir: {}
      - name: data
        persistentVolumeClaim:
          claimName: europarl-sweep-data
      restartPolicy: Never
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
