apiVersion: batch/v1
kind: Job
metadata:
  name: europarl-sweep
  namespace: lemn-lab
spec:
  completionMode: Indexed
  completions: 27
  parallelism: 27
  backoffLimit: 54
  backoffLimitPerIndex: 3
  template:
    spec:
      containers:
      - name: sweep-runner
        image: pytorch/pytorch:2.5.1-cuda12.1-cudnn9-runtime
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -e
          echo "=== Pod index $JOB_COMPLETION_INDEX started at $(date) on $(hostname) ==="

          # PyTorch already in image; install lightweight project deps only
          pip install --no-cache-dir \
            -r /mnt/data/repo/requirements.txt \
            accelerate>=0.26.0 \
            python-dotenv \
            scikit-learn>=1.3.0 \
            seqeval>=1.2.2 \
            sentencepiece

          echo "=== pip install done at $(date) ==="

          # Run the sweep for this index
          cd /mnt/data/repo
          python -u scripts/run_europarl_sweep.py
        env:
        - name: WANDB_MODE
          value: "disabled"
        - name: PYTHONPATH
          value: "/mnt/data/repo"
        - name: SWEEP_DATA_DIR
          value: "/mnt/data/pronoun_recovery/europarl_aligned"
        - name: SWEEP_OUTPUT_DIR
          value: "/mnt/data/pronoun_recovery/models/europarl_sweep"
        - name: PYTORCH_CUDA_ALLOC_CONF
          value: "expandable_segments:True"
        resources:
          requests:
            memory: 4Gi
            cpu: "2"
            nvidia.com/gpu: 1
          limits:
            memory: 4Gi
            cpu: "2"
            nvidia.com/gpu: 1
        volumeMounts:
        - name: data
          mountPath: /mnt/data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: europarl-sweep-data
      restartPolicy: Never
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
