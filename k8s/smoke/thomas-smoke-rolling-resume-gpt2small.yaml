# Rolling-resume smoke (2026-10-06). gpt2_small, 1 epoch, branch rolling-resume,
# rolling state every 20 steps. Wave w3smoke-roll => own seed/run_id/output dir;
# registry writes go to a nonexistent bucket, WandB disabled. Mid-run the pod is
# deleted by hand to check the replacement resumes from the latest rolling state.
apiVersion: batch/v1
kind: Job
metadata:
  name: thomas-smoke-rolling-resume-gpt2small
  labels: &id001
    owner: thomas
    study: subject-drop
    lang: en
    stage: smoke
    arch: gpt2-small
spec:
  backoffLimit: 3
  completionMode: Indexed
  completions: 1
  parallelism: 1
  ttlSecondsAfterFinished: 86400
  podFailurePolicy:
    rules:
    - action: Ignore
      onExitCodes:
        containerName: trainer
        operator: In
        values:
        - 2
        - 128
  template:
    metadata:
      labels: *id001
    spec:
      priorityClassName: armada-default
      restartPolicy: Never
      imagePullSecrets:
      - name: gitlab-registry-cred-thomas
      initContainers:
      - name: clone-repo
        image: alpine/git
        args:
        - clone
        - --single-branch
        - --depth=1
        - --branch=rolling-resume
        - https://github.com/tgmorton/multi-model-foundry-subject-rearing.git
        - /opt/repo
        resources:
          requests:
            memory: 1Gi
            cpu: 200m
          limits:
            memory: 1Gi
            cpu: 200m
        volumeMounts:
        - name: repo
          mountPath: /opt/repo
      containers:
      - name: trainer
        image: gitlab-registry.nrp-nautilus.io/thmorton/multi-model-foundry-subject-rearing:latest
        imagePullPolicy: Always
        command:
        - /bin/bash
        - -c
        args:
        - "set -euo pipefail\necho \"=== WAVE2 TRAIN \u2014 cell=$CELL arch=$ARCH idx=$JOB_COMPLETION_INDEX ===\"\npython3 -c \"\nimport sys, torch\ntry:\n    if not torch.cuda.is_available():\n       \
          \ print('FATAL: no CUDA', file=sys.stderr); sys.exit(2)\n    torch.cuda.synchronize()\n    x = torch.zeros(1024, device='cuda'); x.sum().item()\n    print(f'  GPU healthy: {torch.cuda.get_device_name(0)}')\n\
          except Exception as e:\n    print(f'FATAL: GPU unhealthy: {e}', file=sys.stderr); sys.exit(2)\n\"\ncd /opt/repo\nrm -rf /opt/repo/data/raw /opt/repo/data/manipulations /opt/repo/data/tokenized\
          \ /opt/repo/data/chunked /opt/repo/tokenizers /opt/repo/models\nmkdir -p /mnt/data/models/wave2\nln -sfn /mnt/data/raw           /opt/repo/data/raw\nln -sfn /mnt/data/manipulations /opt/repo/data/manipulations\n\
          ln -sfn /mnt/data/tokenized     /opt/repo/data/tokenized\nln -sfn /mnt/data/chunked       /opt/repo/data/chunked\nln -sfn /mnt/data/tokenizers    /opt/repo/tokenizers\nln -sfn /mnt/data/models\
          \        /opt/repo/models\nrm -f /tmp/run_succeeded\npython3 scripts/wave2_agent.py || true\nif [ ! -f /tmp/run_succeeded ]; then\n  echo \"FAIL run sentinel absent\"\n  exit 1\nfi\necho \"RUN\
          \ OK: $(cat /tmp/run_succeeded)\"\n"
        env:
        - name: PYTHONPATH
          value: /opt/repo
        - name: PYTHONHASHSEED
          value: '0'
        - name: PYTORCH_CUDA_ALLOC_CONF
          value: expandable_segments:True
        - name: WAVE_ID
          value: w3smoke-roll
        - name: CELL
          value: pdrop2_robbi10_base
        - name: CORPUS_CELL
          value: pdrop2_robbi10_base
        - name: ARCH
          value: gpt2_small
        - name: PHYS_BATCH
          value: '16'
        - name: WAVE_EPOCHS
          value: '1'
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: WANDB_API_KEY
          valueFrom:
            secretKeyRef:
              name: wandb-secret-thomas
              key: WANDB_API_KEY
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: s3-secret-thomas
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: s3-secret-thomas
              key: AWS_SECRET_ACCESS_KEY
        - name: AWS_ENDPOINT_URL
          value: http://rook-ceph-rgw-nautiluss3.rook
        - name: AWS_DEFAULT_REGION
          value: us-west-1
        - name: REGISTRY_BUCKET
          value: thomas-smoke-null-no-such-bucket
        - name: WANDB_MODE
          value: disabled
        - name: ROLLING_RESUME_STEPS
          value: '20'
        resources:
          requests:
            memory: 4Gi
            cpu: '2'
            nvidia.com/gpu: 1
          limits:
            memory: 4Gi
            cpu: '2'
            nvidia.com/gpu: 1
        volumeMounts:
        - name: repo
          mountPath: /opt/repo
        - name: data
          mountPath: /mnt/data
      volumes:
      - name: repo
        emptyDir: {}
      - name: data
        persistentVolumeClaim:
          claimName: subject-drop-archive
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: PreferNoSchedule
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values:
                - NVIDIA-GeForce-RTX-3090
                - NVIDIA-A10
                - NVIDIA-L4
                - NVIDIA-GeForce-RTX-4090
                - NVIDIA-L40
                - NVIDIA-L40S
              - key: kubernetes.io/hostname
                operator: NotIn
                values:
                - uicnrp-fiona2.evl.uic.edu
                - gpu-14.nrp.mghpcc.org
                - gpu-17.nrp.mghpcc.org
                - gpu-18.nrp.mghpcc.org
                - hcc-chase-shor-c4715.unl.edu
                - hcc-nrp-shor-c6017.unl.edu
                - nautilus-ext-gpu01.fullerton.edu
                - nautilus-it-gpu01.fullerton.edu
                - nautilus-it-gpu03.fullerton.edu
                - rci-tide-gpu-03.sdsu.edu
                - ry-gpu-10.sdsc.optiputer.net
                - fiona-1.famu.edu
                - suncave-3
                - ry-gpu-04.sdsc.optiputer.net
                - ren-gp-argo-01.madren.org
                - hcc-chase-shor-c4705.unl.edu
                - cph-dgx-node7.humboldt.edu
                - nautilus-it-gpu06.fullerton.edu
