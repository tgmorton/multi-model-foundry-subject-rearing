apiVersion: batch/v1
kind: Job
metadata:
  name: thomas-fdy-matched-mamba370m-v1
  labels:
    owner: thomas
    study: subject-drop
    stage: eval-cell
    lang: en
    arch: mamba_370m
    phase: production
    eval-regime: matched-v1
  namespace: lemn-lab
spec:
  completionMode: Indexed
  completions: 45
  parallelism: 4
  activeDeadlineSeconds: 172800
  ttlSecondsAfterFinished: 172800
  podFailurePolicy:
    rules:
    - action: Ignore
      onExitCodes:
        containerName: evaluator
        operator: In
        values:
        - 2
  template:
    metadata:
      labels:
        owner: thomas
        study: subject-drop
        stage: eval-cell
        lang: en
    spec:
      priorityClassName: armada-default
      imagePullSecrets:
      - name: gitlab-registry-cred-thomas
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values:
                - NVIDIA-GeForce-RTX-3090
                - NVIDIA-A10
                - NVIDIA-L4
                - NVIDIA-GeForce-RTX-4090
              - key: kubernetes.io/hostname
                operator: NotIn
                values:
                - gpu-14.nrp.mghpcc.org
                - gpu-17.nrp.mghpcc.org
                - nautilus-it-gpu01.fullerton.edu
                - nautilus-it-gpu03.fullerton.edu
                - rci-tide-gpu-03.sdsu.edu
                - ry-gpu-10.sdsc.optiputer.net
                - hcc-nrp-shor-c6017.unl.edu
      initContainers:
      - name: clone-repo
        image: alpine/git
        command:
        - /bin/sh
        - -c
        args:
        - 'set -eu

          cd /opt/repo

          git init .

          git remote add origin https://github.com/tgmorton/multi-model-foundry-subject-rearing.git

          git fetch --depth 1 origin "$GIT_REF"

          git checkout --detach FETCH_HEAD

          '
        env:
        - name: GIT_REF
          value: 796f59b31cf7447eceaf26c387b477d94c6d6d93
        resources:
          requests:
            memory: 1Gi
            cpu: 200m
          limits:
            memory: 1Gi
            cpu: 200m
        volumeMounts:
        - name: repo
          mountPath: /opt/repo
      containers:
      - name: evaluator
        image: gitlab-registry.nrp-nautilus.io/thmorton/multi-model-foundry-subject-rearing@sha256:037b88f45101490ba412890bf431cfefc8c93cba80c7731041649d59aba9a259
        imagePullPolicy: IfNotPresent
        command:
        - /bin/bash
        - -c
        args:
        - "set -euo pipefail\nRUN_ID=$(python3 -c \"import json,os; print(json.loads(os.environ['RUN_IDS_JSON'])[int(os.environ['JOB_COMPLETION_INDEX'])])\"\
          )\necho \"==========================================\"\necho \"  CELL EVAL\
          \ \u2014 $RUN_ID (idx=$JOB_COMPLETION_INDEX)\"\necho \"==========================================\"\
          \n\n# GPU health probe (exit 2 \u2192 podFailurePolicy Ignore \u2192 reschedule).\n\
          python3 -c \"\nimport sys, torch\ntry:\n    if not torch.cuda.is_available():\n\
          \        print('FATAL: no CUDA', file=sys.stderr); sys.exit(2)\n    torch.cuda.synchronize()\n\
          \    x = torch.zeros(1024, device='cuda'); x.sum().item()\n    print(f'\
          \  GPU healthy: {torch.cuda.get_device_name(0)}')\nexcept Exception as e:\n\
          \    print(f'FATAL: GPU unhealthy: {e}', file=sys.stderr); sys.exit(2)\n\
          \"\n\ncd /opt/repo\n          nvidia-smi --query-gpu=timestamp,name,memory.used,memory.total,utilization.gpu,utilization.memory\
          \ --format=csv,noheader,nounits -l 15 &\n          TELEMETRY_PID=$!\n  \
          \        trap 'kill $TELEMETRY_PID 2>/dev/null || true' EXIT\n# PACK>1:\
          \ this pod owns a slice of RUN_IDS_JSON and runs PACK\n# cells concurrently\
          \ on its one GPU \u2014 overlapping one cell's\n# checkpoint I/O and post-eval\
          \ upload with another's forwards\n# keeps GPU/CPU/mem duty cycles high (NRP\
          \ utilization webhook).\nif [ \"${PACK:-1}\" -gt 1 ]; then\n  python3 -c\
          \ 'import json, os; ids = json.loads(os.environ[\"RUN_IDS_JSON\"]); i =\
          \ int(os.environ[\"JOB_COMPLETION_INDEX\"]); p = int(os.environ[\"PACK\"\
          ]); [print(x) for x in ids[i * p:(i + 1) * p]]' > /tmp/my_run_ids\n  fail=0\n\
          \  eval_pids=\"\"\n  while read -r rid; do\n    [ -z \"$rid\" ] && continue\n\
          \    ( python3 scripts/eval_v2_cell.py --run_id \"$rid\" \\\n        --batch_size\
          \ 64 --scratch_dir /tmp/eval_scratch \\\n        --matched_stimuli_root\
          \ /opt/repo/evaluation/stimuli/null-subj-v2-matched-v1 --benchmark null_subj_v2_condition_matched_v1\
          \ --output_root /mnt/data/eval_v2/null_subj_v2_condition_matched_v1 --expected_stimuli_manifest_sha256\
          \ 056ca1d2a5df745662ba501c97c434a2dde3a7cc857362d36b34caacd05d5de7 --scoring_version\
          \ null-subj-v2-condition-matched-v1 --slor 2>&1 | sed \"s/^/[$rid] /\" )\
          \ &\n    eval_pids=\"$eval_pids $!\"\n  done < /tmp/my_run_ids\n  # Wait\
          \ only for evaluator pipelines.  The nvidia-smi sampler is\n  # also a background\
          \ job and must be left for the EXIT trap; using\n  # jobs -p here would\
          \ wait forever on the sampler.\n  for p in $eval_pids; do wait \"$p\" ||\
          \ fail=1; done\n  exit $fail\nelse\n  python3 scripts/eval_v2_cell.py \\\
          \n    --run_id \"$RUN_ID\" \\\n    --batch_size 64 \\\n    --scratch_dir\
          \ /tmp/eval_scratch --matched_stimuli_root /opt/repo/evaluation/stimuli/null-subj-v2-matched-v1\
          \ --benchmark null_subj_v2_condition_matched_v1 --output_root /mnt/data/eval_v2/null_subj_v2_condition_matched_v1\
          \ --expected_stimuli_manifest_sha256 056ca1d2a5df745662ba501c97c434a2dde3a7cc857362d36b34caacd05d5de7\
          \ --scoring_version null-subj-v2-condition-matched-v1 --slor\nfi\n"
        env:
        - name: PYTHONPATH
          value: /opt/repo
        - name: PYTHONHASHSEED
          value: '0'
        - name: GIT_REF
          value: 796f59b31cf7447eceaf26c387b477d94c6d6d93
        - name: PACK
          value: '2'
        - name: RUN_IDS_JSON
          value: '["mamba_370m-en-baseline-h0-s137", "mamba_370m-en-baseline-h0-s1415936399",
            "mamba_370m-en-baseline-h0-s1568568120", "mamba_370m-en-baseline-h0-s1595274352",
            "mamba_370m-en-baseline-h0-s1640623142", "mamba_370m-en-baseline-h0-s1881877998",
            "mamba_370m-en-baseline-h0-s1891911437", "mamba_370m-en-baseline-h0-s2022192329",
            "mamba_370m-en-baseline-h0-s2078344582", "mamba_370m-en-baseline-h0-s302485963",
            "mamba_370m-en-baseline-h0-s314159", "mamba_370m-en-baseline-h0-s42",
            "mamba_370m-en-baseline-h2-s137", "mamba_370m-en-baseline-h2-s42", "mamba_370m-en-baseline-h3-s137",
            "mamba_370m-en-baseline-h3-s42", "mamba_370m-en-baseline-h4-s137", "mamba_370m-en-baseline-h4-s42",
            "mamba_370m-en-enrich_verbal_morphology-h0-s137", "mamba_370m-en-enrich_verbal_morphology-h0-s1415936399",
            "mamba_370m-en-enrich_verbal_morphology-h0-s1568568120", "mamba_370m-en-enrich_verbal_morphology-h0-s1595274352",
            "mamba_370m-en-enrich_verbal_morphology-h0-s1640623142", "mamba_370m-en-enrich_verbal_morphology-h0-s1881877998",
            "mamba_370m-en-enrich_verbal_morphology-h0-s1891911437", "mamba_370m-en-enrich_verbal_morphology-h0-s2022192329",
            "mamba_370m-en-enrich_verbal_morphology-h0-s2078344582", "mamba_370m-en-enrich_verbal_morphology-h0-s302485963",
            "mamba_370m-en-enrich_verbal_morphology-h0-s314159", "mamba_370m-en-enrich_verbal_morphology-h0-s42",
            "mamba_370m-en-enrich_verbal_morphology-h2-s137", "mamba_370m-en-enrich_verbal_morphology-h2-s42",
