        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: s3-secret-thomas
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: s3-secret-thomas
              key: AWS_SECRET_ACCESS_KEY
        - name: AWS_ENDPOINT_URL
          value: http://rook-ceph-rgw-nautiluss3.rook
        - name: AWS_DEFAULT_REGION
          value: us-west-1
        - name: REGISTRY_BUCKET
          value: thomas-subject-drop-artifacts
        resources:
          requests:
            memory: 12Gi
            cpu: '2'
            nvidia.com/gpu: 1
            ephemeral-storage: 20Gi
          limits:
            memory: 12Gi
            cpu: '2'
            nvidia.com/gpu: 1
            ephemeral-storage: 40Gi
        volumeMounts:
        - name: repo
          mountPath: /opt/repo
        - name: data
          mountPath: /mnt/data
      volumes:
      - name: repo
        emptyDir: {}
      - name: data
        persistentVolumeClaim:
          claimName: subject-drop-archive
      restartPolicy: Never
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      automountServiceAccountToken: false
      enableServiceLinks: false
  backoffLimitPerIndex: 100
  maxFailedIndexes: 0
  podReplacementPolicy: Failed
