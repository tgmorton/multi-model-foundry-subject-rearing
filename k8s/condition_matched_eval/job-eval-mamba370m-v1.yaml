            "mamba_370m-en-impoverish_case-h0-s137", "mamba_370m-en-impoverish_case-h0-s1415936399",
            "mamba_370m-en-impoverish_case-h0-s1568568120", "mamba_370m-en-impoverish_case-h0-s1595274352",
            "mamba_370m-en-impoverish_case-h0-s1640623142", "mamba_370m-en-impoverish_case-h0-s1881877998",
            "mamba_370m-en-impoverish_case-h0-s1891911437", "mamba_370m-en-impoverish_case-h0-s2022192329",
            "mamba_370m-en-impoverish_case-h0-s2078344582", "mamba_370m-en-impoverish_case-h0-s314159",
