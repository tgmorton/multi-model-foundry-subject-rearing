            "mamba_370m-en-remove_expletive_sentences-h0-s302485963", "mamba_370m-en-remove_expletive_sentences-h0-s314159",
            "mamba_370m-en-remove_expletive_sentences-h0-s42", "mamba_370m-en-remove_expletive_sentences-h2-s137",
            "mamba_370m-en-remove_expletive_sentences-h2-s42", "mamba_370m-en-remove_expletive_sentences-h3-s137",
            "mamba_370m-en-remove_expletive_sentences-h3-s42", "mamba_370m-en-remove_expletive_sentences-h4-s137",
