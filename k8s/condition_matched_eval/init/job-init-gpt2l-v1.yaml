apiVersion: batch/v1
kind: Job
metadata:
  name: thomas-fdy-matched-init-gpt2l-v1
  namespace: lemn-lab
  labels:
    owner: thomas
    study: subject-drop
    stage: matched-eval-init
    arch: gpt2_large
spec:
  completionMode: Indexed
  completions: 12
  parallelism: 2
  backoffLimitPerIndex: 100
  maxFailedIndexes: 0
  podReplacementPolicy: Failed
  podFailurePolicy:
    rules:
    - action: Ignore
      onExitCodes:
        containerName: evaluator
        operator: In
        values:
        - 2
  activeDeadlineSeconds: 172800
  ttlSecondsAfterFinished: 172800
  template:
    metadata:
      labels:
        owner: thomas
        study: subject-drop
        stage: matched-eval-init
        arch: gpt2_large
    spec:
      priorityClassName: armada-default
      imagePullSecrets:
      - name: gitlab-registry-cred-thomas
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values:
                - NVIDIA-GeForce-RTX-3090
                - NVIDIA-A10
                - NVIDIA-L4
                - NVIDIA-GeForce-RTX-4090
              - key: kubernetes.io/hostname
                operator: NotIn
                values:
                - gpu-14.nrp.mghpcc.org
                - gpu-17.nrp.mghpcc.org
                - nautilus-it-gpu01.fullerton.edu
                - nautilus-it-gpu03.fullerton.edu
                - rci-tide-gpu-03.sdsu.edu
                - ry-gpu-10.sdsc.optiputer.net
                - hcc-nrp-shor-c6017.unl.edu
      initContainers:
      - name: clone-repo
        image: alpine/git
        command:
        - /bin/sh
        - -c
        args:
        - 'set -eu

          cd /opt/repo

          git init .

          git remote add origin https://github.com/tgmorton/multi-model-foundry-subject-rearing.git

          git fetch --depth 1 origin "$GIT_REF"

          git checkout --detach FETCH_HEAD

          '
        env:
        - name: GIT_REF
          value: 97ba932d397fe8ba883411d62ccbb8968691d8f5
        resources:
          requests:
            cpu: 200m
            memory: 1Gi
          limits:
            cpu: 200m
            memory: 1Gi
        volumeMounts:
        - name: repo
          mountPath: /opt/repo
      containers:
      - name: evaluator
        image: gitlab-registry.nrp-nautilus.io/thmorton/multi-model-foundry-subject-rearing@sha256:037b88f45101490ba412890bf431cfefc8c93cba80c7731041649d59aba9a259
        imagePullPolicy: IfNotPresent
        command:
        - /bin/bash
        - -c
        args:
        - "set -euo pipefail\nSEED=$(python3 -c 'import json,os; print(json.loads(os.environ[\"\
          SEEDS_JSON\"])[int(os.environ[\"JOB_COMPLETION_INDEX\"])])')\nnvidia-smi\
          \ --query-gpu=timestamp,name,memory.used,memory.total,utilization.gpu,utilization.memory\
          \ --format=csv,noheader,nounits -l 15 &\nTELEMETRY_PID=$!\ntrap 'kill \"\
          $TELEMETRY_PID\" 2>/dev/null || true' EXIT\npython3 -c '\nimport sys, torch\n\
          try:\n    if not torch.cuda.is_available():\n        raise RuntimeError(\"\
          no CUDA\")\n    torch.cuda.synchronize()\n    torch.zeros(1024, device=\"\
          cuda\").sum().item()\n    print(f\"GPU healthy: {torch.cuda.get_device_name(0)}\"\
          )\nexcept Exception as exc:\n    print(f\"FATAL: GPU unhealthy: {exc}\"\
          , file=sys.stderr)\n    sys.exit(2)\n'\ncd /opt/repo\npython3 -u scripts/eval_v2_initialization.py\
          \   --arch gpt2_large --seed \"$SEED\"   --cells /mnt/data/eval_v2/null_subj_v2_condition_matched_v1/checkpoint_inventory.json\
          \ --repo /opt/repo --data-root /mnt/data   --device cuda --benchmark null_subj_v2_condition_matched_init_v1\
          \   --matched-stimuli-root /opt/repo/evaluation/stimuli/null-subj-v2-matched-v1\
          \   --expected-stimuli-manifest-sha256 056ca1d2a5df745662ba501c97c434a2dde3a7cc857362d36b34caacd05d5de7\
          \ --exclude-hp-rank 1\n"
        env:
        - name: PYTHONPATH
          value: /opt/repo
        - name: PYTHONHASHSEED
          value: '0'
        - name: GIT_REF
          value: 97ba932d397fe8ba883411d62ccbb8968691d8f5
        - name: IMAGE_DIGEST
          value: sha256:037b88f45101490ba412890bf431cfefc8c93cba80c7731041649d59aba9a259
        - name: SEEDS_JSON
          value: '[42, 137, 314159, 302485963, 1415936399, 1568568120, 1595274352,
            1640623142, 1881877998, 1891911437, 2022192329, 2078344582]'
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: s3-secret-thomas
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: s3-secret-thomas
              key: AWS_SECRET_ACCESS_KEY
        - name: AWS_ENDPOINT_URL
          value: http://rook-ceph-rgw-nautiluss3.rook
        - name: AWS_DEFAULT_REGION
          value: us-west-1
        - name: REGISTRY_BUCKET
          value: thomas-subject-drop-artifacts
        resources:
          requests:
            cpu: '4'
            memory: 16Gi
            nvidia.com/gpu: 1
            ephemeral-storage: 20Gi
          limits:
            cpu: '4'
            memory: 16Gi
            nvidia.com/gpu: 1
            ephemeral-storage: 40Gi
        volumeMounts:
        - name: repo
          mountPath: /opt/repo
        - name: data
          mountPath: /mnt/data
      volumes:
      - name: repo
        emptyDir: {}
      - name: data
        persistentVolumeClaim:
          claimName: subject-drop-archive
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
