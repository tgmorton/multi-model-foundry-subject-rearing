apiVersion: batch/v1
kind: Job
metadata:
  name: smoke-test-unit
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      initContainers:
      - name: clone-repo
        image: alpine/git
        args:
        - clone
        - --single-branch
        - --depth=1
        - https://github.com/tgmorton/multi-model-foundry-subject-rearing.git
        - /opt/repo
        resources:
          requests:
            memory: 1Gi
            cpu: "200m"
          limits:
            memory: 1Gi
            cpu: "200m"
        volumeMounts:
        - name: repo
          mountPath: /opt/repo
      containers:
      - name: unit-tests
        image: pytorch/pytorch:2.5.1-cuda12.1-cudnn9-runtime
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -e

          cd /opt/repo
          pip install --no-cache-dir \
            -r requirements.txt \
            pytest pytest-timeout 2>&1 | tail -5

          echo "=== Running all unit tests ==="
          python -m pytest model_foundry/tests/unit/ \
            -v --tb=short --timeout=120

          echo "=== Unit tests passed ==="
        env:
        - name: PYTHONPATH
          value: "/opt/repo"
        resources:
          requests:
            memory: 4Gi
            cpu: "2"
          limits:
            memory: 4Gi
            cpu: "2"
        volumeMounts:
        - name: repo
          mountPath: /opt/repo
      volumes:
      - name: repo
        emptyDir: {}
      restartPolicy: Never
