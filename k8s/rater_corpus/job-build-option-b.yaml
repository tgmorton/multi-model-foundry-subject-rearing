# Option B rater corpus build (2026-10-14): ~5B-word general-English corpus as
# line-based .train shards, with BabyLM 13-gram contamination removal.
#   python scripts/rater_corpus/build_option_b.py   (see its docstring)
#
# Input : /mnt/data/rater_corpus/raw/{ccnews_en_2016_2019,openwebtext,fineweb_sample10BT_b,
#         wikipedia_20231101_en,bookcorpusopen}  (from the job-download-*.yaml jobs)
#         /mnt/data/raw/en/{train_90M,pull_10M,test_10M}  (BabyLM, to be excluded)
# Output: /mnt/data/rater_corpus/optionb_v1/base/shard_NNN/{shard_NNN.train,docs.jsonl.gz}
#         /mnt/data/rater_corpus/optionb_v1/base/BUILD_MANIFEST.json
#         /mnt/data/rater_corpus/optionb_v1/_work/   (intermediates, ~40 GB; safe to delete
#                                                     after success, or add --cleanup-work)
#
# Single CPU pod, restartable: re-applying after a failure resumes from the cached per-file
# units / finished shards (see the script docstring).  --scale 2 gives the 10B variant.
#
# Sizing (requests == limits): 8 CPU / 24Gi.  Expected: CPU-bound at ~8 cores in the
# extraction and scoring passes.  Memory: the BabyLM 13-gram set (cross-line windows, ~1e8
# hashes) is ~0.8 GB sorted array + ~1 GB lookup table, loaded once before forking and
# shared copy-on-write; ~1 GB private per worker; coordinator arrays ~1 GB.  Expected RSS
# ~10-12 GiB.  Measured locally with 8 workers: BabyLM hashing stage ~8 GB summed RSS (which
# double-counts the shared pages).  CephFS page cache is not counted as RSS.  One pod under the 20% RAM mark would only use one of the 4 allowed
# webhook violations.
#
# The bad-node list is rendered from configs/bad_nodes.txt via scripts/bad_nodes.py
# (2026-10-14); re-render it if that file changes.
# v2 (2026-10-15): the shard stage's scattered pread()s of _work/ on CephFS hung on two
# nodes (all workers in folio_wait); sequential reads of the same files were fine. So the
# pod copies _work/ (~37 GB) to local disk first and builds from the copy.
apiVersion: batch/v1
kind: Job
metadata:
  name: thomas-build-optionb-v2
  namespace: lemn-lab
  labels: &id001
    owner: thomas
    study: subject-drop
    lang: en
    stage: rater-corpus-build
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels: *id001
    spec:
      priorityClassName: armada-default
      restartPolicy: Never
      imagePullSecrets:
      - name: gitlab-registry-cred-thomas
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: NotIn
                values:
                - uicnrp-fiona2.evl.uic.edu
                - gpu-14.nrp.mghpcc.org
                - gpu-17.nrp.mghpcc.org
                - gpu-18.nrp.mghpcc.org
                - hcc-chase-shor-c4715.unl.edu
                - hcc-nrp-shor-c6017.unl.edu
                - nautilus-ext-gpu01.fullerton.edu
                - nautilus-it-gpu01.fullerton.edu
                - nautilus-it-gpu03.fullerton.edu
                - rci-tide-gpu-03.sdsu.edu
                - ry-gpu-10.sdsc.optiputer.net
                - fiona-1.famu.edu
                - suncave-3
                - ry-gpu-04.sdsc.optiputer.net
                - ren-gp-argo-01.madren.org
                - hcc-chase-shor-c4705.unl.edu
                - cph-dgx-node7.humboldt.edu
                - nautilus-it-gpu06.fullerton.edu
                - hcc-nrp-shor-c5805.unl.edu
      initContainers:
      - name: clone-repo
        image: alpine/git
        command:
        - /bin/sh
        - -c
        args:
        - "set -eu\ngit clone --single-branch --depth=1 --branch=main \\\n  https://github.com/tgmorton/multi-model-foundry-subject-rearing.git /opt/repo\ngit -C /opt/repo rev-parse HEAD > /opt/repo/.git_sha\n"
        resources:
          requests:
            memory: 1Gi
            cpu: 200m
          limits:
            memory: 1Gi
            cpu: 200m
        volumeMounts:
        - name: repo
          mountPath: /opt/repo
      containers:
      - name: build
        image: gitlab-registry.nrp-nautilus.io/thmorton/multi-model-foundry-subject-rearing:latest
        imagePullPolicy: Always
        command:
        - /bin/bash
        - -c
        args:
        - "set -euo pipefail\nexport PYTHONPATH=\"/opt/repo:${PYTHONPATH:-}\"\nexport GIT_SHA=\"$(cat /opt/repo/.git_sha)\"\ncd /opt/repo\necho \"copying _work to local disk\"; t0=$(date +%s)\nmkdir -p\
          \ /scratch\n(cd /mnt/data/rater_corpus/optionb_v1 && find _work -type f -print0 | xargs -0 -P 8 -n 8 cp --parents -t /scratch)\necho \"copied $(du -sh /scratch/_work | cut -f1) in $(( $(date +%s)\
          \ - t0 ))s\"\npython -u scripts/rater_corpus/build_option_b.py \\\n  --raw-root /mnt/data/rater_corpus/raw \\\n  --babylm-dirs /mnt/data/raw/en/train_90M /mnt/data/raw/en/pull_10M /mnt/data/raw/en/test_10M\
          \ \\\n  --out /mnt/data/rater_corpus/optionb_v1/base \\\n  --work-dir /scratch/_work \\\n  --scale 1 --shards 200 --workers 8 --seed 42 \\\n  --target fineweb=0.35e9 --target bookcorpusopen=0.74e9\n"
        env:
        - name: PYTHONUNBUFFERED
          value: '1'
        - name: OMP_NUM_THREADS
          value: '1'
        - name: OPENBLAS_NUM_THREADS
          value: '1'
        resources:
          requests:
            cpu: '8'
            memory: 24Gi
            ephemeral-storage: 60Gi
          limits:
            cpu: '8'
            memory: 24Gi
            ephemeral-storage: 70Gi
        volumeMounts:
        - name: data
          mountPath: /mnt/data
        - name: repo
          mountPath: /opt/repo
        - name: scratch
          mountPath: /scratch
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: subject-drop-archive
      - name: repo
        emptyDir: {}
      - name: scratch
        emptyDir:
          sizeLimit: 65Gi
