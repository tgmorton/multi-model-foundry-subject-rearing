# Rater-corpus interventions, batch 1 (2026-10-16): 4 ablations x 64 single-file DocBin shards (whole DocBin loads at once; 6Gi OOM-killed).
# ~0.5 core, ~2 min per (ablation, shard); limit = request (>100 pods, NRP).
apiVersion: batch/v1
kind: Job
metadata:
  labels: &id001
    lang: en
    owner: thomas
    stage: rater-corpus-ablate
    study: subject-drop
  name: thomas-ablate-raterb-b1s
  namespace: lemn-lab
spec:
  backoffLimit: 40
  completionMode: Indexed
  completions: 256
  parallelism: 16
  template:
    metadata:
      labels: *id001
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: NotIn
                values:
                - cph-dgx-node7.humboldt.edu
                - fiona-1.famu.edu
                - gpu-14.nrp.mghpcc.org
                - gpu-17.nrp.mghpcc.org
                - gpu-18.nrp.mghpcc.org
                - hcc-chase-shor-c4705.unl.edu
                - hcc-chase-shor-c4715.unl.edu
                - hcc-nrp-shor-c5805.unl.edu
                - hcc-nrp-shor-c6017.unl.edu
                - nautilus-ext-gpu01.fullerton.edu
                - nautilus-it-gpu01.fullerton.edu
                - nautilus-it-gpu03.fullerton.edu
                - nautilus-it-gpu06.fullerton.edu
                - rci-tide-gpu-03.sdsu.edu
                - ren-gp-argo-01.madren.org
                - ry-gpu-01.sdsc.optiputer.net
                - ry-gpu-04.sdsc.optiputer.net
                - ry-gpu-10.sdsc.optiputer.net
                - suncave-3
                - uicnrp-fiona2.evl.uic.edu
      containers:
      - args:
        - "set -euo pipefail\nABLATIONS=(remove_expletive_sentences_en impoverish_case_en lemmatize_verbs enrich_verbal_morphology)\nread -ra SH <<< \"$SHARDS\"; NS=${#SH[@]}\nABL=${ABLATIONS[$((JOB_COMPLETION_INDEX\
          \ / NS))]}\nSHARD=$(printf \"shard_%03d\" \"${SH[$((JOB_COMPLETION_INDEX % NS))]}\")\nIN=/mnt/data/rater_corpus/optionb_v1/base/${SHARD}\nOUT=/mnt/data/rater_corpus/optionb_v1/${ABL}/${SHARD}\n\
          echo \"ablate ${ABL} ${SHARD} on ${NODE_NAME}\"\ncd /opt/repo; export PYTHONPATH=/opt/repo\nif [ -f \"${OUT}/ABLATION_MANIFEST.json\" ]; then echo \"[done already] ${OUT}\"; exit 0; fi\nANNOT=$(python\
          \ -c \"from pathlib import Path; from preprocessing.annotate import default_annotation_output_dir as d; print(d(Path('${IN}'), 'en_core_web_trf'))\")\nif [ ! -f \"${ANNOT}/ANNOTATION_MANIFEST.json\"\
          \ ]; then echo \"ERROR: annotation not done: ${ANNOT}\"; exit 3; fi\nmkdir -p \"${OUT}\"\npython -c \"\nfrom pathlib import Path\nimport preprocessing.ablations\nfrom preprocessing.base import\
          \ AblationPipeline\nfrom preprocessing.config import AblationConfig\nAblationPipeline(AblationConfig(type='${ABL}', input_path=Path('${IN}'), output_path=Path('${OUT}'),\n    annotated_input_path=Path('${ANNOT}'),\
          \ skip_backfill=True, spacy_model='en_core_web_trf',\n    skip_validation=True, chunk_size=500, verbose=False)).process_corpus()\n\"\n"
        command:
        - /bin/bash
        - -c
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: SHARDS
          value: 0 1 2 3 4 5 22 23 24 25 26 27 28 37 38 58 59 60 62 63 64 65 66 74 75 76 77 78 88 89 90 91 95 97 98 125 126 127 128 129 140 141 142 143 148 149 150 151 152 153 162 163 177 178 179 180 185
            186 187 188 189 190 191 199
        image: gitlab-registry.nrp-nautilus.io/thmorton/multi-model-foundry-subject-rearing:latest
        imagePullPolicy: Always
        name: ablator
        resources:
          requests:
            memory: 10Gi
            cpu: '1'
          limits:
            memory: 10Gi
            cpu: '1'
        volumeMounts:
        - mountPath: /opt/repo
          name: repo
        - mountPath: /mnt/data
          name: data
      imagePullSecrets:
      - name: gitlab-registry-cred-thomas
      initContainers:
      - args:
        - clone
        - --single-branch
        - --depth=1
        - --branch=main
        - https://github.com/tgmorton/multi-model-foundry-subject-rearing.git
        - /opt/repo
        image: alpine/git
        name: clone-repo
        resources:
          limits:
            cpu: 200m
            memory: 1Gi
          requests:
            cpu: 200m
            memory: 1Gi
        volumeMounts:
        - mountPath: /opt/repo
          name: repo
      priorityClassName: armada-default
      restartPolicy: Never
      volumes:
      - emptyDir: {}
        name: repo
      - name: data
        persistentVolumeClaim:
          claimName: subject-drop-archive
  ttlSecondsAfterFinished: 604800
