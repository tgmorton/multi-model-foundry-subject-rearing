# Annotate the Option B rater corpus (2026-10-15): one GPU pod per ~25M-word shard
# (/mnt/data/rater_corpus/optionb_v1/base/shard_NNN/), en_core_web_trf, same settings
# as k8s/job-annotate-en.yaml. Cache lands in /mnt/data/annotated/<hash(shard dir)>/.
# parallelism 40 (patchable live) keeps lemn-lab under its 200-pod quota alongside the
# gpt2_large wave. Missing shards exit 0, so the job can be applied before all exist.
# v2 (2026-10-15): the 24 GB Ampere pool was full (1 of 40 pods scheduled in 25 min), so the
# pool now adds RTX A4000 + Turing + Pascal (spaCy trf needs no FA2; torch cu121 and cupy-cuda12x
# support sm_60+). Volta is left free for the gpt2_large evals.
# v3 (2026-10-15): right-sized to 2 CPU / 10Gi (observed ~1 CPU, ~1.9 GiB at 19% of a shard; the
# DocBin is held in memory and serialized once at the end, so ~2x the projected ~5 GB peak).
# 4 CPU / 12Gi had 52 GPU-free nodes rejecting the pod on CPU or memory. Finished shards
# (ANNOTATION_MANIFEST.json, written last) are skipped, so the job is resumable.
apiVersion: batch/v1
kind: Job
metadata:
  name: thomas-annotate-raterb-v3
  namespace: lemn-lab
  labels: &id001
    owner: thomas
    study: subject-drop
    lang: en
    stage: rater-corpus-annotate
spec:
  completionMode: Indexed
  completions: 200
  parallelism: 60
  backoffLimit: 200
  ttlSecondsAfterFinished: 604800
  podFailurePolicy:
    rules:
    - action: Ignore
      onExitCodes:
        containerName: annotator
        operator: In
        values:
        - 2
        - 128
  template:
    metadata:
      labels: *id001
    spec:
      priorityClassName: armada-default
      restartPolicy: Never
      imagePullSecrets:
      - name: gitlab-registry-cred-thomas
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: PreferNoSchedule
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values:
                - NVIDIA-GeForce-RTX-3090
                - NVIDIA-A10
                - NVIDIA-L4
                - NVIDIA-L40
                - NVIDIA-L40S
                - NVIDIA-GeForce-RTX-4090
                - NVIDIA-RTX-A4000
                - NVIDIA-GeForce-RTX-2080-Ti
                - Tesla-T4
                - NVIDIA-TITAN-RTX
                - NVIDIA-GeForce-GTX-1080-Ti
                - NVIDIA-TITAN-Xp
              - key: kubernetes.io/hostname
                operator: NotIn
                values:
                - uicnrp-fiona2.evl.uic.edu
                - gpu-14.nrp.mghpcc.org
                - gpu-17.nrp.mghpcc.org
                - gpu-18.nrp.mghpcc.org
                - hcc-chase-shor-c4715.unl.edu
                - hcc-nrp-shor-c6017.unl.edu
                - nautilus-ext-gpu01.fullerton.edu
                - nautilus-it-gpu01.fullerton.edu
                - nautilus-it-gpu03.fullerton.edu
                - rci-tide-gpu-03.sdsu.edu
                - ry-gpu-10.sdsc.optiputer.net
                - fiona-1.famu.edu
                - suncave-3
                - ry-gpu-04.sdsc.optiputer.net
                - ren-gp-argo-01.madren.org
                - hcc-chase-shor-c4705.unl.edu
                - cph-dgx-node7.humboldt.edu
                - nautilus-it-gpu06.fullerton.edu
      initContainers:
      - name: clone-repo
        image: alpine/git
        args:
        - clone
        - --single-branch
        - --depth=1
        - --branch=main
        - https://github.com/tgmorton/multi-model-foundry-subject-rearing.git
        - /opt/repo
        resources:
          requests:
            memory: 1Gi
            cpu: 200m
          limits:
            memory: 1Gi
            cpu: 200m
        volumeMounts:
        - name: repo
          mountPath: /opt/repo
      containers:
      - name: annotator
        image: gitlab-registry.nrp-nautilus.io/thmorton/multi-model-foundry-subject-rearing:latest
        imagePullPolicy: Always
        command:
        - /bin/bash
        - -c
        args:
        - "set -euo pipefail\nSHARD=$(printf \"shard_%03d\" \"$JOB_COMPLETION_INDEX\")\nINPUT_DIR=/mnt/data/rater_corpus/optionb_v1/base/${SHARD}\necho \"annotate ${SHARD} on ${NODE_NAME}\"\nif [ ! -f \"\
          ${INPUT_DIR}/${SHARD}.train\" ]; then echo \"[skip] no ${INPUT_DIR}/${SHARD}.train\"; exit 0; fi\nANNOT=$(cd /opt/repo && PYTHONPATH=/opt/repo python -c \"from pathlib import Path; from preprocessing.annotate\
          \ import default_annotation_output_dir as d; print(d(Path('${INPUT_DIR}'), 'en_core_web_trf'))\")\nif [ -f \"${ANNOT}/ANNOTATION_MANIFEST.json\" ] && [ -f \"${ANNOT}/${SHARD}.linemap.jsonl\" ];\
          \ then echo \"[done already] ${ANNOT}\"; exit 0; fi\npip install --quiet \"cupy-cuda12x<14\" \"numpy<2\" || echo \"[warn] cupy install failed; CPU fallback\"\nexport PYTHONPATH=\"/opt/repo:${PYTHONPATH:-}\"\
          \npython -c \"import spacy; print('spacy.prefer_gpu() =', spacy.prefer_gpu())\"\ncd /opt/repo\npython -m preprocessing.annotate --input \"${INPUT_DIR}/\" --spacy-model en_core_web_trf \\\n  --file\
          \ \"${SHARD}\" --chunk-size 500 --spacy-batch-size 32\n"
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        resources:
          requests:
            memory: 10Gi
            cpu: '2'
            nvidia.com/gpu: 1
          limits:
            memory: 10Gi
            cpu: '2'
            nvidia.com/gpu: 1
        volumeMounts:
        - name: repo
          mountPath: /opt/repo
        - name: data
          mountPath: /mnt/data
      volumes:
      - name: repo
        emptyDir: {}
      - name: data
        persistentVolumeClaim:
          claimName: subject-drop-archive
