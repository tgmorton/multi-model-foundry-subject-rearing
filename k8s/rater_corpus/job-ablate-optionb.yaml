# Interventions on the Option B rater corpus (2026-10-15): 4 ablations x 200 shards =
# 800 CPU pods, index = ablation*200 + shard. Same AblationPipeline settings as
# k8s/job-ablate-compose-en.yaml, skip_backfill and no compose step (rater corpora need
# not be size-matched). Apply after annotation finishes; done shards exit 0 (resumable).
apiVersion: batch/v1
kind: Job
metadata:
  name: thomas-ablate-raterb-v1
  namespace: lemn-lab
  labels: &id001
    owner: thomas
    study: subject-drop
    lang: en
    stage: rater-corpus-ablate
spec:
  completionMode: Indexed
  completions: 800
  parallelism: 40
  backoffLimit: 200
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels: *id001
    spec:
      priorityClassName: armada-default
      restartPolicy: Never
      imagePullSecrets:
      - name: gitlab-registry-cred-thomas
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: NotIn
                values:
                - uicnrp-fiona2.evl.uic.edu
                - gpu-14.nrp.mghpcc.org
                - gpu-17.nrp.mghpcc.org
                - gpu-18.nrp.mghpcc.org
                - hcc-chase-shor-c4715.unl.edu
                - hcc-nrp-shor-c6017.unl.edu
                - nautilus-ext-gpu01.fullerton.edu
                - nautilus-it-gpu01.fullerton.edu
                - nautilus-it-gpu03.fullerton.edu
                - rci-tide-gpu-03.sdsu.edu
                - ry-gpu-10.sdsc.optiputer.net
                - fiona-1.famu.edu
                - suncave-3
                - ry-gpu-04.sdsc.optiputer.net
                - ren-gp-argo-01.madren.org
                - hcc-chase-shor-c4705.unl.edu
                - cph-dgx-node7.humboldt.edu
                - nautilus-it-gpu06.fullerton.edu
      initContainers:
      - name: clone-repo
        image: alpine/git
        args:
        - clone
        - --single-branch
        - --depth=1
        - --branch=main
        - https://github.com/tgmorton/multi-model-foundry-subject-rearing.git
        - /opt/repo
        resources:
          requests:
            memory: 1Gi
            cpu: 200m
          limits:
            memory: 1Gi
            cpu: 200m
        volumeMounts:
        - name: repo
          mountPath: /opt/repo
      containers:
      - name: ablator
        image: gitlab-registry.nrp-nautilus.io/thmorton/multi-model-foundry-subject-rearing:latest
        imagePullPolicy: Always
        command:
        - /bin/bash
        - -c
        args:
        - "set -euo pipefail\nABLATIONS=(remove_expletive_sentences_en impoverish_case_en lemmatize_verbs enrich_verbal_morphology)\nNSHARD=200\nABL=${ABLATIONS[$((JOB_COMPLETION_INDEX / NSHARD))]}\nSHARD=$(printf\
          \ \"shard_%03d\" $((JOB_COMPLETION_INDEX % NSHARD)))\nIN=/mnt/data/rater_corpus/optionb_v1/base/${SHARD}\nOUT=/mnt/data/rater_corpus/optionb_v1/${ABL}/${SHARD}\necho \"ablate ${ABL} ${SHARD} on\
          \ ${NODE_NAME}\"\ncd /opt/repo; export PYTHONPATH=/opt/repo\nif [ -f \"${OUT}/ABLATION_MANIFEST.json\" ]; then echo \"[done already] ${OUT}\"; exit 0; fi\nANNOT=$(python -c \"from pathlib import\
          \ Path; from preprocessing.annotate import default_annotation_output_dir as d; print(d(Path('${IN}'), 'en_core_web_trf'))\")\nif [ ! -f \"${ANNOT}/${SHARD}.spacy\" ]; then echo \"ERROR: annotation\
          \ missing: ${ANNOT}/${SHARD}.spacy\"; exit 1; fi\nmkdir -p \"${OUT}\"\npython -c \"\nfrom pathlib import Path\nimport preprocessing.ablations\nfrom preprocessing.base import AblationPipeline\n\
          from preprocessing.config import AblationConfig\nAblationPipeline(AblationConfig(type='${ABL}', input_path=Path('${IN}'), output_path=Path('${OUT}'),\n    annotated_input_path=Path('${ANNOT}'),\
          \ skip_backfill=True, spacy_model='en_core_web_trf',\n    skip_validation=True, chunk_size=500, verbose=False)).process_corpus()\n\"\n"
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        resources:
          requests:
            memory: 10Gi
            cpu: '4'
          limits:
            memory: 10Gi
            cpu: '4'
        volumeMounts:
        - name: repo
          mountPath: /opt/repo
        - name: data
          mountPath: /mnt/data
      volumes:
      - name: repo
        emptyDir: {}
      - name: data
        persistentVolumeClaim:
          claimName: subject-drop-archive
