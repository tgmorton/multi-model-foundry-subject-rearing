# Full rater caches, stage 1 of 2 (docs/BERT_RECIPE_V2.md, "Full rater plan"), for
# the base corpus in null-subjects. Index 0 is the 128-token cache (phase A), index 1
# the 512-token cache (phase B). CPU only. Tokenize + chunk are pre-run jobs, never
# inline in training pods. Sizing is an estimate: the first run measures it.
apiVersion: batch/v1
kind: Job
metadata:
  name: thomas-rater-tokenize-full
  namespace: null-subjects
  labels: {owner: thomas, study: subject-drop, stage: precache, arch: bert-large}
spec:
  completionMode: Indexed
  completions: 2
  parallelism: 2
  backoffLimit: 3
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels: {owner: thomas, study: subject-drop, stage: precache, arch: bert-large}
    spec:
      restartPolicy: Never
      priorityClassName: armada-default
      imagePullSecrets:
      - name: gitlab-registry-cred-thomas
      initContainers:
      - name: clone-repo
        image: alpine/git
        args: [clone, --single-branch, --depth=1, --branch=eval/bert-v2,
               "https://github.com/tgmorton/multi-model-foundry-subject-rearing.git", /opt/repo]
        resources:
          requests: {memory: 1Gi, cpu: "200m"}
          limits: {memory: 1Gi, cpu: "200m"}
        volumeMounts: [{name: repo, mountPath: /opt/repo}]
      containers:
      - name: precache
        image: gitlab-registry.nrp-nautilus.io/thmorton/multi-model-foundry-subject-rearing:latest
        imagePullPolicy: Always
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -euo pipefail
          cd /opt/repo
          rm -rf data/raw data/tokenized data/chunked tokenizers models
          mkdir -p data /mnt/data/tokenized /mnt/data/chunked
          ln -sfn /mnt/data/raw        data/raw
          ln -sfn /mnt/data/tokenized  data/tokenized
          ln -sfn /mnt/data/chunked    data/chunked
          ln -sfn /mnt/data/tokenizers tokenizers
          case "$JOB_COMPLETION_INDEX" in
            0) SEQ=128 ;;
            1) SEQ=512 ;;
            *) echo "FAIL unknown index"; exit 1 ;;
          esac
          CFG=/tmp/rater_full_$SEQ.yaml
          python scripts/rater_sweep.py render-config \
            --base configs/sweeps/baselines/rater_bert_large_preln_en_race.yaml \
            --corpus-dir /mnt/data/rater_corpus/full_v1/base --out "$CFG"
          sed -i "s/max_sequence_length: 128/max_sequence_length: $SEQ/" "$CFG"
          grep -q "max_sequence_length: $SEQ" "$CFG"
          python -m model_foundry.cli validate-config "$CFG"
          # Computing a cache key reads the whole corpus (~40 min on CephFS), so take it from the tokenizer's log.
          python -m model_foundry.cli tokenize-dataset "$CFG" | tee /tmp/tokenize.log
          KEY=$(awk '/Cache key:/ {print $NF; exit}' /tmp/tokenize.log)
          [ -n "$KEY" ] || { echo "FAIL no cache key in log"; exit 1; }
          echo "=== rater cache seq=$SEQ key=$KEY"
          for f in /mnt/data/tokenized/$KEY/train/dataset_info.json /mnt/data/tokenized/$KEY/test/dataset_info.json; do
            [ -f "$f" ] || { echo "FAIL missing $f"; exit 1; }
          done
          rm -rf "/mnt/data/tokenized/$KEY/.cache"
          du -sh "/mnt/data/tokenized/$KEY"
          echo "TOKENIZE OK seq=$SEQ key=$KEY"
        env:
        - {name: PYTHONPATH, value: "/opt/repo"}
        - {name: TOKENIZERS_PARALLELISM, value: "false"}
        resources:
          # 8 map workers, one per core. The map streams through arrow, so memory stays small.
          requests: {cpu: "8", memory: 8Gi}
          limits: {cpu: "8", memory: 8Gi}
        volumeMounts:
        - {name: repo, mountPath: /opt/repo}
        - {name: data, mountPath: /mnt/data}
      volumes:
      - {name: repo, emptyDir: {}}
      - name: data
        persistentVolumeClaim: {claimName: thomas-rater-corpus}
