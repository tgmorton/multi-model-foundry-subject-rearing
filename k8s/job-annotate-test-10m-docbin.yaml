# Parse cache (DocBin, en_core_web_trf) for the held-out test set, the same
# annotation train_90M and pull_10M have (k8s/job-annotate-en.yaml). Needed to
# apply an intervention's edits to test_10M text, e.g. to re-rate the test set
# with a rater trained on that intervention (scripts/launch_rater_scoring.py
# --corpora test_10M). Output: /mnt/data/annotated/40d8bab4f4b28a82/ (the
# cache key of /mnt/data/raw/en/test_10M). The .train files there are
# symlinks to the .test files. One pod per genre.
apiVersion: batch/v1
kind: Job
metadata:
  name: thomas-annotate-test10m-docbin-v1
  namespace: lemn-lab
  labels: &lab {owner: thomas, study: subject-drop, lang: en, stage: annotate}
spec:
  completionMode: Indexed
  completions: 6
  parallelism: 6
  backoffLimit: 12
  ttlSecondsAfterFinished: 604800
  podFailurePolicy:
    rules:
    - action: Ignore
      onPodConditions:
      - {type: DisruptionTarget}
  template:
    metadata:
      labels: *lab
    spec:
      priorityClassName: armada-default
      imagePullSecrets:
      - name: gitlab-registry-cred-thomas
      restartPolicy: Never
      tolerations:
      - {key: nvidia.com/gpu, operator: Exists, effect: PreferNoSchedule}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values:
                - NVIDIA-GeForce-RTX-3090
                - NVIDIA-A10
                - NVIDIA-L4
                - NVIDIA-L40
                - NVIDIA-L40S
                - NVIDIA-GeForce-RTX-4090
                - NVIDIA-RTX-A5000
                - NVIDIA-GeForce-RTX-2080-Ti
                - Tesla-V100-SXM2-16GB
                - Tesla-V100-SXM2-32GB
                - NVIDIA-TITAN-RTX
              - key: kubernetes.io/hostname
                operator: NotIn
                values:
                - uicnrp-fiona2.evl.uic.edu
                - gpu-14.nrp.mghpcc.org
                - gpu-17.nrp.mghpcc.org
                - gpu-18.nrp.mghpcc.org
                - hcc-chase-shor-c4715.unl.edu
                - hcc-nrp-shor-c6017.unl.edu
                - nautilus-ext-gpu01.fullerton.edu
                - nautilus-it-gpu01.fullerton.edu
                - nautilus-it-gpu03.fullerton.edu
                - rci-tide-gpu-03.sdsu.edu
                - ry-gpu-10.sdsc.optiputer.net
                - fiona-1.famu.edu
                - suncave-3
                - ry-gpu-04.sdsc.optiputer.net
                - ren-gp-argo-01.madren.org
                - hcc-chase-shor-c4705.unl.edu
                - cph-dgx-node7.humboldt.edu
                - nautilus-it-gpu06.fullerton.edu
                - hcc-nrp-shor-c5805.unl.edu
                - ry-gpu-01.sdsc.optiputer.net
                - k8s-chase-ci-07.calit2.optiputer.net
                - nrp-fiona-001.sdmz.amnh.org
                - k8s-chase-ci-01.calit2.optiputer.net
                - gpengine-uams.areon.net
                - k8s-haosu-15.sdsc.optiputer.net
                - hcc-prp-c5038.unl.edu
      initContainers:
      - name: clone-repo
        image: alpine/git
        args: [clone, --single-branch, --depth=1, --branch=eval/bert-v2,
               "https://github.com/tgmorton/multi-model-foundry-subject-rearing.git", /opt/repo]
        resources:
          requests: {memory: 1Gi, cpu: "200m"}
          limits: {memory: 1Gi, cpu: "200m"}
        volumeMounts: [{name: repo, mountPath: /opt/repo}]
      containers:
      - name: annotator
        image: gitlab-registry.nrp-nautilus.io/thmorton/multi-model-foundry-subject-rearing:latest
        imagePullPolicy: Always
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -euo pipefail
          GENRES=(childes open_subtitles gutenberg bnc_spoken simple_wiki switchboard)
          GENRE=${GENRES[$JOB_COMPLETION_INDEX]}
          INPUT_DIR=/mnt/data/raw/en/test_10M
          echo "=== annotate test_10M/$GENRE on ${NODE_NAME:-?}"
          test -f "$INPUT_DIR/$GENRE.train"
          pip install --quiet "cupy-cuda12x<14" "numpy<2" || echo '[warn] cupy install failed; will run on CPU'
          export PYTHONPATH="/opt/repo:${PYTHONPATH:-}"
          python -c "import spacy; print('spacy.prefer_gpu() =', spacy.prefer_gpu())"
          cd /opt/repo
          python -m preprocessing.annotate --input $INPUT_DIR/ --spacy-model en_core_web_trf \
            --file $GENRE --chunk-size 500 --spacy-batch-size 32
          ls -la /mnt/data/annotated/40d8bab4f4b28a82/ | grep "$GENRE"
          echo "DONE $GENRE"
        env:
        - {name: PYTHONUNBUFFERED, value: "1"}
        - {name: TOKENIZERS_PARALLELISM, value: "false"}
        - name: NODE_NAME
          valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
        resources:
          requests: {memory: 7Gi, cpu: "2", nvidia.com/gpu: 1}
          limits: {memory: 7Gi, cpu: "2", nvidia.com/gpu: 1}
        volumeMounts:
        - {name: repo, mountPath: /opt/repo}
        - {name: data, mountPath: /mnt/data}
      volumes:
      - {name: repo, emptyDir: {}}
      - name: data
        persistentVolumeClaim: {claimName: subject-drop-archive}
