apiVersion: batch/v1
kind: Job
metadata:
  name: eval-v2-bench
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      initContainers:
      - name: clone-repo
        image: alpine/git
        args:
        - clone
        - --single-branch
        - --depth=1
        - https://github.com/tgmorton/multi-model-foundry-subject-rearing.git
        - /opt/repo
        resources:
          requests:
            memory: 1Gi
            cpu: "200m"
          limits:
            memory: 1Gi
            cpu: "200m"
        volumeMounts:
        - name: repo
          mountPath: /opt/repo
      containers:
      - name: eval-v2-bench
        image: pytorch/pytorch:2.5.1-cuda12.1-cudnn9-runtime
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -e
          echo "=== eval-v2-bench started at $(date) on $(hostname) ==="

          pip install --no-cache-dir \
            transformers \
            sentencepiece \
            pandas \
            pyarrow \
            duckdb \
            tqdm \
            pydantic \
            pyyaml

          echo "=== pip install done at $(date) ==="

          cd /opt/repo
          which python && python --version

          # STAGED run only. We already have the direct-CephFS baseline
          # from the previous bench at /mnt/data/eval_v2/bench_90M (576s
          # parquet write). Write to local /scratch then cp -r to CephFS.
          echo ""
          echo "=== Wiping previous staged outputs ==="
          rm -rf /mnt/data/eval_v2/bench_90M_v2
          mkdir -p /scratch/bench_out

          echo ""
          echo "=== STAGED BENCH: /scratch → CephFS ==="
          echo "--- local write phase ---"
          time PYTHONPATH=/opt/repo python -u scripts/eval_v2_bench.py \
            --checkpoint_root /mnt/data/models/exp0_baseline_90M_smoke_resume \
            --tokenizer_dir /mnt/data/tokenizers/exp0_baseline_90M_smoke \
            --stimuli_dir evaluation/stimuli/null-subj-v2/staging \
            --output_root /scratch/bench_out/bench_90M_v2 \
            --cell_id bench_90M_all_stimuli_v2 \
            --architecture gpt2 \
            --intervention baseline \
            --rep 0 \
            --batch_size 16 \
            --device auto

          echo ""
          echo "--- local size + file count ---"
          du -sh /scratch/bench_out/bench_90M_v2
          find /scratch/bench_out/bench_90M_v2 -name "*.parquet" | wc -l | xargs echo "parquet files:"

          echo ""
          echo "--- cp -r phase (staged → CephFS) ---"
          CP_START=$(date +%s)
          cp -r /scratch/bench_out/bench_90M_v2 /mnt/data/eval_v2/bench_90M_v2
          CP_SECS=$(( $(date +%s) - CP_START ))
          echo "cp_secs=$CP_SECS"

          echo ""
          echo "--- destination verification ---"
          du -sh /mnt/data/eval_v2/bench_90M_v2
          find /mnt/data/eval_v2/bench_90M_v2 -name "*.parquet" | wc -l | xargs echo "dest parquet files:"

          # Append cp timing into the bench_summary.json so we have
          # everything in one place even if logs rotate.
          python - <<PY
          import json, pathlib
          p = pathlib.Path('/mnt/data/eval_v2/bench_90M_v2/bench_summary.json')
          if p.exists():
              d = json.loads(p.read_text())
              d['cp_to_cephfs_secs'] = $CP_SECS
              p.write_text(json.dumps(d, indent=2))
              print('  appended cp_to_cephfs_secs=$CP_SECS to', p)
          PY

          echo ""
          echo "✅ eval-v2-bench complete at $(date)"
        env:
        - name: PYTHONPATH
          value: "/opt/repo"
        - name: PYTORCH_CUDA_ALLOC_CONF
          value: "expandable_segments:True"
        - name: WANDB_MODE
          value: "disabled"
        resources:
          requests:
            memory: 8Gi
            cpu: "2"
            nvidia.com/gpu: 1
          limits:
            memory: 8Gi
            cpu: "2"
            nvidia.com/gpu: 1
        volumeMounts:
        - name: repo
          mountPath: /opt/repo
        - name: data
          mountPath: /mnt/data
        - name: scratch
          mountPath: /scratch
      volumes:
      - name: repo
        emptyDir: {}
      - name: scratch
        emptyDir:
          sizeLimit: 10Gi
      - name: data
        persistentVolumeClaim:
          claimName: corpus-analysis-data
      restartPolicy: Never
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
