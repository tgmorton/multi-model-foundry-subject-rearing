---
# WandB sweep agent pod for gpt2_medium × English.
#
# One-time setup before launching this job:
#   wandb sweep --entity <your-entity> --project subject-drop-sweeps \
#               configs/sweeps/gpt2_medium_en.yaml
#   # → returns an ID like "abc123"
#   export SWEEP_ID=<that id>
#
# Launch N parallel agents by applying this YAML N times (or use
# `kubectl apply -f <this> -l sweep_id=abc123` after editing the
# SWEEP_ID env below to your ID). Each agent runs `--count 30` trials
# and terminates when the sweep converges or its budget is exhausted.
#
# Trials do NOT save checkpoints (sweep YAML forces
# auto_generate_checkpoints=false + checkpoint_schedule=[]). Proxy
# metrics + registry record + env snapshot are the only outputs.
apiVersion: batch/v1
kind: Job
metadata:
  name: thomas-sweep-mamba-370m-es
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  # 3 concurrent agent pods × 15 trials each = 45 total trials.
  # Bayesian optimization with more than ~4 concurrent agents degrades
  # toward random search (posterior stays stale across parallel samples).
  parallelism: 3
  completions: 3
  template:
    spec:
      imagePullSecrets:
      - name: gitlab-registry-cred-thomas
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values:
                # 24 GB tier — GPT-2 medium (124M) fits comfortably.
                # Bumps up if effective_batch_size=1024 + seq_len=1000
                # pushes close; we'll see from the first trials.
                - NVIDIA-GeForce-RTX-3090
                - NVIDIA-A10
                - NVIDIA-L4
                - NVIDIA-L40
                - NVIDIA-L40S
                - NVIDIA-GeForce-RTX-4090
      initContainers:
      - name: clone-repo
        image: alpine/git
        args:
        - clone
        - --single-branch
        - --depth=1
        - --branch=main
        - https://github.com/tgmorton/multi-model-foundry-subject-rearing.git
        - /opt/repo
        resources:
          requests: {memory: 1Gi, cpu: "200m"}
          limits:   {memory: 1Gi, cpu: "200m"}
        volumeMounts:
        - {name: repo, mountPath: /opt/repo}
      containers:
      - name: sweep-agent
        image: gitlab-registry.nrp-nautilus.io/thmorton/multi-model-foundry-subject-rearing:latest
        imagePullPolicy: Always
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -euo pipefail
          echo "=========================================="
          echo "  SWEEP AGENT — mamba 370m es"
          echo "=========================================="
          cat /opt/repo/.git/HEAD 2>/dev/null || echo "(no HEAD)"

          cd /opt/repo
          mkdir -p /opt/repo/data
          # git ships data/chunked/test_checkpoint_scheduling/ + annotated
          # corpora under data/, so /opt/repo/data/* arrives populated.
          # `ln -sfn` silently can't replace non-empty dirs → writes go to
          # pod-local emptyDir, vanishing when the pod exits. Nuke first.
          rm -rf /opt/repo/data/raw /opt/repo/data/tokenized /opt/repo/data/chunked /opt/repo/tokenizers /opt/repo/models
          mkdir -p /mnt/data/tokenized /mnt/data/chunked /mnt/data/tokenizers /mnt/data/models
          ln -sfn /mnt/data/raw /opt/repo/data/raw
          ln -sfn /mnt/data/tokenized /opt/repo/data/tokenized
          ln -sfn /mnt/data/chunked /opt/repo/data/chunked
          ln -sfn /mnt/data/tokenizers /opt/repo/tokenizers
          ln -sfn /mnt/data/models /opt/repo/models
          for d in /opt/repo/data/raw /opt/repo/data/tokenized /opt/repo/data/chunked /opt/repo/tokenizers /opt/repo/models; do
            [ -L "$d" ] || { echo "FAIL $d is not a symlink after setup"; exit 1; }
          done

          BASE=configs/sweeps/baselines/mamba_370m_es.yaml
          python -m model_foundry.cli validate-config $BASE

          # PRE-RUN DISCIPLINE (see memory/feedback_prerun_caches.md):
          # tokenize-dataset + preprocess-data are one-shot pre-jobs
          # run via k8s/job-prepare-dataset.yaml BEFORE launching the
          # sweep. The sweep pods only READ from cache. If the cache
          # is missing, fail loud — don't silently race.
          CACHE_KEY=$(python -c "
          import yaml, sys
          sys.path.insert(0, '/opt/repo')
          from model_foundry.cache_keys import compute_cache_key
          cfg = yaml.safe_load(open('$BASE'))
          corpus = cfg['data']['training_corpus']
          if not corpus.startswith('/'): corpus = '/opt/repo/' + corpus
          tok = cfg['tokenizer']['output_dir']
          if not tok.startswith('/'): tok = '/opt/repo/' + tok
          print(compute_cache_key(corpus, tok, cfg['data']['max_sequence_length'], cfg.get('dataset_manipulation') or []))
          ")
          test -n "$CACHE_KEY" || { echo "FAIL couldn't resolve cache_key"; exit 1; }
          # Tokenized has train/ + test/ subdirs; chunked is saved flat.
          TOKENIZED=/mnt/data/tokenized/$CACHE_KEY/train/dataset_info.json
          CHUNKED=/mnt/data/chunked/$CACHE_KEY/dataset_info.json
          if [ ! -f "$TOKENIZED" ]; then
            echo "FAIL missing tokenized cache: $TOKENIZED"
            echo "  run k8s/job-prepare-dataset.yaml with TARGET_CONFIG=$BASE first"
            exit 1
          fi
          if [ ! -f "$CHUNKED" ]; then
            echo "FAIL missing chunked cache: $CHUNKED"
            echo "  run k8s/job-prepare-dataset.yaml with TARGET_CONFIG=$BASE first"
            exit 1
          fi
          echo "cache warm: $CACHE_KEY (tokenized + chunked both present)"

          # Sanity: WandB key present?
          test -n "${WANDB_API_KEY:-}" || { echo "FAIL WANDB_API_KEY missing"; exit 1; }
          test -n "${SWEEP_ID:-}" || { echo "FAIL SWEEP_ID missing"; exit 1; }

          # The agent runs N trials sequentially in this pod. To go
          # wider, apply more copies of this job (each gets a new ID).
          exec wandb agent --count "${TRIAL_COUNT:-30}" "$SWEEP_ID"
        env:
        - {name: PYTHONPATH, value: "/opt/repo"}
        - {name: PYTORCH_CUDA_ALLOC_CONF, value: "expandable_segments:True"}
        # Sweep controller ID (from `wandb sweep <config>`).
        # EDIT THIS before applying, or use `kubectl set env`.
        - name: SWEEP_ID
          value: "thmorton-uc-san-diego/subject-drop-sweeps/h2kvrl9k"
        - name: TRIAL_COUNT
          value: "15"
        # WandB auth
        - name: WANDB_API_KEY
          valueFrom: {secretKeyRef: {name: wandb-secret-thomas, key: WANDB_API_KEY}}
        # Registry / S3 plumbing
        - name: AWS_ACCESS_KEY_ID
          valueFrom: {secretKeyRef: {name: s3-secret-thomas, key: AWS_ACCESS_KEY_ID}}
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom: {secretKeyRef: {name: s3-secret-thomas, key: AWS_SECRET_ACCESS_KEY}}
        - {name: AWS_ENDPOINT_URL,   value: "http://rook-ceph-rgw-nautiluss3.rook"}
        - {name: AWS_DEFAULT_REGION, value: "us-west-1"}
        - {name: REGISTRY_BUCKET,    value: "thomas-subject-drop-artifacts"}
        - {name: REGISTRY_RUN_KIND,  value: "hp_sweep"}
        - {name: DOCKER_IMAGE,       value: "gitlab-registry.nrp-nautilus.io/thmorton/multi-model-foundry-subject-rearing:latest"}
        resources:
          requests: {memory: 8Gi, cpu: "4", nvidia.com/gpu: 1}
          limits:   {memory: 8Gi, cpu: "4", nvidia.com/gpu: 1}
        volumeMounts:
        - {name: repo, mountPath: /opt/repo}
        - {name: data, mountPath: /mnt/data}
      volumes:
      - {name: repo, emptyDir: {}}
      - name: data
        persistentVolumeClaim:
          claimName: subject-drop-archive   # new 40 TiB primary PVC per CLAUDE.md
      restartPolicy: Never
      tolerations:
      - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
