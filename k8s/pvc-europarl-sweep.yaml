apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: europarl-sweep-data
  namespace: lemn-lab
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: rook-cephfs
  resources:
    requests:
      # Europarl source: ~600MB
      # Aligned + packed data (3 scales): ~100MB
      # Test set: ~5MB
      # Model checkpoints: 27 runs × ~3.5GB (2 ckpts + optimizer) = ~95GB
      # Safety margin
      storage: 120Gi
