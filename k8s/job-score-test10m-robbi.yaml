# Recoverability of every subject pronoun in the held-out test set, scored the corpus way
# (analysis/recoverability/eval_stimuli/score_corpus_instances.py). One pod per genre file.
# Instances come from build_test_instances.py (uploaded to S3); raw lines come from the PVC.
# roberta-large inference in fp16 fits an 11 GB card, so the pool includes older GPUs.
apiVersion: batch/v1
kind: Job
metadata:
  name: thomas-score-test10m-robbi-v1
  namespace: lemn-lab
  labels: {owner: thomas, study: subject-drop, stage: score-eval, lang: en}
spec:
  completionMode: Indexed
  completions: 6
  parallelism: 6
  backoffLimit: 12
  ttlSecondsAfterFinished: 604800
  podFailurePolicy:
    rules:
    - action: Ignore
      onExitCodes: {containerName: scorer, operator: In, values: [2]}
  template:
    metadata:
      labels: {owner: thomas, study: subject-drop, stage: score-eval, lang: en}
    spec:
      restartPolicy: Never
      priorityClassName: armada-default
      imagePullSecrets:
      - name: gitlab-registry-cred-thomas
      tolerations:
      - {key: nvidia.com/gpu, operator: Exists, effect: PreferNoSchedule}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values: [NVIDIA-GeForce-RTX-3090, NVIDIA-A10, NVIDIA-L4, NVIDIA-GeForce-RTX-4090,
                         NVIDIA-GeForce-RTX-2080-Ti, NVIDIA-GeForce-GTX-1080-Ti, NVIDIA-TITAN-Xp,
                         Tesla-V100-SXM2-16GB, Tesla-V100-SXM2-32GB, Tesla-V100-PCIE-16GB,
                         NVIDIA-TITAN-RTX, Quadro-RTX-6000, NVIDIA-RTX-A5000]
              - key: kubernetes.io/hostname
                operator: NotIn
                values:
                - uicnrp-fiona2.evl.uic.edu
                - gpu-14.nrp.mghpcc.org
                - gpu-17.nrp.mghpcc.org
                - gpu-18.nrp.mghpcc.org
                - hcc-chase-shor-c4715.unl.edu
                - hcc-nrp-shor-c6017.unl.edu
                - nautilus-ext-gpu01.fullerton.edu
                - nautilus-it-gpu01.fullerton.edu
                - nautilus-it-gpu03.fullerton.edu
                - rci-tide-gpu-03.sdsu.edu
                - ry-gpu-10.sdsc.optiputer.net
                - fiona-1.famu.edu
                - suncave-3
                - ry-gpu-04.sdsc.optiputer.net
                - ren-gp-argo-01.madren.org
                - hcc-chase-shor-c4705.unl.edu
                - cph-dgx-node7.humboldt.edu
                - nautilus-it-gpu06.fullerton.edu
                - hcc-nrp-shor-c5805.unl.edu
                - ry-gpu-01.sdsc.optiputer.net
                - k8s-chase-ci-07.calit2.optiputer.net
                - nrp-fiona-001.sdmz.amnh.org
      initContainers:
      - name: clone-repo
        image: alpine/git
        args: [clone, --single-branch, --depth=1, --branch=eval/bert-v2,
               "https://github.com/tgmorton/multi-model-foundry-subject-rearing.git", /opt/repo]
        resources:
          requests: {memory: 1Gi, cpu: "200m"}
          limits: {memory: 1Gi, cpu: "200m"}
        volumeMounts: [{name: repo, mountPath: /opt/repo}]
      containers:
      - name: scorer
        image: gitlab-registry.nrp-nautilus.io/thmorton/multi-model-foundry-subject-rearing:latest
        imagePullPolicy: Always
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -euo pipefail
          STEMS=(childes open_subtitles gutenberg bnc_spoken simple_wiki switchboard)
          STEM=${STEMS[$JOB_COMPLETION_INDEX]}
          echo "=== test_10M robbi scoring: $STEM on ${NODE_NAME:-?} ==="
          python3 -c "
          import sys, torch
          try:
              torch.cuda.synchronize(); torch.zeros(1024, device='cuda').sum().item()
              print('  GPU healthy:', torch.cuda.get_device_name(0))
          except Exception as e:
              print(f'FATAL: GPU not healthy: {e}', file=sys.stderr); sys.exit(2)
          "
          cd /opt/repo
          export HF_HOME=/tmp/hf
          P=recoverability/eval_stimuli/test_10M
          python - <<PY
          import boto3
          boto3.client("s3").download_file("thomas-subject-drop-artifacts", "$P/instances__$STEM.parquet", "/tmp/instances.parquet")
          PY
          python analysis/recoverability/eval_stimuli/score_corpus_instances.py \
            --lines-file /mnt/data/raw/en/test_10M/$STEM.test \
            --instances /tmp/instances.parquet --out /tmp/out/robbi__$STEM.parquet --amp
          python - <<PY
          import boto3, pathlib
          s3 = boto3.client("s3")
          for f in sorted(pathlib.Path("/tmp/out").iterdir()):
              s3.upload_file(str(f), "thomas-subject-drop-artifacts", f"$P/{f.name}")
              print("uploaded", f.name, f.stat().st_size)
          PY
          echo "TEST SCORE DONE $STEM"
        env:
        - {name: PYTHONPATH, value: "/opt/repo"}
        - name: NODE_NAME
          valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
        - name: AWS_ACCESS_KEY_ID
          valueFrom: {secretKeyRef: {name: s3-secret-thomas, key: AWS_ACCESS_KEY_ID}}
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom: {secretKeyRef: {name: s3-secret-thomas, key: AWS_SECRET_ACCESS_KEY}}
        - {name: AWS_ENDPOINT_URL, value: "http://rook-ceph-rgw-nautiluss3.rook"}
        - {name: AWS_DEFAULT_REGION, value: "us-west-1"}
        resources:
          requests: {cpu: "2", memory: 8Gi, nvidia.com/gpu: 1}
          limits: {cpu: "2", memory: 8Gi, nvidia.com/gpu: 1}
        volumeMounts:
        - {name: repo, mountPath: /opt/repo}
        - {name: data, mountPath: /mnt/data, readOnly: true}
      volumes:
      - {name: repo, emptyDir: {}}
      - name: data
        persistentVolumeClaim: {claimName: subject-drop-archive, readOnly: true}
