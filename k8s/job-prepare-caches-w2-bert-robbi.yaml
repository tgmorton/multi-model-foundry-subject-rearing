# bert_wordpiece caches for the 90 robbi/robbianti wave2 cells (2026-10-16; preflight: the 50
# rand/all100 cells already have them from the w3 job). Same pod as job-prepare-caches-w3-bert.yaml.
# Memory is spiky: ~1 GB at cell start, 4-7 GB mid, and a final peak that OOM-killed 7Gi here
# (16Gi OOM-killed some wordpiece cells historically). It cannot sit in NRP's RAM band, so it
# runs as a bounded exception: 2 pods at 32Gi (2 of the 4 allowed out-of-band pods). ~15 min/cell.
apiVersion: batch/v1
kind: Job
metadata:
  name: thomas-prepare-caches-w2-bert-robbi
  labels:
    owner: thomas
    study: subject-drop
    stage: prepare-caches
    lang: en
spec:
  backoffLimit: 30
  completionMode: Indexed
  completions: 90
  parallelism: 2
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        owner: thomas
        study: subject-drop
        stage: prepare-caches
        lang: en
    spec:
      priorityClassName: armada-default
      imagePullSecrets:
      - name: gitlab-registry-cred-thomas
      restartPolicy: Never
      initContainers:
      - name: clone-repo
        image: alpine/git
        args:
        - clone
        - --single-branch
        - --depth=1
        - --branch=main
        - https://github.com/tgmorton/multi-model-foundry-subject-rearing.git
        - /opt/repo
        resources:
          requests:
            memory: 1Gi
            cpu: 200m
          limits:
            memory: 1Gi
            cpu: 200m
        volumeMounts:
        - name: repo
          mountPath: /opt/repo
      containers:
      - name: prepare
        image: gitlab-registry.nrp-nautilus.io/thmorton/multi-model-foundry-subject-rearing:latest
        imagePullPolicy: Always
        command:
        - /bin/bash
        - -c
        args:
        - 'set -euo pipefail

          echo "=== PREP-V5 idx=$JOB_COMPLETION_INDEX ==="

          cd /opt/repo

          rm -rf /opt/repo/data/raw /opt/repo/data/manipulations /opt/repo/data/tokenized /opt/repo/data/chunked /opt/repo/tokenizers

          mkdir -p /mnt/data/tokenized /mnt/data/chunked

          ln -sfn /mnt/data/raw           /opt/repo/data/raw

          ln -sfn /mnt/data/manipulations /opt/repo/data/manipulations

          ln -sfn /mnt/data/tokenized     /opt/repo/data/tokenized

          ln -sfn /mnt/data/chunked       /opt/repo/data/chunked

          ln -sfn /mnt/data/tokenizers    /opt/repo/tokenizers

          export BASE_CONFIG=bert_large_en.yaml TOKENIZER_DIR=tokenizers/en_bert_wordpiece/ TOKENIZER_TYPE=wordpiece

          export CELLS_FILE=/opt/repo/k8s/wave2/cells_w2_bert_robbi90.txt

          python3 scripts/prepare_cache_v5.py

          '
        env:
        - name: PYTHONPATH
          value: /opt/repo
        resources:
          requests:
            memory: 32Gi
            cpu: '2'
          limits:
            memory: 32Gi
            cpu: '2'
        volumeMounts:
        - name: repo
          mountPath: /opt/repo
        - name: data
          mountPath: /mnt/data
      volumes:
      - name: repo
        emptyDir: {}
      - name: data
        persistentVolumeClaim:
          claimName: subject-drop-archive
