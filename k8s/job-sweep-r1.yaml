apiVersion: batch/v1
kind: Job
metadata:
  name: pronoun-sweep-r1-v2
  namespace: lemn-lab
spec:
  # 15 agents, each picks up 1 run from the 15-run grid
  completions: 15
  parallelism: 15
  backoffLimit: 1
  template:
    spec:
      initContainers:
      - name: clone-repo
        image: alpine/git
        args:
        - clone
        - --single-branch
        - --depth=1
        - https://github.com/tgmorton/multi-model-foundry-subject-rearing.git
        - /opt/repo
        resources:
          requests:
            memory: 1Gi
            cpu: "200m"
          limits:
            memory: 1Gi
            cpu: "200m"
        volumeMounts:
        - name: repo
          mountPath: /opt/repo
      containers:
      - name: sweep-agent
        image: python:3.10-slim
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -e

          # Install PyTorch with CUDA 12.1 (3090-compatible)
          pip install --no-cache-dir \
            torch --index-url https://download.pytorch.org/whl/cu121

          # Install project deps
          cd /opt/repo
          pip install --no-cache-dir \
            -r requirements.txt \
            accelerate>=0.26.0 \
            python-dotenv \
            scikit-learn>=1.3.0 \
            seqeval>=1.2.2 \
            sentencepiece

          # Each agent picks up 1 run from the sweep
          wandb agent --count 1 $WANDB_SWEEP_ID
        env:
        - name: WANDB_API_KEY
          valueFrom:
            secretKeyRef:
              name: wandb-secret-thomas
              key: WANDB_API_KEY
        - name: WANDB_ENTITY
          value: "thmorton-uc-san-diego"
        - name: WANDB_PROJECT
          value: "pronoun-recovery"
        - name: WANDB_SWEEP_ID
          value: "PLACEHOLDER"
        - name: PYTHONPATH
          value: "/opt/repo"
        - name: SWEEP_CONFIG
          value: "configs/pronoun_recovery_it_train.yaml"
        - name: SWEEP_DATA_PATH
          value: "/mnt/data/pronoun_recovery/annotations/it/r1_final_clean.jsonl"
        - name: SWEEP_OUTPUT_DIR
          value: "/mnt/data/pronoun_recovery/models/it_sweep_r1_v2"
        - name: PYTORCH_CUDA_ALLOC_CONF
          value: "expandable_segments:True"
        resources:
          requests:
            memory: 16Gi
            cpu: "4"
            nvidia.com/gpu: 1
          limits:
            memory: 16Gi
            cpu: "4"
            nvidia.com/gpu: 1
        volumeMounts:
        - name: repo
          mountPath: /opt/repo
        - name: data
          mountPath: /mnt/data
      volumes:
      - name: repo
        emptyDir: {}
      - name: data
        persistentVolumeClaim:
          claimName: pronoun-sweep-data
      restartPolicy: Never
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
