---
# One-shot: train the shared English SentencePiece-unigram tokenizer used
# by gpt2_small/medium/large + lstm + mamba_370m × en. Corpus = baseline
# train_90M + all 4 English ablations (enrich_verbal_morphology,
# impoverish_case, lemmatize_verbs, remove_expletive_sentences) so that
# baseline and ablated models share vocabulary for within-arch comparison.
apiVersion: batch/v1
kind: Job
metadata:
  name: thomas-train-tokenizer-es-shared
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      imagePullSecrets:
      - name: gitlab-registry-cred-thomas
      initContainers:
      - name: clone-repo
        image: alpine/git
        args:
        - clone
        - --single-branch
        - --depth=1
        - --branch=main
        - https://github.com/tgmorton/multi-model-foundry-subject-rearing.git
        - /opt/repo
        resources:
          requests: {memory: 1Gi, cpu: "200m"}
          limits:   {memory: 1Gi, cpu: "200m"}
        volumeMounts:
        - {name: repo, mountPath: /opt/repo}
      containers:
      - name: train-tokenizer
        image: gitlab-registry.nrp-nautilus.io/thmorton/multi-model-foundry-subject-rearing:latest
        imagePullPolicy: Always
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -euo pipefail
          echo "=========================================="
          echo "  SHARED UNIGRAM TOKENIZER TRAINING — ES"
          echo "=========================================="

          cd /opt/repo
          cat .git/HEAD 2>/dev/null || true

          # Wipe any committed data/ and tokenizers/ so the symlinks to
          # /mnt/data win.
          rm -rf /opt/repo/data/raw /opt/repo/data/tokenizer_staging /opt/repo/data/manipulations /opt/repo/tokenizers
          mkdir -p /opt/repo/data /opt/repo/tokenizers /mnt/data/tokenizers
          ln -sfn /mnt/data/raw           /opt/repo/data/raw
          ln -sfn /mnt/data/manipulations /opt/repo/data/manipulations
          ln -sfn /mnt/data/tokenizers    /opt/repo/tokenizers

          # Build the combined training input: symlink every .train file
          # from baseline + each ablation into a single staging dir,
          # prefixing the filename with the source to avoid name clashes.
          STAGE=/opt/repo/data/tokenizer_staging/es
          mkdir -p "$STAGE"
          # Baseline
          for f in /mnt/data/raw/es/train_90M/*.train; do
            ln -sfn "$f" "$STAGE/baseline__$(basename "$f")"
          done
          # Ablations
          for d in /mnt/data/manipulations/es/*/; do
            slug=$(basename "$d")
            for f in "$d"*.train; do
              [ -f "$f" ] || continue
              ln -sfn "$f" "$STAGE/${slug}__$(basename "$f")"
            done
          done
          echo "Staging dir has $(ls "$STAGE" | wc -l) .train symlinks:"
          ls "$STAGE" | head -10

          # Train the tokenizer. Idempotent: skips if already present.
          python -m model_foundry.cli validate-config configs/tokenizer_training/es_shared_unigram.yaml
          python -m model_foundry.cli train-tokenizer   configs/tokenizer_training/es_shared_unigram.yaml

          echo ""
          echo "=========================================="
          echo "  TOKENIZER ARTIFACT"
          echo "=========================================="
          ls -la /mnt/data/tokenizers/es_shared_unigram/
          du -sh  /mnt/data/tokenizers/es_shared_unigram/
        env:
        - {name: PYTHONPATH, value: "/opt/repo"}
        resources:
          requests: {memory: 16Gi, cpu: "2"}
          limits:   {memory: 16Gi, cpu: "2"}
        volumeMounts:
        - {name: repo, mountPath: /opt/repo}
        - {name: data, mountPath: /mnt/data}
      volumes:
      - {name: repo, emptyDir: {}}
      - name: data
        persistentVolumeClaim:
          claimName: subject-drop-archive
      restartPolicy: Never
