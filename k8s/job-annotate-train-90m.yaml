apiVersion: batch/v1
kind: Job
metadata:
  name: corpus-annotate-train-90m
spec:
  completionMode: Indexed
  completions: 6
  parallelism: 6
  backoffLimit: 3
  template:
    spec:
      nodeSelector:
        nvidia.com/gpu.product: NVIDIA-GeForce-RTX-3090
      initContainers:
      - name: clone-repo
        image: alpine/git
        args:
        - clone
        - --single-branch
        - --depth=1
        - https://github.com/tgmorton/multi-model-foundry-subject-rearing.git
        - /opt/repo
        resources:
          requests:
            memory: 1Gi
            cpu: "200m"
          limits:
            memory: 1Gi
            cpu: "200m"
        volumeMounts:
        - name: repo
          mountPath: /opt/repo
      containers:
      - name: annotator
        image: nvidia/cuda:11.8.0-runtime-ubuntu22.04
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -e
          FILES=(childes gutenberg open_subtitles simple_wiki bnc_spoken switchboard)
          FILE_STEM="${FILES[$JOB_COMPLETION_INDEX]}"
          echo "Pod index=$JOB_COMPLETION_INDEX → file=$FILE_STEM"

          apt-get update && apt-get install -y python3 python3-pip &&
          pip install --no-cache-dir spacy spacy-transformers pydantic tqdm pyyaml pyarrow polars &&
          python3 -m spacy download en_core_web_trf

          cd /opt/repo

          # CHILDES needs metadata generation
          if [ "$FILE_STEM" = "childes" ]; then
            python3 scripts/generate_childes_metadata.py \
              /mnt/data/raw/train_90M/childes.train \
              -o /mnt/data/raw/train_90M/childes_metadata.json
          fi

          python3 -m analysis.corpus_descriptives.run \
            --config configs/analysis/corpus/corpus_analysis_train90m.yaml \
            --annotate --file "$FILE_STEM"
        resources:
          requests:
            memory: 16Gi
            cpu: "7"
            nvidia.com/gpu: 1
          limits:
            memory: 16Gi
            cpu: "7"
            nvidia.com/gpu: 1
        volumeMounts:
        - name: repo
          mountPath: /opt/repo
        - name: input-data
          mountPath: /mnt/data
        - name: annotate-data
          mountPath: /mnt/annotate
      volumes:
      - name: repo
        emptyDir: {}
      - name: input-data
        persistentVolumeClaim:
          claimName: corpus-analysis-data
      - name: annotate-data
        persistentVolumeClaim:
          claimName: corpus-annotate-90m-data
      restartPolicy: Never
