# Recoverability of the pronouns in our own eval stimuli, on the corpus decile scale
# (analysis/recoverability/eval_stimuli/score_eval_stimuli.py). Baseline stimuli, rater
# `robbi` (roberta-large +-250). CPU only: about 2,300 short forwards per stimulus root.
apiVersion: batch/v1
kind: Job
metadata:
  name: thomas-score-eval-robbi-v1
  namespace: null-subjects
  labels: {owner: thomas, study: subject-drop, stage: score-eval, lang: en}
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels: {owner: thomas, study: subject-drop, stage: score-eval, lang: en}
    spec:
      restartPolicy: Never
      priorityClassName: armada-default
      imagePullSecrets:
      - name: gitlab-registry-cred-thomas
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - {key: feature.node.kubernetes.io/pci-10de.present, operator: NotIn, values: ["true"]}
              - key: kubernetes.io/hostname
                operator: NotIn
                values:
                - uicnrp-fiona2.evl.uic.edu
                - gpu-14.nrp.mghpcc.org
                - gpu-17.nrp.mghpcc.org
                - gpu-18.nrp.mghpcc.org
                - hcc-chase-shor-c4715.unl.edu
                - hcc-nrp-shor-c6017.unl.edu
                - nautilus-ext-gpu01.fullerton.edu
                - nautilus-it-gpu01.fullerton.edu
                - nautilus-it-gpu03.fullerton.edu
                - rci-tide-gpu-03.sdsu.edu
                - ry-gpu-10.sdsc.optiputer.net
                - fiona-1.famu.edu
                - suncave-3
                - ry-gpu-04.sdsc.optiputer.net
                - ren-gp-argo-01.madren.org
                - hcc-chase-shor-c4705.unl.edu
                - cph-dgx-node7.humboldt.edu
                - nautilus-it-gpu06.fullerton.edu
                - hcc-nrp-shor-c5805.unl.edu
                - ry-gpu-01.sdsc.optiputer.net
                - k8s-chase-ci-07.calit2.optiputer.net
                - nrp-fiona-001.sdmz.amnh.org
      initContainers:
      - name: clone-repo
        image: alpine/git
        args: [clone, --single-branch, --depth=1, --branch=eval/bert-v2,
               "https://github.com/tgmorton/multi-model-foundry-subject-rearing.git", /opt/repo]
        resources:
          requests: {memory: 1Gi, cpu: "200m"}
          limits: {memory: 1Gi, cpu: "200m"}
        volumeMounts: [{name: repo, mountPath: /opt/repo}]
      containers:
      - name: scorer
        image: gitlab-registry.nrp-nautilus.io/thmorton/multi-model-foundry-subject-rearing:latest
        imagePullPolicy: Always
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -euo pipefail
          cd /opt/repo
          export HF_HOME=/tmp/hf OMP_NUM_THREADS=4
          for ROOT in null-subj-v2-matched-v2 null-subj-v2-matched-nopron-v2; do
            python analysis/recoverability/eval_stimuli/score_eval_stimuli.py \
              --stimuli evaluation/stimuli/$ROOT/baseline/en \
              --out /tmp/out/robbi__${ROOT}__baseline.parquet --device cpu
          done
          python - <<'PY'
          import boto3, pathlib
          s3 = boto3.client("s3")
          for f in sorted(pathlib.Path("/tmp/out").iterdir()):
              key = f"recoverability/eval_stimuli/{f.name}"
              s3.upload_file(str(f), "thomas-subject-drop-artifacts", key)
              print("uploaded", key, f.stat().st_size)
          PY
          echo "EVAL SCORE DONE"
        env:
        - {name: PYTHONPATH, value: "/opt/repo"}
        - name: AWS_ACCESS_KEY_ID
          valueFrom: {secretKeyRef: {name: s3-secret-thomas, key: AWS_ACCESS_KEY_ID}}
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom: {secretKeyRef: {name: s3-secret-thomas, key: AWS_SECRET_ACCESS_KEY}}
        - {name: AWS_ENDPOINT_URL, value: "http://rook-ceph-rgw-nautiluss3.rook"}
        - {name: AWS_DEFAULT_REGION, value: "us-west-1"}
        resources:
          requests: {cpu: "4", memory: 6Gi}
          limits: {cpu: "4", memory: 6Gi}
        volumeMounts:
        - {name: repo, mountPath: /opt/repo}
      volumes:
      - {name: repo, emptyDir: {}}
