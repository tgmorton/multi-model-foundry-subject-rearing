# Step 5: Model training (English)
synthetic_data_path: data/pronoun_recovery/synthetic/en
annotation_data_path: data/pronoun_recovery/annotations/en/llm_validated
output_path: data/pronoun_recovery/models/en
language: en

# Model
model_name: microsoft/deberta-v3-base
num_labels: 9

# Phase A: pretrain on synthetic data
phase_a_lr: 3.0e-5
phase_a_batch_size: 32
phase_a_epochs: 3
phase_a_max_samples: 500000
phase_a_patience: 2

# Phase B: finetune on annotations
phase_b_lr: 1.0e-5
phase_b_batch_size: 16
phase_b_epochs: 10
phase_b_patience: 3

# Common
fp16: true
warmup_ratio: 0.1
max_seq_length: 256
seed: 42

# Logging
wandb_project: pronoun-recovery
wandb_run_name: deberta-v3-base-en

# Gates
min_detection_f1: 0.85
min_label_accuracy: 0.80
