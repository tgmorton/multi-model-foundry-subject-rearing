# Step 5: Model training (Italian)
# Train on LLM-annotated checkpoint data
training_source: llm_annotated
annotation_data_path: data/pronoun_recovery/annotations/it/checkpoint.jsonl
output_path: data/pronoun_recovery/models/it
language: it

# Model
model_name: microsoft/mdeberta-v3-base
num_labels: 9

# Training hyperparams
phase_b_lr: 1.0e-5
phase_b_batch_size: 16
phase_b_epochs: 10
phase_b_patience: 3

# Common
fp16: false
warmup_ratio: 0.1
max_seq_length: 256
seed: 42

# Logging
wandb_project: null
wandb_run_name: null

# Gates
min_detection_f1: 0.85
min_label_accuracy: 0.80
