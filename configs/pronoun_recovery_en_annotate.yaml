# Steps 2-3: Manual + LLM annotation (English)
corpus_path: data/chunked/train_90M
output_path: data/pronoun_recovery/annotations/en
language: en

# spaCy
spacy_model: en_core_web_trf
spacy_batch_size: 50

# Sampling
sample_size: 1000

# Genre mapping
genre_map:
  childes: CHILDES
  bnc_spoken: BNC
  gutenberg: Gutenberg
  open_subtitles: OpenSubtitles
  simple_wiki: SimpleWikipedia
  switchboard: Switchboard

# LLM settings (DeepSeek via OpenAI-compatible API)
api_base_url: https://api.deepseek.com/v1
api_key_env: DEEPSEEK_API_KEY
model_name: deepseek-chat
temperature: 0.1
max_tokens: 1024

# Rate limiting
requests_per_minute: 60
tokens_per_minute: 100000

# Batch processing
checkpoint_interval: 50
max_retries: 3
