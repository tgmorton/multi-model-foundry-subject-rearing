# Sample validation set from held-out dev split (Italian)
corpus_path: data/italian/pull_10M
output_path: data/pronoun_recovery/annotations/it/validation
language: it

# Sampling
sample_size: 100

# Genre mapping
genre_map:
  childes: CHILDES
  clta: CltA
  corpus_isacco: ISACCO
  europarl: Europarl
  leipzig_web: Leipzig Web
  paccss: PaCCSS
  qcri: QCRI
  spgc: SPGC

# LLM settings (not used for sampling, but required by config schema)
api_base_url: https://api.deepseek.com/v1
api_key_env: DEEPSEEK_API_KEY
model_name: deepseek-chat
temperature: 0.1
max_tokens: 1024
requests_per_minute: 60
tokens_per_minute: 100000
checkpoint_interval: 50
max_retries: 3
