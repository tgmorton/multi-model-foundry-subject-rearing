# Full rater, phase B of 2 (docs/BERT_RECIPE_V2.md, "Full rater plan").
#
# Same weights, optimizer, schedule and step as phase A, on 512-token data, for
# steps 19,550 to 23,000. Micro-batch x accumulation x 512 must stay 524K tokens;
# 16 x 64 is the estimate until it is measured on an L40.

experiment_name: "rater_full_bert_large_preln_en_impoverish_case_en_phase_b"

data:
  source_corpus: "/mnt/data/rater_corpus/full_v1/impoverish_case_en/"
  training_corpus: "/mnt/data/rater_corpus/full_v1/impoverish_case_en/"
  test_corpus: "/mnt/data/rater_corpus/full_v1/impoverish_case_en/"
  batch_size: 16
  max_sequence_length: 512
  packing: "cls_sep"

dataset_manipulation: []

tokenizer:
  # OPEN DECISION (docs/BERT_RECIPE_V2.md): project WordPiece vs byte-level BPE.
  output_dir: "tokenizers/en_bert_wordpiece/"
  vocab_size: 50004
  tokenizer_type: "wordpiece"
  special_tokens:
    cls_token: "[CLS]"
    sep_token: "[SEP]"
    mask_token: "[MASK]"
    unk_token: "[UNK]"
    pad_token: "[PAD]"

model:
  architecture: "bert"
  transformer:
    layers: 24
    embedding_size: 1024
    hidden_size: 1024
    intermediate_hidden_size: 4096
    attention_heads: 16
    activation_function: "gelu"
    dropout: 0.1
    attention_dropout: 0.1
  bert:
    norm_position: "pre"
    pad_token_id: 4
    max_position_embeddings: 512

training:
  output_dir: "models/raters_v2/impoverish_case_en/"
  learning_rate: 0.002
  adam_beta1: 0.9
  adam_beta2: 0.98
  adam_epsilon: 1.0e-6
  weight_decay: 0.01
  no_decay_norm_bias: true
  warmup_ratio: 0.06           # of the 23K-step horizon: 1,380 steps
  train_steps: 23000
  scheduler_train_steps: 23000
  warmup_steps: null
  epochs: 1

  objective: "masked_lm"
  mlm_probability: 0.15
  use_amp: true
  gradient_accumulation_steps: 64
  max_grad_norm: 1.0
  use_tf32: true
  use_gradient_checkpointing: false
  auto_generate_checkpoints: false
  checkpoint_schedule: [20000, 20500, 21000, 21500, 22000, 22500, 23000]
  resume_state_steps: [23000]
  rolling_resume_every_steps: 500
  resume_from_checkpoint: true
  resume_new_data_phase: true
  compile_mode: null

logging:
  use_wandb: true
  wandb_project: "subject-drop-bert-v2"
  level: "INFO"
  dir: "logs"

random_seed: 42
