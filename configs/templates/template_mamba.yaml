# =========================================================================================
# MAMBA TEMPLATE — Selective State Space Model
#
# Mamba (Gu & Dao 2023) is a state space model with selective mechanisms and
# linear-time complexity, making it efficient for long sequence modeling.
#
# Uses the official mamba-ssm package on Linux + CUDA; falls back to a pure
# PyTorch implementation on CPU / macOS.
# =========================================================================================

experiment_name: "exp_mamba_example"

data:
  source_corpus: "data/raw/train_90M/"
  training_corpus: "data/raw/train_90M/"
  test_corpus: "data/raw/test_10M/"
  batch_size: 32
  max_sequence_length: 1024  # Mamba handles long sequences efficiently

dataset_manipulation: []

tokenizer:
  output_dir: "tokenizers/exp_mamba_example/"
  vocab_size: 50004

model:
  architecture: "mamba"
  mamba:
    d_model: 768       # Model dimension (embedding size)
    n_layers: 24        # Number of Mamba layers
    d_state: 16         # SSM state expansion factor
    d_conv: 4           # Local convolution width
    expand: 2           # Block expansion factor (inner dim = expand * d_model)
    dropout: 0.1

training:
  output_dir: "models/exp_mamba_example/"
  objective: "causal_lm"
  learning_rate: 0.0003
  adam_beta1: 0.9
  adam_beta2: 0.95      # Mamba authors recommend lower beta2
  adam_epsilon: 1.0e-6
  warmup_steps: null
  warmup_ratio: 0.1
  train_steps: null
  epochs: 20
  use_amp: true
  gradient_accumulation_steps: 8
  max_grad_norm: 1.0
  use_tf32: true
  use_gradient_checkpointing: true
  auto_generate_checkpoints: true
  first_epoch_checkpoints: 20
  subsequent_epochs_spacing: "log"
  log_base: 2
  min_checkpoint_interval: 100
  min_checkpoints_per_epoch: 5

logging:
  use_wandb: true
  wandb_project: "just-drop-the-subject"

random_seed: 9
