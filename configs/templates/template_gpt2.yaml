# =========================================================================================
# GPT-2 TEMPLATE — Causal (autoregressive) language model
#
# Uses HuggingFace's GPT-2 implementation. Supports Flash Attention 2 when available.
# Training objective: causal_lm (predict next token).
# =========================================================================================

experiment_name: "exp_gpt2_example"

data:
  source_corpus: "data/raw/train_90M/"
  training_corpus: "data/raw/train_90M/"
  test_corpus: "data/raw/test_10M/"
  batch_size: 32
  max_sequence_length: 1000

dataset_manipulation: []

tokenizer:
  output_dir: "tokenizers/exp_gpt2_example/"
  vocab_size: 50004

model:
  architecture: "gpt2"
  transformer:
    layers: 12              # Number of transformer blocks
    embedding_size: 768      # Token embedding dimension
    hidden_size: 768         # Hidden layer dimension (usually == embedding_size)
    intermediate_hidden_size: 3072  # FFN intermediate size (usually 4x hidden_size)
    attention_heads: 12      # Number of attention heads (hidden_size must be divisible)
    activation_function: "gelu"
    dropout: 0.1
    attention_dropout: 0.1

training:
  output_dir: "models/exp_gpt2_example/"
  objective: "causal_lm"
  learning_rate: 0.0004
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 1.0e-6
  warmup_steps: null
  warmup_ratio: 0.1
  train_steps: null
  epochs: 20
  use_amp: true
  gradient_accumulation_steps: 8
  max_grad_norm: 1.0
  use_tf32: true
  use_gradient_checkpointing: true
  auto_generate_checkpoints: true
  first_epoch_checkpoints: 20
  subsequent_epochs_spacing: "log"
  log_base: 2
  min_checkpoint_interval: 100
  min_checkpoints_per_epoch: 5

logging:
  use_wandb: true
  wandb_project: "just-drop-the-subject"

random_seed: 9
