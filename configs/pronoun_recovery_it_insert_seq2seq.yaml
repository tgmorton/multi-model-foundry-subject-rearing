# Seq2seq pronoun insertion (Italian)
input_path: data/italian/train_90M
output_path: data/pronoun_recovery/inserted_seq2seq/it
model_path: data/pronoun_recovery/models_seq2seq/it/final
language: it

# Generation
max_input_length: 256
max_target_length: 256
num_beams: 4
length_penalty: 1.0
batch_size: 32

# Processing
chunk_size: 1000

# Genre mapping
genre_map:
  childes: CHILDES
  clta: CltA
  corpus_isacco: ISACCO
  europarl: Europarl
  leipzig_web: Leipzig Web
  paccss: PaCCSS
  qcri: QCRI
  spgc: SPGC
