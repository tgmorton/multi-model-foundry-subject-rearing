# Step 1: Synthetic pair generation (English)
input_path: data/raw/train_90M
output_path: data/pronoun_recovery/synthetic/en
language: en

# spaCy
spacy_model: en_core_web_trf
spacy_batch_size: 50

# Filtering
min_tokens: 3
max_tokens: 128
require_finite_verb: true
max_pairs: 500000

# Split
dev_fraction: 0.1

# Processing
chunk_size: 1000

# Genre mapping
genre_map:
  childes: CHILDES
  bnc_spoken: BNC
  gutenberg: Gutenberg
  open_subtitles: OpenSubtitles
  simple_wiki: SimpleWikipedia
  switchboard: Switchboard
