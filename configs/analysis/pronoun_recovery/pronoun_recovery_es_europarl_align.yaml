# Europarl parallel alignment: Spanish pilot run (50K sentence pairs)
#
# Note on config field names: `it_spacy_model` and `europarl_it_path` are
# Italian-origin names that persist for backwards compatibility; they
# accept any target-language values (here, Spanish).

europarl_en_path: /mnt/data/raw/es/parallel/europarl.en
europarl_it_path: /mnt/data/raw/es/parallel/europarl.es
output_path: /mnt/data/pronoun_recovery/europarl_aligned/es
language: es

# Pilot: first 50K lines
start_line: 0
end_line: 50000

# spaCy models
en_spacy_model: en_core_web_trf
it_spacy_model: es_core_news_lg
spacy_batch_size: 50

# awesome-align
align_model: aneuraz/awesome-align-with-co
align_batch_size: 32

# Pronoun extraction — skip all English "it" (expletives, impersonals)
skip_all_it: true

# Quality filters
min_tokens: 3
max_tokens: 128
max_length_ratio: 3.0

# Processing
chunk_size: 1000
checkpoint_interval: 5000

# Validation
spot_check_n: 100
