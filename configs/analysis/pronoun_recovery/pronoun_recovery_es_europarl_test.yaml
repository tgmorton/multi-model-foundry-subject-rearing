# Europarl parallel alignment: Spanish held-out test set (last ~10K lines)
# Separated from training and pilot ranges.
#
# Total Spanish Europarl pairs: 2,009,073
# Test range: last ~10K lines (1999000-2009073)

europarl_en_path: /mnt/data/raw/es/parallel/europarl.en
europarl_it_path: /mnt/data/raw/es/parallel/europarl.es
output_path: /mnt/data/pronoun_recovery/europarl_aligned/es_test
language: es

# Held-out segment: last 10K lines
start_line: 1999000
end_line: 2009073

# spaCy models
en_spacy_model: en_core_web_trf
it_spacy_model: es_core_news_lg
spacy_batch_size: 50

# awesome-align
align_model: aneuraz/awesome-align-with-co
align_batch_size: 32

# Pronoun extraction
skip_all_it: true

# Quality filters
min_tokens: 3
max_tokens: 128
max_length_ratio: 3.0

# Processing
chunk_size: 1000
checkpoint_interval: 5000

# Passage packing (multi-sentence context for model)
pack_passages: true
max_passage_words: 180

# Validation
spot_check_n: 100
