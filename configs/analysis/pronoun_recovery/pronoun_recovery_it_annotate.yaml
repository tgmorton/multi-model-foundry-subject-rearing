# Steps 2-3: Manual + LLM annotation (Italian)
corpus_path: data/italian/train_90M
output_path: data/pronoun_recovery/annotations/it
language: it

# spaCy
spacy_model: it_core_news_lg
spacy_batch_size: 50

# Sampling
sample_size: 10000

# Genre mapping
genre_map:
  childes: CHILDES
  clta: CltA
  corpus_isacco: ISACCO
  europarl: Europarl
  leipzig_web: Leipzig Web
  paccss: PaCCSS
  qcri: QCRI
  spgc: SPGC

# LLM settings (DeepSeek via OpenAI-compatible API)
api_base_url: https://api.deepseek.com/v1
api_key_env: DEEPSEEK_API_KEY
model_name: deepseek-chat
temperature: 0.1
max_tokens: 1024

# Rate limiting
requests_per_minute: 60
tokens_per_minute: 100000

# Batch processing
checkpoint_interval: 50
max_retries: 3
max_concurrent: 8
