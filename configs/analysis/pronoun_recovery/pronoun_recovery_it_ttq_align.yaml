# TTQ parallel alignment: TED2020 + Tatoeba + QED combined
# 1,455,049 pairs total (373K TED + 502K Tatoeba + 580K QED)
# Naturalistic voice complement to Europarl: more 2nd/3rd person pronouns
europarl_en_path: data/italian/ttq/ttq.en
europarl_it_path: data/italian/ttq/ttq.it
output_path: data/pronoun_recovery/europarl_aligned/it_ttq
language: it

# Process all 1.45M pairs (~90K aligned records at ~6% yield)
start_line: 0
end_line: 0

# spaCy models
en_spacy_model: en_core_web_trf
it_spacy_model: it_core_news_lg
spacy_batch_size: 128

# awesome-align
align_model: aneuraz/awesome-align-with-co
align_batch_size: 128

# Pronoun extraction
skip_all_it: true

# Quality filters
min_tokens: 3
max_tokens: 128
max_length_ratio: 3.0

# Processing
chunk_size: 2000
checkpoint_interval: 10000

# Passage packing
pack_passages: true
max_passage_words: 180

# Validation
spot_check_n: 100
