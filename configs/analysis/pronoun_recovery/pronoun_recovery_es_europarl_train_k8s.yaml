# Europarl parallel alignment: Spanish training data (500K pairs) — K8s version
# Mirror of pronoun_recovery_es_europarl_train.yaml with any K8s-specific
# settings folded in (currently identical path structure).

europarl_en_path: data/spanish/parallel/europarl.en
europarl_it_path: data/spanish/parallel/europarl.es
output_path: data/pronoun_recovery/europarl_aligned/es_train
language: es

# Training segment
start_line: 0
end_line: 500000

# spaCy models — prefer trf on K8s for better parses when available;
# fall back to _lg if es_core_news_trf is not published on the node.
en_spacy_model: en_core_web_trf
it_spacy_model: es_core_news_lg
spacy_batch_size: 50

# awesome-align
align_model: aneuraz/awesome-align-with-co
align_batch_size: 32

# Pronoun extraction
skip_all_it: true

# Quality filters
min_tokens: 3
max_tokens: 128
max_length_ratio: 3.0

# Processing
chunk_size: 1000
checkpoint_interval: 5000

# Passage packing
pack_passages: true
max_passage_words: 180

# Validation
spot_check_n: 100
