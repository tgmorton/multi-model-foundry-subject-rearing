# Sweep baseline for (gpt2_small, en). ~40M params.
# Sizing chosen to be ~3x smaller than gpt2_medium for a clean scaling
# comparison across small/medium/large (H9 — within-GPT scaling).

experiment_name: "sweep_baseline_gpt2_small_en_10m"

data:
  source_corpus: "data/raw/en/train_10M/"
  training_corpus: "data/raw/en/train_10M/"
  test_corpus: "data/raw/en/test_10M/"
  batch_size: 32
  max_sequence_length: 1000

dataset_manipulation: []

tokenizer:
  # Shared SentencePiece vocab (non-BERT archs × EN).
  # Trained on train_90M + all en ablated corpora; see
  # k8s/job-train-tokenizer-en-shared.yaml.
  output_dir: "tokenizers/en_shared_unigram/"
  vocab_size: 50004

model:
  architecture: "gpt2"
  transformer:
    layers: 6
    embedding_size: 512
    hidden_size: 512
    intermediate_hidden_size: 2048
    attention_heads: 8
    activation_function: "gelu"
    dropout: 0.1
    attention_dropout: 0.1

training:
  output_dir: "models/sweeps/placeholder/"
  learning_rate: 0.0003          # overridden
  adam_beta1: 0.9
  adam_beta2: 0.99               # overridden
  adam_epsilon: 1.0e-6
  warmup_ratio: 0.1              # overridden
  train_steps: null
  warmup_steps: null
  epochs: 10                     # 10-epoch sweep proxy (new plan)
  sweep_epochs: 10
  # Full production budget in epochs; used to scale the token-anchor
  # checkpoint schedule so anchors land at the right fraction of training.
  production_epochs: 30

  use_amp: true
  gradient_accumulation_steps: 4              # locked: effective_batch_size=128 / micro_bs=32 (10M sweep matches batch size across archs)
  max_grad_norm: 1.0
  use_tf32: true
  use_gradient_checkpointing: false  # OFF (2026-06-05): paid ~25% recompute for unused memory headroom; phys batch fits without it

  # Auto-generated from the token-anchor schedule at trial start;
  # sweep_agent_lm.py substitutes the concrete list.
  auto_generate_checkpoints: false
  checkpoint_schedule: []
  resume_from_checkpoint: false
  compile_mode: null  # compile DECLINED (2026-06-05 dry-runs): Inductor lowering OOM-kills the lean 4-5Gi pods (in-process or pooled), and the ~8Gi it needs would sink steady-state util below the NRP webhook floor. Revisit only with a dedicated big-RAM tier.

logging:
  use_wandb: true
  wandb_project: "subject-drop-prod-hp-10m"
  level: "INFO"
  dir: "logs"

random_seed: 42
