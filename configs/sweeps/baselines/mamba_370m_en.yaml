# Sweep baseline for (mamba_370m, en). The sweep_agent_lm.py worker
# reads this file, overlays the sampled HPs from wandb.config, and
# trains for the proxy horizon.
#
# Mamba: causal_lm objective, own tokenizer (en_mamba_370m), uses the
# mamba-ssm CUDA kernels baked into the custom GitLab image. Mamba
# authors (Gu & Dao) recommend lower adam_beta2 ≈ 0.95 — sweep range
# {0.95, 0.99, 0.999} covers both extremes.

experiment_name: "sweep_baseline_mamba_370m_en"

data:
  source_corpus: "data/raw/en/train_90M/"
  training_corpus: "data/raw/en/train_90M/"
  test_corpus: "data/raw/en/test_10M/"
  batch_size: 4
  max_sequence_length: 1000

dataset_manipulation: []

tokenizer:
  # Shared SentencePiece tokenizer across non-BERT English archs.
  # See lstm_en.yaml for rationale.
  output_dir: "tokenizers/en_shared_unigram/"
  vocab_size: 50004

model:
  architecture: "mamba"
  mamba:
    d_model: 1024
    n_layers: 48
    d_state: 16
    d_conv: 4
    expand: 2
    dropout: 0.1                   # overridden per trial

training:
  output_dir: "models/sweeps/placeholder/"
  learning_rate: 0.0003            # overridden per trial
  adam_beta1: 0.9
  adam_beta2: 0.95                 # Mamba paper default; swept {0.95, 0.99, 0.999}
  adam_epsilon: 1.0e-6
  warmup_ratio: 0.1                # overridden per trial
  train_steps: null
  warmup_steps: null
  epochs: 3                        # overridden to sweep_epochs
  sweep_epochs: 10
  production_epochs: 30

  objective: "causal_lm"

  use_amp: true
  gradient_accumulation_steps: 16  # overridden via effective_batch_size
  max_grad_norm: 1.0
  use_tf32: true
  use_gradient_checkpointing: true

  auto_generate_checkpoints: false
  checkpoint_schedule: []
  resume_from_checkpoint: false
  compile_mode: null

logging:
  use_wandb: true
  wandb_project: "subject-drop-prod-hp"
  level: "INFO"
  dir: "logs"

random_seed: 42
