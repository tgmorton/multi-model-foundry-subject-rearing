# Sweep baseline for (lstm, en). The sweep_agent_lm.py worker reads
# this file, overlays the sampled HPs from wandb.config, and trains
# for the proxy horizon.
#
# LSTM: causal_lm objective, own tokenizer (en_lstm), no gradient
# checkpointing (not much benefit, sometimes errors).

experiment_name: "sweep_baseline_lstm_en_10m"

data:
  source_corpus: "data/raw/en/train_10M/"
  training_corpus: "data/raw/en/train_10M/"
  test_corpus: "data/raw/en/test_10M/"
  batch_size: 16                 # dropped 32->16: 87% VRAM was too close on 24GB cards
  max_sequence_length: 1000

dataset_manipulation: []

tokenizer:
  # Shared SentencePiece tokenizer across non-BERT English archs
  # (gpt2_medium / lstm / mamba_370m). Same tokenizer bytes + same corpus
  # + same seq_len = same content-addressed cache_key → all three sweeps
  # hit the existing tokenized+chunked cache with zero re-compute.
  output_dir: "tokenizers/en_shared_unigram/"
  vocab_size: 50004

model:
  architecture: "lstm"
  rnn:
    embedding_size: 512
    hidden_size: 512
    num_layers: 2
    bidirectional: false
    dropout: 0.1                   # overridden per trial
    rnn_type: "lstm"

training:
  output_dir: "models/sweeps/placeholder/"
  learning_rate: 0.001             # overridden per trial
  adam_beta1: 0.9
  adam_beta2: 0.999                # overridden per trial
  adam_epsilon: 1.0e-6
  warmup_ratio: 0.1                # overridden per trial
  train_steps: null
  warmup_steps: null
  epochs: 3                        # overridden to sweep_epochs
  sweep_epochs: 10
  production_epochs: 30

  objective: "causal_lm"

  use_amp: true
  gradient_accumulation_steps: 8              # locked: effective_batch_size=128 / micro_bs=16 (10M sweep matches batch size across archs)
  max_grad_norm: 5.0               # LSTMs prefer higher gradient clip
  use_tf32: true
  use_gradient_checkpointing: false

  auto_generate_checkpoints: false
  checkpoint_schedule: []
  resume_from_checkpoint: false
  compile_mode: null  # compile off: cuDNN LSTM already fused / mamba custom kernels graph-break

logging:
  use_wandb: true
  wandb_project: "subject-drop-prod-hp-10m"
  level: "INFO"
  dir: "logs"

random_seed: 42
