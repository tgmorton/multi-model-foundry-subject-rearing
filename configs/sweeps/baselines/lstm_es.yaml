# Sweep baseline for (lstm, es). Mirror of lstm_en with Spanish.

experiment_name: "sweep_baseline_lstm_es"

data:
  source_corpus: "data/raw/es/train_90M/"
  training_corpus: "data/raw/es/train_90M/"
  test_corpus: "data/raw/es/test_10M/"
  batch_size: 16                 # dropped 32->16: 87% VRAM was too close on 24GB cards
  max_sequence_length: 1000

dataset_manipulation: []

tokenizer:
  # Shared SentencePiece tokenizer across non-BERT Spanish archs.
  output_dir: "tokenizers/es_shared_unigram/"
  vocab_size: 50004

model:
  architecture: "lstm"
  rnn:
    embedding_size: 512
    hidden_size: 512
    num_layers: 2
    bidirectional: false
    dropout: 0.1
    rnn_type: "lstm"

training:
  output_dir: "models/sweeps/placeholder/"
  learning_rate: 0.001
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 1.0e-6
  warmup_ratio: 0.1
  train_steps: null
  warmup_steps: null
  epochs: 10
  sweep_epochs: 10
  production_epochs: 30

  objective: "causal_lm"

  use_amp: true
  gradient_accumulation_steps: 4
  max_grad_norm: 5.0
  use_tf32: true
  use_gradient_checkpointing: false

  auto_generate_checkpoints: false
  checkpoint_schedule: []
  resume_from_checkpoint: false
  compile_mode: null  # compile off: cuDNN LSTM already fused / mamba custom kernels graph-break

logging:
  use_wandb: true
  wandb_project: "subject-drop-prod-hp"
  level: "INFO"
  dir: "logs"

random_seed: 42
