# Sweep baseline for (gpt2_medium, en). The sweep_agent_lm.py worker
# reads this file, overlays the sampled HPs from wandb.config, and
# trains for the proxy horizon.
#
# Fields that the sweep OVERRIDES at runtime (don't worry about
# getting them right here — they're stamped by the worker):
#   experiment_name, training.output_dir, training.epochs,
#   training.train_steps, training.checkpoint_schedule,
#   training.auto_generate_checkpoints, training.resume_from_checkpoint
#
# Fields that SWEEP RANGES pick (sampled HPs):
#   training.learning_rate, training.warmup_ratio,
#   training.adam_beta2, training.gradient_accumulation_steps,
#   data.batch_size (derived from effective_batch_size),
#   model.transformer.dropout, model.transformer.attention_dropout
#
# Everything else is the frozen architecture baseline — matches
# configs/experiments/experiment_0_baseline_90M_full.yaml with
# test_corpus populated (required for held-out perplexity).

experiment_name: "sweep_baseline_gpt2_medium_en"

data:
  # Paths are relative to /opt/repo; the training pod symlinks
  # /opt/repo/data/raw -> /mnt/data/raw (on subject-drop-archive PVC).
  # New canonical layout keeps each language under its own subdir.
  source_corpus: "data/raw/en/train_90M/"
  training_corpus: "data/raw/en/train_90M/"
  test_corpus: "data/raw/en/test_10M/"
  batch_size: 16
  max_sequence_length: 1000

dataset_manipulation: []

# One tokenizer per (lang, arch) pair — trained once via
# k8s/job-train-tokenizer.yaml on subject-drop-archive. This assumes
# that job has already populated /mnt/data/tokenizers/en_gpt2_medium/.
tokenizer:
  output_dir: "tokenizers/en_gpt2_medium/"
  vocab_size: 50004

model:
  architecture: "gpt2"
  transformer:
    layers: 12
    embedding_size: 768
    hidden_size: 768
    intermediate_hidden_size: 3072
    attention_heads: 12
    activation_function: "gelu"
    dropout: 0.1                   # overridden per trial (model.transformer.dropout)
    attention_dropout: 0.1         # overridden per trial (model.transformer.attention_dropout)

training:
  output_dir: "models/sweeps/placeholder/"      # overridden per trial
  learning_rate: 0.0001                          # overridden per trial
  adam_beta1: 0.9
  adam_beta2: 0.999                              # overridden per trial
  adam_epsilon: 1.0e-6
  warmup_ratio: 0.1                              # overridden per trial
  train_steps: null
  warmup_steps: null
  epochs: 3                                      # proxy horizon — overridden per trial from sweep_epochs
  sweep_epochs: 3                                # read by _apply_sweep_overrides

  use_amp: true
  gradient_accumulation_steps: 16                # overridden via effective_batch_size
  max_grad_norm: 1.0
  use_tf32: true
  use_gradient_checkpointing: true

  # Trials don't need checkpoints — proxy metrics are the only output
  auto_generate_checkpoints: false
  checkpoint_schedule: []
  resume_from_checkpoint: false
  compile_mode: null

logging:
  use_wandb: true                                # sweep agent owns wandb.init
  wandb_project: "subject-drop-sweeps"
  level: "INFO"
  dir: "logs"

random_seed: 42
