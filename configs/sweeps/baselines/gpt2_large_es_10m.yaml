# Sweep baseline for (gpt2_large, es). Mirror of gpt2_large_en.

experiment_name: "sweep_baseline_gpt2_large_es_10m"

data:
  source_corpus: "data/raw/es/train_10M/"
  training_corpus: "data/raw/es/train_10M/"
  test_corpus: "data/raw/es/test_10M/"
  batch_size: 4
  max_sequence_length: 1000

dataset_manipulation: []

tokenizer:
  output_dir: "tokenizers/es_shared_unigram/"
  vocab_size: 50004

model:
  architecture: "gpt2"
  transformer:
    layers: 24
    embedding_size: 1024
    hidden_size: 1024
    intermediate_hidden_size: 4096
    attention_heads: 16
    activation_function: "gelu"
    dropout: 0.1
    attention_dropout: 0.1

training:
  output_dir: "models/sweeps/placeholder/"
  learning_rate: 0.0001
  adam_beta1: 0.9
  adam_beta2: 0.99
  adam_epsilon: 1.0e-6
  warmup_ratio: 0.1
  train_steps: null
  warmup_steps: null
  epochs: 10
  sweep_epochs: 10
  production_epochs: 30

  use_amp: true
  gradient_accumulation_steps: 32              # locked: effective_batch_size=128 / micro_bs=4 (10M sweep matches batch size across archs)
  max_grad_norm: 1.0
  use_tf32: true
  use_gradient_checkpointing: false  # OFF (2026-06-05): paid ~25% recompute for unused memory headroom; phys batch fits without it

  auto_generate_checkpoints: false
  checkpoint_schedule: []
  resume_from_checkpoint: false
  compile_mode: null  # compile DECLINED (2026-06-05 dry-runs): Inductor lowering OOM-kills the lean 4-5Gi pods (in-process or pooled), and the ~8Gi it needs would sink steady-state util below the NRP webhook floor. Revisit only with a dedicated big-RAM tier.

logging:
  use_wandb: true
  wandb_project: "subject-drop-prod-hp-10m"
  level: "INFO"
  dir: "logs"

random_seed: 42
