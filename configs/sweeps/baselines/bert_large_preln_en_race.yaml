# BERT recipe v2 (D15, docs/BERT_RECIPE_V2.md): study-cell LR race + pilot.
#
# Pre-LN BERT-large (HF MegatronBertForMaskedLM), 128-token chunks with a
# [SEP] after every corpus line and a [CLS] opening every chunk, on the EN
# 90M baseline corpus. Trials run in the step-budget ("rater_sweep") mode
# with kind: race: each trains `sweep_train_steps` (~3 epochs) of the REAL
# 30-epoch LR schedule (scheduler_epochs), so it sees the production warmup
# and peak LR, truncated. Escape gates kill trials still on the MLM plateau.
#
# Specs: configs/sweeps/bert_v2/pilot_en.yaml, configs/sweeps/bert_v2/race_en.yaml.

experiment_name: "race_bert_large_preln_en"

data:
  source_corpus: "data/raw/en/train_90M/"
  training_corpus: "data/raw/en/train_90M/"
  test_corpus: "data/raw/en/test_10M/"
  # 32 x 128 tokens per micro-batch fits a 24 GB card with AdamW state
  # (~6 GB) and eager attention; 32 accumulation steps -> 1024 sequences.
  batch_size: 32
  max_sequence_length: 128
  packing: "cls_sep"

dataset_manipulation: []

tokenizer:
  output_dir: "tokenizers/en_bert_wordpiece/"
  vocab_size: 50004
  tokenizer_type: "wordpiece"
  special_tokens:
    cls_token: "[CLS]"
    sep_token: "[SEP]"
    mask_token: "[MASK]"
    unk_token: "[UNK]"
    pad_token: "[PAD]"

model:
  architecture: "bert"
  transformer:
    layers: 24
    embedding_size: 1024
    hidden_size: 1024
    intermediate_hidden_size: 4096
    attention_heads: 16
    activation_function: "gelu"
    dropout: 0.1
    attention_dropout: 0.1
  bert:
    norm_position: "pre"
    pad_token_id: 4            # the WordPiece vocab's real [PAD] ([CLS] is 0)

training:
  output_dir: "models/race_sweeps/placeholder/"
  learning_rate: 0.0006        # overridden per trial
  adam_beta1: 0.9
  adam_beta2: 0.98
  adam_epsilon: 1.0e-6
  weight_decay: 0.1            # LTG-BERT at 100M words; race may test 0.01
  no_decay_norm_bias: true
  warmup_ratio: 0.06           # of the 30-epoch horizon (scheduler_epochs)
  train_steps: null
  warmup_steps: null
  epochs: 1                    # recomputed so train_steps fits

  objective: "masked_lm"
  mlm_probability: 0.15
  use_amp: true
  gradient_accumulation_steps: 32
  max_grad_norm: 1.0
  use_tf32: true
  use_gradient_checkpointing: false
  auto_generate_checkpoints: false
  checkpoint_schedule: []
  resume_from_checkpoint: false
  compile_mode: null

rater_sweep:
  enabled: true
  kind: race
  # ~3 epochs: ~130M tokens/epoch with separators / 131K tokens per step
  # -> ~1000 optimizer steps per epoch.
  sweep_train_steps: 3000
  scheduler_epochs: 30         # the production horizon, from the chunk count
  eval_every_steps: 250
  eval_max_sequences: 4000     # 512K held-out tokens
  patience_evals: 8
  min_steps_before_stop: 2000
  min_rel_improvement: 0.002
  # Set from the pilot (sweep 430xqpaf, LR 6e-4, 2026-10-20): it sat at
  # 6.1-6.3 to step 500, escaped between steps 500 and 750 (66-98M tokens, LR
  # crossing ~2e-4 in warmup) and read 4.08 at step 1000, 3.69 at 1500. A 3e-4
  # trial only reaches 2.4e-4 at step ~1500, so the gate sits at step 2000:
  # still >= 5.0 there means stuck (the stalled runs sat at 5.8-6.5).
  gates: [[2000, 5.0]]
  save_final: true

logging:
  use_wandb: true
  wandb_project: "subject-drop-bert-v2"
  level: "INFO"
  dir: "logs"

random_seed: 42
