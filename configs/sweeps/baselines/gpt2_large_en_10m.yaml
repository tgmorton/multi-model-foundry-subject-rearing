# Sweep baseline for (gpt2_large, en). ~345M params (HF gpt2-medium sizing).
# ~3x bigger than our gpt2_medium, used for the H9 within-GPT scaling check.
# Probably needs gradient_accumulation up + smaller physical batch to fit on
# a 24 GB card.

experiment_name: "sweep_baseline_gpt2_large_en_10m"

data:
  source_corpus: "data/raw/en/train_10M/"
  training_corpus: "data/raw/en/train_10M/"
  test_corpus: "data/raw/en/test_10M/"
  batch_size: 4                   # drops from 16 — large model needs more VRAM per sample
  max_sequence_length: 1000

dataset_manipulation: []

tokenizer:
  output_dir: "tokenizers/en_shared_unigram/"
  vocab_size: 50004

model:
  architecture: "gpt2"
  transformer:
    layers: 24
    embedding_size: 1024
    hidden_size: 1024
    intermediate_hidden_size: 4096
    attention_heads: 16
    activation_function: "gelu"
    dropout: 0.1
    attention_dropout: 0.1

training:
  output_dir: "models/sweeps/placeholder/"
  learning_rate: 0.0001
  adam_beta1: 0.9
  adam_beta2: 0.99
  adam_epsilon: 1.0e-6
  warmup_ratio: 0.1
  train_steps: null
  warmup_steps: null
  epochs: 10
  sweep_epochs: 10
  production_epochs: 30

  use_amp: true
  gradient_accumulation_steps: 32              # locked: effective_batch_size=128 / micro_bs=4 (10M sweep matches batch size across archs)
  max_grad_norm: 1.0
  use_tf32: true
  use_gradient_checkpointing: false  # OFF (2026-06-05): paid ~25% recompute for unused memory headroom; phys batch fits without it

  auto_generate_checkpoints: false
  checkpoint_schedule: []
  resume_from_checkpoint: false
  compile_mode: "default"  # Inductor (2026-06-05): ~8-18% on transformers; A/B parity-gated before matrix

logging:
  use_wandb: true
  wandb_project: "subject-drop-prod-hp-10m"
  level: "INFO"
  dir: "logs"

random_seed: 42
