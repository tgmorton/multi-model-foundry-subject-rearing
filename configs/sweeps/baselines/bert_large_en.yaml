# Sweep baseline for (bert_large, en). The sweep_agent_lm.py worker
# reads this file, overlays the sampled HPs from wandb.config, and
# trains for the proxy horizon.
#
# BERT-specific: masked_lm objective (not causal_lm), needs CLS/SEP/MASK
# special tokens, own tokenizer dir (en_bert_large).

experiment_name: "sweep_baseline_bert_large_en"

data:
  source_corpus: "data/raw/en/train_90M/"
  training_corpus: "data/raw/en/train_90M/"
  test_corpus: "data/raw/en/test_10M/"
  batch_size: 4
  max_sequence_length: 1000

dataset_manipulation: []

tokenizer:
  output_dir: "tokenizers/en_bert_wordpiece/"
  vocab_size: 50004
  tokenizer_type: "wordpiece"       # BERT-style WordPiece + NFD/StripAccents/Lowercase
  special_tokens:
    cls_token: "[CLS]"
    sep_token: "[SEP]"
    mask_token: "[MASK]"
    unk_token: "[UNK]"
    pad_token: "[PAD]"

model:
  architecture: "bert"
  transformer:
    layers: 24
    embedding_size: 1024
    hidden_size: 1024
    intermediate_hidden_size: 4096
    attention_heads: 16
    activation_function: "gelu"
    dropout: 0.1                   # overridden per trial
    attention_dropout: 0.1         # overridden per trial

training:
  output_dir: "models/sweeps/placeholder/"
  learning_rate: 0.0001            # overridden per trial
  adam_beta1: 0.9
  adam_beta2: 0.999                # overridden per trial
  adam_epsilon: 1.0e-6
  warmup_ratio: 0.1                # overridden per trial
  train_steps: null
  warmup_steps: null
  epochs: 3                        # overridden to sweep_epochs
  sweep_epochs: 10
  production_epochs: 30

  objective: "masked_lm"
  mlm_probability: 0.15

  use_amp: true
  gradient_accumulation_steps: 16  # overridden via effective_batch_size
  max_grad_norm: 1.0
  use_tf32: true
  use_gradient_checkpointing: true

  auto_generate_checkpoints: false
  checkpoint_schedule: []
  resume_from_checkpoint: false
  compile_mode: null

logging:
  use_wandb: true
  wandb_project: "subject-drop-prod-hp"
  level: "INFO"
  dir: "logs"

random_seed: 42
