name: lstm_en_10m
program: scripts/sweep_agent_lm.py
method: bayes
metric:
  name: proxy/min_held_out_perplexity
  goal: minimize
parameters:
  arch:
    value: lstm
  lang:
    value: en
  base_config:
    value: configs/sweeps/baselines/lstm_en_10m.yaml
  learning_rate:
    distribution: log_uniform_values
    min: 1e-4
    max: 1e-2
  warmup_ratio:
    distribution: uniform
    min: 0.03
    max: 0.15
  dropout:
    distribution: uniform
    min: 0.0
    max: 0.3
  effective_batch_size:
    # LOCKED at 128 across all 12 archs for the 10M sweep so trajectory
    # comparisons are not confounded by per-arch batch size variation.
    # See sensitivity discussion: trajectory-comparable = matched bs.
    value: 128
  adam_beta2:
    values:
    - 0.95
    - 0.99
    - 0.999
