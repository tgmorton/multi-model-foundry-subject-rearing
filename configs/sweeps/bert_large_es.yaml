name: bert_large_es
program: scripts/sweep_agent_lm.py
method: bayes

metric:
  name: proxy/held_out_perplexity
  goal: minimize

early_terminate:
  type: hyperband
  min_iter: 500
  eta: 3

parameters:
  arch: {value: bert_large}
  lang: {value: es}
  base_config: {value: configs/sweeps/baselines/bert_large_es.yaml}
  learning_rate: {distribution: log_uniform_values, min: 1e-5, max: 1e-3}
  warmup_ratio: {distribution: uniform, min: 0.03, max: 0.15}
  dropout: {distribution: uniform, min: 0.0, max: 0.3}
  attention_dropout: {distribution: uniform, min: 0.0, max: 0.3}
  effective_batch_size: {values: [128, 256, 512, 1024]}
  adam_beta2: {values: [0.95, 0.99, 0.999]}
