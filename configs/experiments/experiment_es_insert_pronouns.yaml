# ===================================================================
# EXPERIMENT: Insert Pronouns (Spanish)
# GOAL: Train a model on Spanish corpus with overt subject pronouns
#       recovered and inserted into null-subject finite clauses using
#       the trained pronoun-recovery detector + insertion module.
#       Tests whether over-pronominal (English-like) input causes
#       Spanish-trained models to mis-learn null-subject licensing.
#
# PIPELINE NOTE: the pronoun insertion is performed offline by the
# analysis/pronoun_recovery stack (see configs/analysis/pronoun_recovery/
# pronoun_recovery_es_insert.yaml). This experiment config then trains
# on the pre-inserted corpus with an identity ablation (empty
# dataset_manipulation). Run in order:
#
#   1. python -m analysis.pronoun_recovery.run europarl-align --config
#      configs/analysis/pronoun_recovery/pronoun_recovery_es_europarl_train.yaml
#   2. python -m analysis.pronoun_recovery.run tree-extract + tree-train
#      --config configs/analysis/pronoun_recovery/pronoun_recovery_es_tree_detector.yaml
#   3. python -m analysis.pronoun_recovery.run insert
#      --config configs/analysis/pronoun_recovery/pronoun_recovery_es_insert.yaml
#      (writes to data/pronoun_recovery/inserted/es/)
#   4. Run this experiment_es_insert_pronouns.yaml to train the LM.
# ===================================================================

experiment_name: "exp_insert_pronouns_es"

# --- Data Configuration ---
data:
  # Source is the pre-inserted corpus from the analysis pipeline
  source_corpus: "data/pronoun_recovery/inserted/es/"
  training_corpus: "data/pronoun_recovery/inserted/es/"
  test_corpus: "data/spanish/test_10M/"
  batch_size: 32
  max_sequence_length: 1000

# --- Dataset Manipulation Pipeline ---
# Empty — insertion is performed offline by the pronoun_recovery pipeline.
dataset_manipulation: []

# --- Tokenizer Configuration ---
tokenizer:
  output_dir: "tokenizers/exp_insert_pronouns_es/"
  vocab_size: 50004

# --- Model Architecture ---
model:
  layers: 12
  embedding_size: 768
  hidden_size: 768
  intermediate_hidden_size: 3072
  attention_heads: 12
  activation_function: "gelu"
  dropout: 0.1
  attention_dropout: 0.1

# --- Training Procedure ---
training:
  output_dir: "models/exp_insert_pronouns_es/"
  learning_rate: 0.0004
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 1.0e-6
  warmup_steps: null
  warmup_ratio: 0.1
  train_steps: null
  epochs: 20
  use_amp: true
  gradient_accumulation_steps: 8
  max_grad_norm: 1.0
  use_tf32: true
  use_gradient_checkpointing: true
  use_flash_attention: true
  auto_generate_checkpoints: true
  first_epoch_checkpoints: 20
  subsequent_epochs_spacing: "log"
  log_base: 2
  min_checkpoint_interval: 100
  min_checkpoints_per_epoch: 5

# --- Logging & Reproducibility ---
logging:
  use_wandb: true
  wandb_project: "just-drop-the-subject"

random_seed: 9
