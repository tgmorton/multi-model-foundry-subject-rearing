# ===================================================================
# EXPERIMENT 0: Baseline — SMOKE TEST VARIANT
#
# Same as experiment_0_baseline_90M but limits training to ~20 optimizer
# steps so the full tokenize → chunk → train pipeline can be validated
# end-to-end on real data in ~10-20 min on a 3090.
#
# Tuned for RTX 3090 (24GB VRAM) with lower effective batch to leave
# headroom for the smoke run.
# ===================================================================

experiment_name: "exp0_baseline_90M_smoke"

# --- Data Configuration ---
data:
  source_corpus: "data/raw/train_90M/"
  training_corpus: "data/raw/train_90M/"
  test_corpus: "data/raw/test_10M/"
  batch_size: 8        # 3090-safe micro-batch (was 32 in full config)
  max_sequence_length: 1000

dataset_manipulation: []

tokenizer:
  output_dir: "tokenizers/exp0_baseline_90M_smoke/"
  vocab_size: 50004

# --- Model Architecture (matches full baseline) ---
model:
  layers: 12
  embedding_size: 768
  hidden_size: 768
  intermediate_hidden_size: 3072
  attention_heads: 12
  activation_function: "gelu"
  dropout: 0.1
  attention_dropout: 0.1

# --- Training (smoke-run limits) ---
training:
  output_dir: "models/exp0_baseline_90M_smoke/"
  learning_rate: 0.0001
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 1.0e-6
  # Cap duration at 20 optimizer steps — enough to validate
  # forward/backward/optimizer/scheduler/checkpoint machinery
  train_steps: 20
  warmup_steps: 5
  warmup_ratio: 0.1
  epochs: 1

  use_amp: true
  gradient_accumulation_steps: 8   # Effective batch: 8 * 8 = 64
  max_grad_norm: 1.0
  use_tf32: true
  use_gradient_checkpointing: true

  # Only a handful of checkpoints during the smoke run
  auto_generate_checkpoints: true
  first_epoch_checkpoints: 3
  subsequent_epochs_spacing: "log"
  log_base: 2
  min_checkpoint_interval: 5
  min_checkpoints_per_epoch: 2
  resume_from_checkpoint: false

logging:
  use_wandb: false        # Disable WandB for the smoke run
  level: "INFO"
  dir: "logs"

random_seed: 9
