# ===================================================================
# EXPERIMENT 0: Baseline — FULL PRODUCTION RUN
# Train GPT-2 from scratch on the unaltered 90M BabyLM corpus.
# Serves as the control against which all ablations are measured.
#
# Tuning notes for RTX 3090 (24GB VRAM):
#   - batch_size=16, grad_accum=16 → effective batch 256
#   - Smoke run confirmed batch=8 uses ~7.3GB; batch=16 ~14GB fits
#     comfortably with AMP + gradient checkpointing
#   - resume_from_checkpoint=true so preemption auto-recovers (tested
#     end-to-end by job-train-baseline-smoke-resume)
# ===================================================================

experiment_name: "exp0_baseline_90M_full"

# --- Data ---
data:
  source_corpus: "data/raw/train_90M/"
  training_corpus: "data/raw/train_90M/"
  test_corpus: "data/raw/test_10M/"
  batch_size: 16
  max_sequence_length: 1000

dataset_manipulation: []

# --- Tokenizer ---
# Reuse the tokenizer already trained during the smoke runs. Idempotency
# check in train-tokenizer will skip (re-)training when this dir contains
# tokenizer.model.
tokenizer:
  output_dir: "tokenizers/exp0_baseline_90M_smoke/"
  vocab_size: 50004

# --- Model (matches paper Table 5: 124M GPT-2) ---
model:
  layers: 12
  embedding_size: 768
  hidden_size: 768
  intermediate_hidden_size: 3072
  attention_heads: 12
  activation_function: "gelu"
  dropout: 0.1
  attention_dropout: 0.1

# --- Training ---
training:
  output_dir: "models/exp0_baseline_90M_full/"

  # Optimiser
  learning_rate: 0.0001
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 1.0e-6

  # Duration — auto-computed from epochs
  train_steps: null
  warmup_steps: null
  warmup_ratio: 0.1
  epochs: 10                           # Reduced from 20 to keep wall time tractable

  # Mixed precision + gradient accumulation
  use_amp: true
  gradient_accumulation_steps: 16      # Effective batch 16 * 16 = 256
  max_grad_norm: 1.0
  use_tf32: true
  use_gradient_checkpointing: true

  # Checkpointing — dense early, log-spaced later
  auto_generate_checkpoints: true
  first_epoch_checkpoints: 20
  subsequent_epochs_spacing: "log"
  log_base: 2
  linear_interval: null
  min_checkpoint_interval: 100
  min_checkpoints_per_epoch: 5

  # Auto-resume on preemption (save+load round-trip validated by
  # job-train-baseline-smoke-resume)
  resume_from_checkpoint: true

  # No torch.compile — 'default' caused issues in earlier runs
  compile_mode: 'None'

# --- Logging / W&B ---
logging:
  use_wandb: true
  wandb_project: "just-drop-the-subject"
  level: "INFO"
  dir: "logs"

random_seed: 9
