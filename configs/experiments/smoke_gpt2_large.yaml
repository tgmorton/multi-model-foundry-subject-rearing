# ===================================================================
# SMOKE TEST — GPT-2 large (774M)
# Validates full pipeline + checkpoint resume round-trip.
# Very aggressive memory settings: batch=1, grad_checkpointing=true.
# Shares tokenizer with exp0_baseline_90M_smoke (idempotent skip).
# ===================================================================

experiment_name: "smoke_gpt2_large"

data:
  source_corpus: "data/raw/train_90M/"
  training_corpus: "data/raw/train_90M/"
  test_corpus: "data/raw/test_10M/"
  batch_size: 1
  max_sequence_length: 256

dataset_manipulation: []

tokenizer:
  output_dir: "tokenizers/exp0_baseline_90M_smoke/"
  vocab_size: 50004

model:
  architecture: "gpt2"
  transformer:
    layers: 36
    embedding_size: 1280
    hidden_size: 1280
    intermediate_hidden_size: 5120
    attention_heads: 20
    activation_function: "gelu"
    dropout: 0.1
    attention_dropout: 0.1

training:
  output_dir: "models/smoke_gpt2_large/"
  learning_rate: 0.0001
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 1.0e-6
  train_steps: 6                   # overridden in-job
  warmup_steps: 1
  warmup_ratio: 0.1
  epochs: 1
  objective: "causal_lm"
  use_amp: true
  gradient_accumulation_steps: 8
  max_grad_norm: 1.0
  use_tf32: true
  use_gradient_checkpointing: true
  auto_generate_checkpoints: false
  checkpoint_schedule: [5]         # overridden in-job
  resume_from_checkpoint: false    # overridden in-job

logging:
  use_wandb: false
  level: "INFO"
  dir: "logs"

random_seed: 9
