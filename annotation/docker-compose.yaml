services:
  annotation:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8643:8643"
    volumes:
      - annotation-data:/app/annotation/data
    environment:
      - ANNOTATION_SEED_USERS=[{"username":"admin","display_name":"Admin","role":"admin"},{"username":"annotator1","display_name":"Annotator 1","role":"annotator"},{"username":"annotator2","display_name":"Annotator 2","role":"annotator"}]
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-var:/var/lib/letsencrypt:ro
    depends_on:
      - annotation
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  annotation-data:
  certbot-etc:
  certbot-var:
