<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<base href="./">
<title>Annotation Admin</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #fff; --border: #e2e4e8;
    --accent: #2563eb; --accent-hover: #1d4ed8; --accent-light: #dbeafe;
    --muted: #71757e; --text: #1a1a1a;
    --yes-bg: #dcfce7; --yes-text: #166534;
    --no-bg: #fee2e2; --no-text: #991b1b;
    --warn-bg: #fef9c3; --warn-text: #854d0e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.5;
  }
  .header {
    background: #fff; border-bottom: 1px solid var(--border); padding: 12px 24px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .header h1 { font-size: 1.05rem; font-weight: 700; }
  .header-links { display: flex; gap: 14px; font-size: 0.82rem; }
  .header-links a { color: var(--accent); text-decoration: none; }
  .header-links a:hover { text-decoration: underline; }

  .main { max-width: 900px; margin: 0 auto; padding: 24px; }
  .section { margin-bottom: 24px; }
  .section h2 { font-size: 0.95rem; font-weight: 700; margin-bottom: 10px; }

  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 8px;
    padding: 16px; margin-bottom: 12px;
  }

  table { width: 100%; border-collapse: collapse; font-size: 0.84rem; }
  th { text-align: left; font-weight: 600; padding: 8px; border-bottom: 2px solid var(--border); }
  td { padding: 8px; border-bottom: 1px solid var(--border); }
  .num { text-align: right; font-variant-numeric: tabular-nums; }

  .metric-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
  .metric-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 14px;
  }
  .metric-label { font-size: 0.76rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
  .metric-value { font-size: 1.3rem; font-weight: 700; margin-top: 4px; }

  .badge {
    display: inline-block; padding: 2px 8px; border-radius: 4px;
    font-size: 0.76rem; font-weight: 600;
  }
  .badge-agree { background: var(--yes-bg); color: var(--yes-text); }
  .badge-disagree { background: var(--no-bg); color: var(--no-text); }
  .badge-partial { background: var(--warn-bg); color: var(--warn-text); }

  .upload-area {
    border: 2px dashed var(--border); border-radius: 8px; padding: 20px;
    text-align: center; cursor: pointer; transition: all 0.15s;
  }
  .upload-area:hover { border-color: var(--accent); background: var(--accent-light); }
  .upload-area input { display: none; }
  .upload-status { margin-top: 8px; font-size: 0.82rem; }

  .btn {
    padding: 7px 18px; border: 1px solid var(--border); border-radius: 6px;
    font-size: 0.84rem; cursor: pointer; background: var(--card); font-weight: 500;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn-primary:hover { background: var(--accent-hover); }
  .actions { display: flex; gap: 8px; margin-top: 12px; }

  .login-overlay {
    position: fixed; inset: 0; background: var(--bg);
    display: flex; align-items: center; justify-content: center; z-index: 1000;
  }
  .login-overlay.hidden { display: none; }
  .login-box {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 32px; width: 340px;
  }
  .login-box h2 { font-size: 1.1rem; margin-bottom: 16px; }
  .login-box input {
    width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px;
    font-size: 0.88rem; margin-bottom: 10px; font-family: inherit;
  }
  .login-box button {
    width: 100%; padding: 9px; background: var(--accent); color: #fff; border: none;
    border-radius: 6px; font-size: 0.88rem; font-weight: 600; cursor: pointer;
  }
  .login-error { color: var(--no-text); font-size: 0.8rem; margin-top: 8px; }
</style>
</head>
<body>

<div class="login-overlay" id="loginOverlay">
  <div class="login-box">
    <h2>Admin Login</h2>
    <input id="loginUser" placeholder="Username">
    <input id="loginToken" type="password" placeholder="Token">
    <button onclick="doLogin()">Log in</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<div class="header">
  <h1>Annotation Admin</h1>
  <div class="header-links">
    <a href="./">Annotate</a>
    <a href="adjudication">Adjudicate</a>
    <span id="userName" style="color:var(--muted);font-weight:600"></span>
  </div>
</div>

<div class="main" id="mainContent" style="display:none">

  <!-- Upload stimuli -->
  <div class="section">
    <h2>Load Stimuli</h2>
    <div class="card">
      <div class="upload-area" onclick="document.getElementById('fileInput').click()">
        <input type="file" id="fileInput" accept=".jsonl,.txt,.json" onchange="uploadFile(this)">
        <div>Click to upload JSONL or text file</div>
        <div class="upload-status" id="uploadStatus"></div>
      </div>
    </div>
  </div>

  <!-- Annotator progress -->
  <div class="section">
    <h2>Annotator Progress</h2>
    <div class="card">
      <table>
        <thead><tr><th>Annotator</th><th class="num">Completed</th><th class="num">Total</th><th class="num">%</th><th class="num">Starred</th></tr></thead>
        <tbody id="progressTable"></tbody>
      </table>
    </div>
  </div>

  <!-- Agreement metrics -->
  <div class="section">
    <h2>Inter-Annotator Agreement</h2>
    <div class="metric-grid" id="metricsGrid"></div>
    <div class="card" id="breakdownCard" style="margin-top:12px;display:none">
      <h3 style="font-size:0.88rem;margin-bottom:8px">Per-stimulus breakdown</h3>
      <table>
        <thead><tr><th>ID</th><th>Category</th><th>A</th><th>B</th><th>A Decision</th><th>B Decision</th></tr></thead>
        <tbody id="breakdownTable"></tbody>
      </table>
    </div>
  </div>

  <!-- Users -->
  <div class="section">
    <h2>Users</h2>
    <div class="card">
      <table>
        <thead><tr><th>Username</th><th>Display Name</th><th>Role</th><th>Token</th></tr></thead>
        <tbody id="usersTable"></tbody>
      </table>
    </div>
  </div>

  <!-- Export -->
  <div class="section">
    <h2>Export</h2>
    <div class="actions">
      <button class="btn btn-primary" onclick="exportGold()">Export Gold JSONL</button>
      <button class="btn" onclick="exportRaw()">Export Raw Annotations</button>
      <button class="btn" onclick="exportAgreement()">Export Agreement CSV</button>
    </div>
  </div>
</div>

<script>
let token = localStorage.getItem('ann_token') || '';

async function api(method, path, body) {
  const opts = {
    method,
    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
  };
  if (body !== undefined) opts.body = JSON.stringify(body);
  const res = await fetch(path, opts);
  if (res.status === 401 || res.status === 403) { doLogout(); throw new Error('Unauthorized'); }
  if (!res.ok) throw new Error(`API error ${res.status}`);
  return res.json();
}

async function doLogin() {
  const username = document.getElementById('loginUser').value.trim();
  const tk = document.getElementById('loginToken').value.trim();
  try {
    const res = await fetch('api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, token: tk }),
    });
    if (!res.ok) throw new Error('Invalid credentials');
    const data = await res.json();
    if (data.user.role !== 'admin') throw new Error('Admin access required');
    token = data.token;
    localStorage.setItem('ann_token', token);
    document.getElementById('loginOverlay').classList.add('hidden');
    document.getElementById('userName').textContent = data.user.display_name;
    document.getElementById('mainContent').style.display = '';
    loadAll();
  } catch (e) {
    document.getElementById('loginError').textContent = e.message;
  }
}

function doLogout() {
  localStorage.removeItem('ann_token');
  location.reload();
}

async function checkAuth() {
  if (!token) return false;
  try {
    const user = await api('GET', 'api/auth/me');
    if (user.role !== 'admin') return false;
    document.getElementById('userName').textContent = user.display_name;
    return true;
  } catch { return false; }
}

async function loadAll() {
  await Promise.all([loadProgress(), loadAgreement(), loadUsers()]);
}

async function loadProgress() {
  const data = await api('GET', 'api/agreement/status');
  const tbody = document.getElementById('progressTable');
  tbody.innerHTML = data.map(u => `
    <tr>
      <td>${u.display_name}</td>
      <td class="num">${u.completed}</td>
      <td class="num">${u.total}</td>
      <td class="num">${u.total > 0 ? (u.completed / u.total * 100).toFixed(1) : 0}%</td>
      <td class="num">${u.starred}</td>
    </tr>
  `).join('');
}

async function loadAgreement() {
  try {
    const data = await api('GET', 'api/agreement/compute');
    const grid = document.getElementById('metricsGrid');

    const fmt = (v) => v === null || v === undefined ? '--' : v.toFixed(3);
    grid.innerHTML = `
      <div class="metric-card">
        <div class="metric-label">Doubly annotated</div>
        <div class="metric-value">${data.n_doubly_annotated}</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">Binary agreement</div>
        <div class="metric-value">${fmt(data.binary.percent_agreement)}</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">Binary kappa</div>
        <div class="metric-value">${fmt(data.binary.kappa)}</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">Position exact match</div>
        <div class="metric-value">${fmt(data.position.exact_match_rate)}</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">Position Jaccard</div>
        <div class="metric-value">${fmt(data.position.mean_jaccard)}</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">Label exact match</div>
        <div class="metric-value">${fmt(data.label.exact_match_rate)}</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">Label kappa</div>
        <div class="metric-value">${fmt(data.label.kappa)}</div>
      </div>
    `;

    if (data.per_stimulus && data.per_stimulus.length > 0) {
      const card = document.getElementById('breakdownCard');
      card.style.display = '';
      const tbody = document.getElementById('breakdownTable');
      const categoryBadge = (cat) => {
        const cls = cat === 'full_agreement' ? 'badge-agree' :
                    cat === 'binary_disagreement' ? 'badge-disagree' : 'badge-partial';
        return `<span class="badge ${cls}">${cat.replace('_', ' ')}</span>`;
      };
      tbody.innerHTML = data.per_stimulus.map(s => `
        <tr>
          <td>${s.stimulus_id}</td>
          <td>${categoryBadge(s.category)}</td>
          <td>${s.annotator_a}</td>
          <td>${s.annotator_b}</td>
          <td>${s.a_decision}</td>
          <td>${s.b_decision}</td>
        </tr>
      `).join('');
    }
  } catch(e) {
    console.error('Agreement load error:', e);
  }
}

async function loadUsers() {
  const data = await api('GET', 'api/admin/users');
  const tbody = document.getElementById('usersTable');
  tbody.innerHTML = data.map(u => `
    <tr>
      <td>${u.username}</td>
      <td>${u.display_name}</td>
      <td>${u.role}</td>
      <td style="font-family:monospace;font-size:0.76rem;color:var(--muted)">${u.token}</td>
    </tr>
  `).join('');
}

async function uploadFile(input) {
  const file = input.files[0];
  if (!file) return;
  const status = document.getElementById('uploadStatus');
  status.textContent = 'Uploading...';

  const formData = new FormData();
  formData.append('file', file);

  try {
    const res = await fetch('api/stimuli/load', {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${token}` },
      body: formData,
    });
    if (!res.ok) throw new Error(`Upload failed: ${res.status}`);
    const data = await res.json();
    status.textContent = `Loaded ${data.loaded} stimuli`;
    loadProgress();
  } catch (e) {
    status.textContent = 'Error: ' + e.message;
  }
}

function downloadJSON(data, filename) {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}

async function exportGold() {
  const data = await api('GET', 'api/export/gold');
  const lines = data.map(r => JSON.stringify(r)).join('\n') + '\n';
  const blob = new Blob([lines], { type: 'application/jsonl' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'gold.jsonl'; a.click();
  URL.revokeObjectURL(url);
}

async function exportRaw() {
  const data = await api('GET', 'api/export/raw');
  downloadJSON(data, 'raw_annotations.json');
}

async function exportAgreement() {
  const data = await api('GET', 'api/agreement/export');
  const blob = new Blob([data.csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'agreement.csv'; a.click();
  URL.revokeObjectURL(url);
}

(async () => {
  if (await checkAuth()) {
    document.getElementById('loginOverlay').classList.add('hidden');
    document.getElementById('mainContent').style.display = '';
    loadAll();
  }
})();
</script>
</body>
</html>
